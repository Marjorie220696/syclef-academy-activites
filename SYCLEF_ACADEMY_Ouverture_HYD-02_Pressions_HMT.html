<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SYCLEF ACADEMY – Pressions et hauteur manométrique</title>
<style>
:root{--blue:#386FB6;--orange:#F4951F;--green:#94C356;--gl:#B7BECF;--gd:#66778F;--white:#FFFFFF;--txt:#4F5E74;
  --b06:rgba(56,111,182,.06);--b12:rgba(56,111,182,.12);--b25:rgba(56,111,182,.25);--o12:rgba(244,149,31,.13);--odk:#A85F06;--g15:rgba(148,195,86,.17);--gdk:#4C7A1C;--gl35:rgba(183,190,207,.35);
  --font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;--r:14px;--sh:0 4px 16px rgba(102,119,143,.14)}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;overflow-y:auto}
html,body{margin:0;padding:0;width:100%;max-width:100%;height:auto;min-height:100%;background:var(--white)}
body{font-family:var(--font);color:var(--txt);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
img,svg{max-width:100%;height:auto}
button{font-family:inherit;font-size:inherit}
h1{color:var(--blue);line-height:1.15;margin:0}
p{margin:.4em 0}
.app{container-type:inline-size;width:100%;max-width:1040px;margin:0 auto;padding:0 12px 24px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* En-tête : logo + sélecteur de langue (identique aux activités SYCLEF Academy) */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 0 10px;border-bottom:1px solid var(--gl35);margin-bottom:16px}
.logo{display:block;height:54px;width:auto;flex:0 0 auto}
.lang{position:relative;flex:0 0 auto}
.lang-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:2px solid var(--gl);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:4px 10px;cursor:pointer}
.lang-btn .car{font-size:.8em;opacity:.8}
.flag{display:block;width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(102,119,143,.35);flex:0 0 auto;overflow:hidden}
.lang-list{position:absolute;right:0;top:calc(100% + 6px);z-index:20;list-style:none;margin:0;padding:6px;min-width:200px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--gl);border-radius:12px;box-shadow:0 10px 26px rgba(79,94,116,.22);display:none}
.lang.open .lang-list{display:block}
.lang-list li{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--txt)}
.lang-list li[aria-selected="true"]{background:var(--b12);color:var(--blue)}
.lang-list li.act,.lang-list li:focus{outline:none;background:var(--b06)}
.lang-list li[aria-selected="true"]::after{content:"✓";margin-left:auto;color:var(--blue)}

/* Écran d'ouverture */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;background:#fff;border:1px solid var(--gl35);border-radius:var(--r);box-shadow:var(--sh);padding:16px;overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--blue)}
@container (min-width:780px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);padding:26px 26px 26px 32px}.visual{order:2}}
.visual{position:relative;border-radius:12px;overflow:hidden;background:var(--b06);aspect-ratio:16/10}
.visual img{display:block;width:100%;height:100%;object-fit:cover}
.visual::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--blue) 0 55%,var(--orange) 55% 80%,var(--green) 80% 100%)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--odk);background:var(--o12);border-radius:99px;padding:4px 12px}
.code{display:block;margin-top:10px;font-size:.88rem;font-weight:700;color:var(--gd)}
h1{font-size:clamp(1.6rem,5.2cqi,2.5rem);margin:4px 0 10px}
.hook{font-size:1.08rem;color:var(--txt);margin:0 0 14px}
.in{font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;font-size:.88rem;margin:0 0 8px}
.ben{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.ben li{display:flex;align-items:flex-start;gap:10px;background:var(--b06);border-radius:10px;padding:8px 12px;font-weight:700}
.ben li .i{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:6px 12px;background:#fff;border:2px solid var(--b25);font-weight:700;color:var(--blue);max-width:100%}
.chip small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gd);font-weight:700}
.chip.soft{border-color:var(--gl35);color:var(--txt);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;max-width:100%;padding:12px 30px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-align:center;white-space:normal;touch-action:manipulation;box-shadow:0 6px 16px rgba(56,111,182,.3)}
.btn:hover{background:#2F5F9D}
.btn .ar{font-size:1.2em}
.ok{display:flex;align-items:center;gap:10px;margin-top:12px;border-radius:10px;padding:10px 12px;background:var(--g15);color:var(--gdk);font-weight:700}
.ok .i{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--green);color:#24400A;display:grid;place-items:center}
@container (max-width:480px){.logo{height:46px}.hero{padding:12px 12px 14px 18px}.btn{width:100%}.hook{font-size:1rem}}
@supports not (container-type:inline-size){@media (min-width:780px){.hero{grid-template-columns:1.05fr 1fr}.visual{order:2}}h1{font-size:clamp(1.6rem,4vw,2.5rem)}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}}
@keyframes fade{from{opacity:.25}to{opacity:1}}
</style>
</head>
