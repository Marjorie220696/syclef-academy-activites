<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HYD-02 | Pressions et hauteur manométrique – Relevez le défi de fin de module</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
:root{--k:1;--fs:calc(var(--k) * clamp(14px, 0.55vw + 0.85vh + 3px, 19px));--cyan:#55C2FB;--orange:#FA9035;--ok:#5EE0A0;--ko:#FF9A8C;--line:rgba(170,210,255,.30);--muted:#CFDDF2}
body{font-family:Calibri,Arial,sans-serif;color:#F4F8FF;background:#0b2350;font-size:var(--fs);line-height:1.3;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 80% 55% at 50% -8%,rgba(103,164,225,.55),transparent 60%),radial-gradient(ellipse 60% 50% at 88% 110%,rgba(85,194,251,.16),transparent 60%),linear-gradient(180deg,#1d5296 0%,#164382 35%,#0f3268 70%,#0a234c 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.defs{position:absolute;width:0;height:0;overflow:hidden}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #FFD27A;outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:middle}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,28px)}
.mod{margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.tbtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:.45em;padding:0 .9em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-weight:700;font-size:.9em}
.tbtn:hover{background:rgba(255,255,255,.15)}
.langbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px;min-height:44px}
.langbox label{font-weight:700;font-size:.9em}
select{font:inherit;color:#fff;background:#12396f;border:1px solid var(--line);border-radius:9px;min-height:40px;padding:0 6px;max-width:100%}

/* Progression */
.prog{display:flex;align-items:center;gap:clamp(8px,2vw,22px);padding:0 clamp(10px,2vw,28px) clamp(6px,1.1vh,12px)}
.prog[hidden],.nav[hidden]{display:none}
.ptxt{margin:0;font-weight:700;white-space:nowrap;font-size:.95em}
.dots{display:flex;list-style:none;margin:0;padding:0;flex:1;align-items:center;min-width:0}
.dots li{flex:1;display:flex;align-items:center;min-width:0}
.dots li:last-child{flex:0 0 auto}
.dot{width:clamp(20px,2.3vw,28px);height:clamp(20px,2.3vw,28px);border-radius:50%;display:grid;place-items:center;font-size:.72em;font-weight:700;border:2px solid rgba(207,221,242,.45);color:rgba(235,243,255,.75);background:rgba(255,255,255,.05);flex:none;transition:transform .25s}
.dot svg{width:70%;height:70%}
.dot.done{background:var(--cyan);border-color:var(--cyan);color:#0b2350}
.dot.cur{border-color:var(--orange);color:#fff;background:rgba(250,144,53,.28);transform:scale(1.2);box-shadow:0 0 0 4px rgba(250,144,53,.22)}
.seg{flex:1;height:3px;margin:0 4px;border-radius:2px;background:rgba(207,221,242,.22)}
.seg.done{background:var(--cyan)}

/* Zone principale */
main{min-height:0;overflow:hidden;padding:0 clamp(10px,2vw,28px);display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
main>*{min-height:0;min-width:0}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(0,12,45,.35),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fit{overflow:hidden}
.btn{min-height:44px;min-width:44px;padding:.45em 1.1em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.09);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1.1}
.btn:hover:not(:disabled){background:rgba(255,255,255,.17)}
.btn.pri{background:linear-gradient(180deg,#FFB06A,#FA9035);color:#0b1f3f;border-color:#FFC896;box-shadow:0 6px 18px rgba(250,144,53,.35)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#FFC08A,#FF9C45)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.big{font-size:1.2em;padding:.6em 2.1em}
h1,h2,h3{margin:0;line-height:1.15}

/* Introduction */
.intro{display:grid;place-items:center;min-height:0;padding-bottom:clamp(6px,1.4vh,16px)}
.icard{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1.5vh,16px);padding:clamp(12px,2.2vw,30px)}
.icard img{width:100%;height:auto;max-height:30vh;object-fit:cover;border-radius:14px;min-height:0;flex:0 1 auto;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.intro.c1 .icard img{max-height:16vh}
.intro.c2 .icard img{display:none}
h1{font-size:2.15em}
.lead{margin:0;font-size:1.15em;font-weight:700}
.case{margin:0;color:var(--muted);max-width:52em}
.meta{margin:0;font-size:.85em;border:1px solid var(--line);border-radius:999px;padding:.25em .9em;color:#E6F0FF}

/* Étape */
.step{display:grid;gap:clamp(8px,1.4vw,18px);grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-bottom:2px}
.visual{order:-1;display:flex;flex-direction:column;padding:clamp(6px,1vw,14px);min-height:0;min-width:0}
.qpanel{display:flex;flex-direction:column;gap:.5em;padding:clamp(10px,1.4vw,22px);min-height:0;min-width:0}
.stagewrap{flex:1;min-height:0;min-width:0;container-type:size;display:grid;place-items:center}
.stage{position:relative;width:min(100cqw,calc(100cqh * 5 / 3));height:min(100cqh,calc(100cqw * 3 / 5))}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.qhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.badge{background:var(--orange);color:#0b1f3f;font-weight:700;border-radius:999px;padding:.12em .7em;font-size:.8em;white-space:nowrap}
h2{font-size:1.3em}
.sit{margin:0;color:var(--muted)}
.sit .lab{display:inline-block;font-weight:700;color:#fff;font-size:.74em;text-transform:uppercase;letter-spacing:.06em;margin-inline-end:.5em;border:1px solid var(--line);border-radius:6px;padding:0 .4em;vertical-align:1px}
.q{margin:0;font-weight:700;font-size:1.08em;color:#fff}
.hint{margin:0;font-size:.86em;color:var(--muted)}
.inter{display:flex;flex-direction:column;gap:.42em}
.qpanel>*{flex-shrink:0}
.qpanel{container-type:inline-size}
@container (min-width:440px){.arow{flex-direction:row;align-items:center;gap:.6em}.arow label{flex:0 0 36%}.arow select{flex:1;min-width:0}}
.step.c1 .hint{display:none}
.step.c3.answered .sit{display:none}
.opts{display:flex;flex-direction:column;gap:.42em}
.opt{display:flex;align-items:center;gap:.7em;text-align:start;width:100%;min-height:44px;padding:.42em .8em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);line-height:1.2}
.opt:hover:not(:disabled){background:rgba(255,255,255,.13)}
.opt .rad{flex:none;width:1.15em;height:1.15em;border-radius:50%;border:2px solid #D7E8F8;display:grid;place-items:center}
.opt[aria-pressed="true"]{border:2px solid var(--cyan);background:rgba(85,194,251,.17)}
.opt[aria-pressed="true"] .rad::after{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--cyan)}
.opt .otx{flex:1}
.opt .mk{flex:none;display:flex}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:1.15em;font-weight:700;min-height:54px}
.tf .opt .otx{flex:0 1 auto}
.is-ok{border-color:var(--ok)!important;border-width:2px!important;background:rgba(94,224,160,.15)!important}
.is-ko{border-color:var(--ko)!important;border-width:2px!important;background:rgba(255,154,140,.14)!important}

/* Association */
.arow{display:flex;flex-direction:column;gap:.2em}
.arow label{font-weight:700;display:flex;align-items:center;gap:.4em}
.arow select{width:100%;min-height:44px;font-size:.92em}
.sheet{height:100%;display:flex;flex-direction:column;gap:.6em;justify-content:center;padding:.4em .6em}
.sh-t{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.85em;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:.35em}
.srow{display:grid;grid-template-columns:auto minmax(0,.8fr) minmax(0,1.4fr);align-items:center;gap:.7em;padding:.5em .6em;border:1px dashed rgba(207,221,242,.4);border-radius:12px;background:rgba(6,24,56,.35)}
.srow.filled{border-style:solid;border-color:rgba(85,194,251,.65)}
.sic svg{width:clamp(28px,3.4vw,46px);height:auto;display:block}
.sn{font-weight:700}
.sv{color:var(--muted);font-size:.9em}
.srow.filled .sv{color:#fff}

/* Saisie numérique */
.numl{font-weight:700}
.numrow{display:flex;align-items:center;gap:.6em}
.numrow input{font:inherit;font-size:1.25em;width:7em;min-height:48px;border-radius:10px;border:2px solid var(--line);background:rgba(4,20,48,.6);color:#fff;padding:0 .5em}
.numrow input::placeholder{color:#9FB4D3}
.unit{font-weight:700;font-size:1.1em}

/* Classement */
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.32em}
.ord li{display:flex;align-items:center;gap:.5em;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);padding:.12em .25em .12em .6em;min-height:44px}
.pos{font-weight:700;color:var(--muted);width:1.2em;flex:none}
.let{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--orange);color:#0b1f3f;font-weight:700;display:grid;place-items:center;font-size:.85em}
.ord .otx{flex:1;line-height:1.15}
.mv{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.09);display:grid;place-items:center}
.mv:hover:not(:disabled){background:rgba(255,255,255,.18)}
.mv:disabled{opacity:.3}
.ord .mk{display:flex;padding:0 .4em}

/* Étiquettes et zones */
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{min-height:44px;padding:.3em .95em;border-radius:999px;border:2px dashed rgba(207,221,242,.65);background:rgba(10,35,76,.65);font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none}
.chip:hover:not(:disabled){background:rgba(30,70,130,.8)}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--orange);background:rgba(250,144,53,.25)}
.chip .where{font-weight:400;color:var(--muted);font-size:.85em}
.chip.dragging{opacity:.4}
.chip:disabled{cursor:default;opacity:.75}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);padding:.3em .9em;border-radius:999px;border:2px solid var(--orange);background:#16437f;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.zbtn,.hs,.dz{position:absolute;border-radius:14px;display:flex;flex-direction:column;align-items:center;min-width:44px;min-height:44px}
.zbtn{border:2px dashed rgba(207,221,242,.5);background:transparent;justify-content:flex-start;padding-top:.4em}
.zbtn:hover:not(:disabled),.hs:hover:not(:disabled){background:rgba(85,194,251,.1)}
.zbtn[aria-pressed="true"],.hs[aria-pressed="true"]{border:3px solid var(--cyan);background:rgba(85,194,251,.13)}
.hs{border:2px dashed rgba(207,221,242,.6);background:transparent;justify-content:flex-end;padding:.15em}
.ztag{background:rgba(8,26,56,.9);border:1px solid var(--line);border-radius:999px;padding:.15em .75em;font-weight:700;font-size:.92em;display:inline-flex;gap:.35em;align-items:center;line-height:1.15;text-align:center}
.hs .ztag{font-size:.86em;padding:.12em .55em}
.selm{font-weight:400;color:var(--cyan)}
.zbtn:disabled,.hs:disabled,.dz:disabled{cursor:default}
.dz{border:2px dashed rgba(250,144,53,.8);background:rgba(8,26,56,.78);justify-content:center;text-align:center;padding:.15em .3em;font-size:.92em;line-height:1.1}
.dz .zn{font-size:.78em;color:var(--muted);font-weight:700;text-transform:uppercase;display:inline-flex;gap:.3em;align-items:center}
.dz .zv{font-weight:700}
.dz.filled{border-style:solid;border-color:var(--cyan)}
.dz.hover{background:rgba(250,144,53,.3)}

/* Retour pédagogique */
.fb{border-radius:14px;padding:.55em .85em;border:1px solid;display:flex;flex-direction:column;gap:.28em}
.fb.ok{border-color:rgba(94,224,160,.65);background:rgba(16,80,58,.5)}
.fb.ko{border-color:rgba(255,154,140,.65);background:rgba(96,30,42,.5)}
.fb-t{margin:0;font-weight:700;display:flex;align-items:center;gap:.4em;font-size:1.05em}
.fb-x,.fb-k{margin:0;font-size:.95em}
.fb-k .tag{display:inline-block;font-size:.74em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(85,194,251,.22);border:1px solid rgba(85,194,251,.55);border-radius:6px;padding:0 .4em;margin-inline-end:.45em;vertical-align:1px}

/* Résultat */
.result{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(8px,1.4vw,18px);padding-bottom:2px}
.rcard{padding:clamp(12px,1.6vw,24px);display:flex;flex-direction:column;gap:.6em;min-height:0}
.rs-top{display:flex;align-items:center;gap:1.2em;flex-wrap:wrap}
.ring{width:clamp(90px,20vh,170px);height:auto;flex:none}
.rnum{fill:#fff;font:700 28px Calibri,Arial,sans-serif}
.kpis{display:flex;flex-direction:column;gap:.5em}
.kpi{margin:0;display:flex;flex-direction:column}
.kpi span{color:var(--muted);font-size:.85em}
.kpi strong{font-size:1.6em;line-height:1.1}
.lvl{margin:0;font-weight:700;font-size:1.25em;display:flex;align-items:center;gap:.45em}
.lvl3{color:#A8F5CF}.lvl2{color:#FFD9A8}.lvl1{color:#FFC2B8}
.lmsg{margin:0;color:var(--muted)}
h3{font-size:.95em;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
.rsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.35em}
.rsteps li{display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.3em .1em;border-radius:10px;border:1px solid var(--line);font-size:.85em;font-weight:700}
.rsteps li.ok{border-color:rgba(94,224,160,.55)}
.rsteps li.ko{border-color:rgba(255,154,140,.55)}
.notions{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em}
.notions li{display:flex;gap:.55em;align-items:center}
.nn{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--ko);display:grid;place-items:center;font-size:.8em;font-weight:700}
.none{margin:0;color:var(--muted)}
.rbtns{margin-top:auto;display:flex;flex-wrap:wrap;gap:.6em;padding-top:.3em}

/* Revoir mes réponses */
.review{display:flex;flex-direction:column;gap:.55em;padding-bottom:2px}
.rgrid{display:grid;gap:.55em;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.pp9 .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.pp6 .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pp3 .rgrid{grid-template-columns:minmax(0,1fr)}
.rv{padding:.5em .75em;display:flex;flex-direction:column;gap:.22em;min-height:0;overflow:hidden;font-size:.86em}
.rv p{margin:0}
.rv.ok{border-color:rgba(94,224,160,.5)}
.rv.ko{border-color:rgba(255,154,140,.5)}
.rvh{display:flex;align-items:center;justify-content:space-between;gap:.4em}
.rv .st{display:inline-flex;align-items:center;gap:.3em;font-weight:700}
.rv h3{font-size:1em;text-transform:none;letter-spacing:0;color:#fff}
.lab2{font-weight:700;color:var(--cyan)}

/* Navigation */
.nav{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,28px);padding-bottom:max(clamp(6px,1.2vh,14px),env(safe-area-inset-bottom))}
.nav .sp{flex:1;margin:0;font-size:.82em;color:var(--muted);text-align:center}

/* SVG */
.zonebg{fill:rgba(255,255,255,.035);stroke:rgba(207,221,242,.25);stroke-dasharray:5 6}
.pipe{fill:none;stroke:#4A3020;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.pipe-in{fill:none;stroke:#C0835A;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#8FE3FF;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:7 13;animation:flow 3.4s linear infinite;filter:url(#glow)}
.flow.fast{animation-duration:2.4s}
.flow.slow{stroke:#7EE8D2;stroke-width:7;stroke-dasharray:12 8;animation-duration:9s}
.flow.weak{stroke-dasharray:3 17;animation-duration:6s}
.flow.big{stroke-width:5}
.flow.still{animation:pulse 5s ease-in-out infinite;stroke-dasharray:none;opacity:.55;stroke-width:3}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{50%{opacity:.95}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drop{animation:drop 2.4s linear infinite;opacity:0}
.drop.d2{animation-delay:-.8s}.drop.d3{animation-delay:-1.6s}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
.lbl{fill:#EEF5FF;font:700 19px Calibri,Arial,sans-serif;paint-order:stroke;stroke:#0a2148;stroke-width:5px;stroke-linejoin:round}
.tagt{fill:#fff;font:700 18px Calibri,Arial,sans-serif}
.lett{fill:#0b1f3f;font:700 21px Calibri,Arial,sans-serif}

@media (min-aspect-ratio:1/1) and (min-width:561px){.step.c2.answered .sit{display:none}}
/* Écrans portrait / étroits : visuel au-dessus de la question */
@media (max-aspect-ratio:1/1),(max-width:560px){
  .step{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,34%) minmax(0,1fr)}
  .step.c1{grid-template-rows:minmax(0,25%) minmax(0,1fr)}
  .step.c2.answered,.step.c3.answered{grid-template-rows:minmax(0,1fr)}
  .step.c2.answered .visual,.step.c3.answered .visual{display:none}
  .result{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ring{width:clamp(80px,14vh,130px)}
  .rsteps{grid-template-columns:repeat(9,minmax(0,1fr))}
}
@media (max-width:560px){
  .mod{display:none}
  .top{justify-content:flex-end}
  .nav .btxt,.tbtn .btxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav .sp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nav{justify-content:space-between}
  .ptxt{font-size:.85em}
  .rsteps li{font-size:.75em}
  .rsteps li .ic{width:1em;height:1em}
  h1{font-size:1.7em}
}
@media (max-height:500px){
  .top{padding-top:4px;padding-bottom:4px}
  .prog{padding-bottom:4px}
  .nav{padding-top:4px;padding-bottom:4px}
  .icard img{max-height:22vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

/* ===== Compléments HYD-02 ===== */
.hero{width:100%;height:auto;max-height:30vh;border-radius:14px;min-height:0;flex:0 1 auto;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.intro.c1 .hero{max-height:16vh}
.intro.c2 .hero{display:none}
.fx{white-space:nowrap;font-family:Calibri,Arial,sans-serif;font-weight:700;color:#FFE3B8}
.fx sub{font-size:.72em;line-height:0}
.opt.sm{min-height:44px;padding:.35em .7em;width:auto;flex:1 1 auto}
.segs{display:flex;flex-wrap:wrap;gap:.4em}
.grp{display:flex;flex-direction:column;gap:.3em;padding:.45em .6em;border:1px solid var(--line);border-radius:12px;background:rgba(6,24,56,.3)}
.glab{margin:0;font-weight:700}
.gsel{margin:0;color:var(--cyan);font-weight:700}
.fxcard{border:1px solid rgba(85,194,251,.5);border-radius:14px;background:rgba(6,24,56,.45);padding:.6em .9em;display:flex;flex-direction:column;gap:.25em}
.fxl{margin:0;font-size:.78em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.fxm{margin:0;font-size:1.35em}
.fxd{margin:0;color:#fff;font-weight:700}
.checks{display:grid;grid-template-columns:1fr;gap:.35em}
@container (min-width:520px){.checks{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:.6em;text-align:start;min-height:44px;padding:.35em .65em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);line-height:1.15;font-size:.95em}
.chk:hover:not([aria-disabled="true"]){background:rgba(255,255,255,.13)}
.chk .box{flex:none;width:1.15em;height:1.15em;border-radius:4px;border:2px solid #D7E8F8;display:grid;place-items:center}
.chk[aria-checked="true"]{border:2px solid var(--cyan);background:rgba(85,194,251,.17)}
.chk[aria-checked="true"] .box{background:var(--cyan);border-color:var(--cyan)}
.chk[aria-checked="true"] .box::after{content:"";width:.32em;height:.6em;border:solid #0b2350;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .otx{flex:1}.chk .mk{flex:none;display:flex}
.chk[aria-disabled="true"]{cursor:default}
.is-miss{border:2px dashed var(--ok)!important}
.vbtn{position:absolute;display:flex;align-items:center;justify-content:center;gap:.35em;min-width:44px;min-height:44px;border-radius:12px;border:2px solid rgba(207,221,242,.6);background:rgba(8,26,56,.85);font-weight:700;font-size:1em;padding:0 .4em}
.vbtn:hover:not(:disabled){background:rgba(30,70,130,.9)}
.vbtn[aria-pressed="true"]{border:3px solid var(--cyan);background:rgba(85,194,251,.25)}
.vbtn:disabled{cursor:default}
.hs.gauge{justify-content:flex-start;padding-top:.2em}
.dz .zn{text-transform:none;font-size:.82em;line-height:1.1}
/* SVG HYD-02 */
.lbl.sym{font-size:22px}
.lbl.small{font-size:15px;fill:#CFDDF2}
.sbs{font-size:70%}
.fxbox{fill:rgba(6,24,56,.75);stroke:#55C2FB;stroke-width:1.5}
.fxs{fill:#FFE3B8;font:700 21px Calibri,Arial,sans-serif}
.sbox{fill:rgba(6,24,56,.6);stroke:rgba(170,210,255,.45);stroke-width:1.5}
.sbox.empty{stroke-dasharray:6 5;stroke:#FA9035}
.big1{fill:#fff;font:700 24px Calibri,Arial,sans-serif}
.gnum{fill:#0B2350;font:700 15px Calibri,Arial,sans-serif}
.gunit{fill:#36506F;font:700 14px Calibri,Arial,sans-serif}
.lcd{fill:#8FE3FF;font:700 20px Calibri,Arial,sans-serif}
.tagr{fill:rgba(8,26,56,.9);stroke:#55C2FB;stroke-width:1.5}
.tagr.big{stroke:#FA9035;stroke-width:2.5}
.tagr.q{stroke:#FA9035;stroke-dasharray:5 4}
.flow.up{animation-duration:4.5s}
.flow.slow2{animation-duration:6s}
.bub{animation:bub 3s ease-in-out infinite}
@keyframes bub{50%{transform:translateY(-6px)}}
.fill{transition:y .5s ease,height .5s ease}
.rsteps.n8{grid-template-columns:repeat(8,minmax(0,1fr))}
.pp8 .rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.pp4 .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pp2 .rgrid{grid-template-columns:minmax(0,1fr)}

/* ---------- Éléments de la page ---------- */
const $ = s => document.querySelector(s);
let main, nav, prog, live;
let suppressClick = false, drag = null;
function announce(msg) { live.textContent = ""; setTimeout(() => { live.textContent = msg; }, 60); }

function render(focusSel) {
  const u = L[S.lang].ui;
  document.documentElement.lang = S.lang;
  document.title = u.module + " – " + u.introTitle;
  $("#mod").textContent = u.module;
  $("#langLbl").textContent = u.lang;
  $("#langSel").value = S.lang;
  renderPause(); renderProg();
  if (S.view === "intro") renderIntro();
  else if (S.view === "step") renderStep();
  else if (S.view === "result") renderResult();
  else renderReview();
  renderNav();
  requestAnimationFrame(() => {
    fit();
    if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
  });
}
function renderPause() {
  const b = $("#pauseBtn");
  document.body.classList.toggle("paused", S.paused);
  b.innerHTML = (S.paused ? IC_PLAY : IC_PAUSE) + '<span class="btxt">' + esc(S.paused ? U("resume") : U("pause")) + "</span>";
  b.setAttribute("aria-label", S.paused ? U("resumeAria") : U("pauseAria"));
}
function renderProg() {
  if (S.view === "intro") { prog.hidden = true; prog.innerHTML = ""; return; }
  prog.hidden = false;
  const cur = S.view === "step" ? S.i : -1, n = S.view === "step" ? S.i + 1 : N;
  prog.setAttribute("aria-label", U("progress"));
  let h = `<p class="ptxt">${esc(fmtT(U("stepOf"), { n: n, t: N }))}</p><ol class="dots">`;
  for (let k = 0; k < N; k++) {
    const st = k === cur ? "cur" : (S.done[k] ? "done" : "todo");
    const t = k === cur ? U("stCur") : (S.done[k] ? U("stDone") : U("stTodo"));
    h += `<li><span class="dot ${st}" aria-hidden="true">${S.done[k] && k !== cur ? CHK : (k + 1)}</span><span class="sr">${esc(U("step"))} ${k + 1}, ${esc(t)}</span>${k < N - 1 ? `<span class="seg${S.done[k] ? " done" : ""}" aria-hidden="true"></span>` : ""}</li>`;
  }
  prog.innerHTML = h + "</ol>";
}
function renderIntro() {
  const hero = `<svg class="hero" viewBox="0 0 980 230" role="img" aria-label="${esc(U("introAlt"))}"><defs><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B6CB8"/><stop offset="1" stop-color="#123F7C"/></linearGradient></defs>
    <rect width="980" height="230" rx="14" fill="url(#hb)"/>${P("M60 170H920")}${pump(250, 170, 34)}
    <line x1="560" y1="118" x2="560" y2="158" stroke="#DCE6F2" stroke-width="6"/>${gauge(560, 72, 52, 0, 4, 2.3, { ticks: [0, 1, 2, 3, 4], minor: 16, unit: "bar(g)" })}
    <line x1="760" y1="130" x2="760" y2="158" stroke="#DCE6F2" stroke-width="5"/>${gauge(760, 102, 30, 0, 4, 1.5, { minor: 8 })}
    <circle cx="120" cy="60" r="3" fill="#FA9035"/><circle cx="870" cy="50" r="3" fill="#7EE8A8"/><circle cx="400" cy="40" r="2.5" fill="#FA9035"/></svg>`;
  main.innerHTML = `<section class="intro" aria-labelledby="introTitle"><div class="icard card fit">${hero}
    <h1 id="introTitle" tabindex="-1">${esc(U("introTitle"))}</h1>

function mark(isC, chosen) { return isC ? IC_OK : (chosen ? IC_KO : ""); }
function stage(inner, ov) { return `<div class="stagewrap"><div class="stage"><svg viewBox="0 0 600 360" aria-hidden="true" focusable="false">${inner}</svg>${ov || ""}</div></div>`; }
function box(x, y, w, h) { return `left:${(x / 6).toFixed(2)}%;top:${(y / 3.6).toFixed(2)}%;width:${(w / 6).toFixed(2)}%;height:${(h / 3.6).toFixed(2)}%`; }

function renderStep() {
  const i = S.i, c = CFG[i], st = ST(i), done = S.done[i], r = S.resp[i];
  let vis = "", inter = "", hint = "", role = "img";
  const cls = (isC, sel) => done ? (isC ? " is-ok" : (sel ? " is-ko" : "")) : "";
  const seg = (g, opts, cur, corr, key) => opts.map((o, v) => { const sel = cur === v; return `<button type="button" class="opt sm${cls(v === corr, sel)}" data-act="gpick" data-g="${g}" data-v="${v}" data-key="${key}-${g}-${v}" aria-pressed="${sel}" ${done ? "disabled" : ""}><span class="rad" aria-hidden="true"></span><span class="otx">${esc(o)}</span>${done ? `<span class="mk">${mark(v === corr, sel)}</span>` : ""}</button>`; }).join("");
  switch (c.type) {
    case "assoc": {
      vis = stage(VIS[i](st.svg));
      inter = st.items.map((it, k) => { const v = r[k]; return `<div class="arow"><label for="as${k}">${done ? (Number(v) === c.correct[k] ? IC_OK : IC_KO) : ""}${esc(it)}</label><select id="as${k}" data-row="${k}" ${done ? "disabled" : ""}><option value="">${esc(U("choose"))}</option>${c.order.map(o => `<option value="${o}"${String(o) === v ? " selected" : ""}>${esc(st.choices[o])}</option>`).join("")}</select></div>`; }).join("");
      break;
    }
    case "single": {
      vis = stage(VIS[i](st.svg));
      inter = `<div class="opts" role="group" aria-labelledby="qText">` + st.opts.map((o, v) => { const sel = r === v; return `<button type="button" class="opt${cls(v === c.correct, sel)}" data-act="pick" data-v="${v}" data-key="o-${v}" aria-pressed="${sel}" ${done ? "disabled" : ""}><span class="rad" aria-hidden="true"></span><span class="otx">${esc(o)}</span>${done ? `<span class="mk">${mark(v === c.correct, sel)}</span>` : ""}</button>`; }).join("") + `</div>`;
      break;
    }
    case "valpick": {
      role = "group";
      const ov = c.vals.map((v, k) => { const sel = r === k; return `<button type="button" class="vbtn${cls(k === c.correct, sel)}" style="${box(452, 44 + k * 72, 136, 56)}" data-act="pick" data-v="${k}" data-key="v-${k}" aria-pressed="${sel}" ${done ? "disabled" : ""}>${done ? mark(k === c.correct, sel) : ""}<span>Δp ≈ ${esc(nv(v))}</span></button>`; }).join("");
      vis = stage(VIS[i](st.svg), ov);
      inter = `<div class="fxcard"><p class="fxl">${esc(U("data"))}</p><p class="fxm">${FX.F2}</p><p class="fxd">ρ ≈ 1${NB}000 kg/m³ · g ≈ ${esc(nv("9,81"))} m/s² · Δz = 20 m</p></div>`;
      break;
    }
    case "groups": {
      const show = g => !c.progressive || done || g === 0 || r[g - 1] != null;
      let ov = "";
      inter = c.groups.map((gr, g) => {
        if (!show(g)) return "";
        const lab = st.groups[g].label;
        if (gr.visual) {
          role = "group";
          const names = st.groups[g].opts;
          ov = names.map((nm, v) => { const sel = r[g] === v; const val = v === 0 ? "1,8" : "2,8"; return `<button type="button" class="hs gauge${cls(v === gr.correct, sel)}" style="${box(v === 0 ? 70 : 370, 44, 160, 148)}" data-act="gpick" data-g="${g}" data-v="${v}" data-key="vg-${v}" aria-pressed="${sel}" ${done ? "disabled" : ""}><span class="ztag">${done ? mark(v === gr.correct, sel) : ""}${esc(nm)} · ${esc(nv(val))} bar(g)</span></button>`; }).join("");
          return `<div class="grp"><p class="glab">${tx(lab)}</p><p class="gsel">${r[g] == null ? esc(U("notSel")) : esc(names[r[g]])}</p></div>`;
        }
        return `<div class="grp" role="group" aria-label="${esc(plain(lab))}"><p class="glab">${tx(lab)}</p><div class="segs">${seg(g, groupOpts(i, g), r[g], gr.correct, "g")}</div></div>`;
      }).join("");
      vis = stage(VIS[i](st.svg, r), ov);
      break;
    }
    case "drag": {
      role = "group"; hint = U("hDrag");
      const ov = [0, 1].map(z => { const l = r[z]; const okz = done && l === c.correct[z]; return `<button type="button" class="dz${l != null ? " filled" : ""}${done ? (okz ? " is-ok" : " is-ko") : ""}" style="${z ? "left:51.3%" : "left:1.7%"};top:2%;width:47%;height:28%" data-act="dz" data-z="${z}" data-key="dz-${z}" ${done ? "disabled" : ""}><span class="zn">${done ? (okz ? IC_OK : IC_KO) : ""}${esc(st.zones[z])}</span><span class="zv">${l != null ? esc(st.labels[l]) : esc(U("zoneEmpty"))}</span></button>`; }).join("");
      vis = stage(VIS[i](st.svg), ov);
      inter = `<div class="chips" role="group" aria-labelledby="qText">` + st.labels.map((lab, l) => { const z = r.indexOf(l); return `<button type="button" class="chip" data-act="chip" data-l="${l}" data-key="chip-${l}" aria-pressed="${S.sel === l}" ${done ? "disabled" : ""}>${esc(lab)}${z >= 0 ? `<span class="where"> → ${z + 1}</span>` : ""}</button>`; }).join("") + `</div>`;
      break;
    }
    case "multi": {
      vis = stage(VIS[i](st.svg)); hint = U("hMulti");
      inter = `<div class="checks" role="group" aria-labelledby="qText">` + c.order.map(k => { const on = r.indexOf(k) >= 0, good = c.correct.indexOf(k) >= 0;
        const st2 = done ? (good ? (on ? " is-ok" : " is-miss") : (on ? " is-ko" : "")) : "";
        return `<button type="button" class="chk${st2}" role="checkbox" aria-checked="${on}" data-act="toggle" data-v="${k}" data-key="c-${k}" ${done ? "aria-disabled=\"true\"" : ""}><span class="box" aria-hidden="true"></span><span class="otx">${esc(st.items[k])}</span>${done ? `<span class="mk">${good ? IC_OK : (on ? IC_KO : "")}</span>` : ""}</button>`; }).join("") + `</div>`;
      break;
    }
  }
  const fb = done ? `<div class="fb ${S.ok[i] ? "ok" : "ko"}" id="fb"><p class="fb-t">${S.ok[i] ? IC_OK : IC_KO}${esc(S.ok[i] ? U("ok") : U("ko"))}</p><p class="fb-x">${tx(S.ok[i] ? st.ok : st.ko)}</p><p class="fb-k"><span class="tag">${esc(U("remember"))}</span>${tx(st.key)}</p></div>` : "";
  main.innerHTML = `<section class="step t-${c.type}${done ? " answered" : ""}" aria-labelledby="stTitle">
    <div class="qpanel card fit">
      <div class="qhead"><span class="badge">${esc(U("step"))} ${i + 1}/${N}</span><h2 id="stTitle" tabindex="-1">${esc(st.title)}</h2></div>
      <p class="sit"><span class="lab">${esc(U("situation"))}</span>${esc(st.sit)}</p>
      <p class="q" id="qText">${esc(st.q)}</p>
      ${hint && !done ? `<p class="hint">${esc(hint)}</p>` : ""}
      <div class="inter">${inter}</div>
      ${fb}
    </div>
    <div class="visual card fit" role="${role}" aria-label="${esc(st.alt)}">${vis}</div>
  </section>`;
}

function notionsToReview() { const out = []; S.ok.forEach((o, k) => { if (!o) { const n = ST(k).notion; if (out.indexOf(n) < 0) out.push(n); } }); return out; }
function renderResult() {
  const s = S.ok.filter(Boolean).length, p = Math.round(s / N * 100);
  const lvl = s >= 7 ? 3 : s >= 5 ? 2 : 1;
  const C = 2 * Math.PI * 52, d = (C * s / N).toFixed(1);
  const fails = notionsToReview();
  main.innerHTML = `<section class="result" aria-labelledby="resTitle">
    <div class="card rcard rsum fit">
      <h2 id="resTitle" tabindex="-1">${esc(U("finalTitle"))}</h2>
      <div class="rs-top">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${esc(fmtT(U("scoreAria"), { s: s, t: N }))}"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="url(#gRing)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${d} 400" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" class="rnum">${s}/${N}</text></svg>
        <div class="kpis"><p class="kpi"><span>${esc(U("score"))}</span><strong>${s} / ${N}</strong></p><p class="kpi"><span>${esc(U("rate"))}</span><strong>${pctTxt(p)}</strong></p></div>
      </div>
      <p class="lvl lvl${lvl}"><span class="lvlb" aria-hidden="true">${lvl > 1 ? IC_OK : IC_KO}</span>${esc(U("lvl" + lvl + "t"))}</p>
      <p class="lmsg">${esc(U("lvl" + lvl + "m"))}</p>
    </div>
    <div class="card rcard rdet fit">
      <h3>${esc(U("passed"))} (${s})</h3>
      <ul class="rsteps n8">${S.ok.map((o, k) => `<li class="${o ? "ok" : "ko"}">${o ? IC_OK : IC_KO}<span>${k + 1}</span><span class="sr">${esc(U("step"))} ${k + 1}, ${esc(o ? U("success") : U("fail"))}</span></li>`).join("")}</ul>
      <h3>${esc(U("toReview"))}</h3>
      ${fails.length ? `<ul class="notions">${fails.map(n => `<li><span class="nn" aria-hidden="true">!</span><span>${esc(n)}</span></li>`).join("")}</ul>` : `<p class="none">${esc(U("noneReview"))}</p>`}
      <div class="rbtns"><button type="button" class="btn pri" data-act="review" data-key="review">${esc(U("review"))}</button><button type="button" class="btn" data-act="restart" data-key="restart">${esc(U("restart"))}</button></div>
    </div>
  </section>`;
}
function perPage() {
  if (window.matchMedia("(min-width: 900px) and (min-aspect-ratio: 1/1) and (min-height: 520px)").matches) return 8;
  if (window.matchMedia("(min-width: 600px) and (min-height: 520px)").matches) return 4;
  return 2;
}
function pageCount() { return Math.ceil(N / perPage()); }
function renderReview() {
  const pp = perPage(), pages = Math.ceil(N / pp);
  if (S.page > pages - 1) S.page = pages - 1;
  const ks = []; for (let k = S.page * pp; k < Math.min(N, (S.page + 1) * pp); k++) ks.push(k);
  main.innerHTML = `<section class="review pp${pp}" aria-labelledby="rvTitle">
    <h2 id="rvTitle" tabindex="-1">${esc(U("reviewTitle"))}</h2>
    <div class="rgrid fit">${ks.map(k => { const o = S.ok[k], a = S.done[k] ? ansText(k, S.resp[k]) : null;
      return `<article class="card rv fit ${o ? "ok" : "ko"}"><p class="rvh"><span class="badge">${esc(U("step"))} ${k + 1}</span><span class="st">${o ? IC_OK : IC_KO}${esc(o ? U("success") : U("fail"))}</span></p><h3>${esc(ST(k).title)}</h3><p><span class="lab2">${esc(U("yours"))}</span> ${esc(a == null ? U("noAnswer") : a)}</p>${o ? "" : `<p><span class="lab2">${esc(U("expected"))}</span> ${esc(corrText(k))}</p>`}</article>`; }).join("")}</div>
  </section>`;
}
function renderNav() {
  if (S.view === "intro" || S.view === "result") { nav.hidden = true; nav.innerHTML = ""; return; }
  nav.hidden = false;
  if (S.view === "review") {
    const pages = pageCount();
    nav.innerHTML = `<button type="button" class="btn" data-act="back" data-key="back">${AR_L}<span class="btxt">${esc(U("back"))}</span></button>
      <p class="sp">${pages > 1 ? esc(fmtT(U("page"), { n: S.page + 1, t: pages })) : ""}</p>
      ${pages > 1 ? `<button type="button" class="btn" data-act="pgprev" data-key="pgprev" ${S.page === 0 ? "disabled" : ""} aria-label="${esc(U("prevPage"))}">${AR_L}</button><button type="button" class="btn" data-act="pgnext" data-key="pgnext" ${S.page >= pages - 1 ? "disabled" : ""} aria-label="${esc(U("nextPage"))}">${AR_R}</button>` : ""}
      <button type="button" class="btn pri" data-act="restart" data-key="restart2">${esc(U("restart"))}</button>`;
    return;
  }
  const i = S.i, done = S.done[i], last = i === N - 1;
  nav.innerHTML = `<button type="button" class="btn" data-act="prev" data-key="prev" aria-label="${esc(U("prev"))}">${AR_L}<span class="btxt" aria-hidden="true">${esc(U("prev"))}</span></button>
    <p class="sp" id="navHint">${done ? "" : esc(U("needAnswer"))}</p>
    ${done ? "" : `<button type="button" class="btn pri" data-act="validate" data-key="validate" ${complete(i) ? "" : "disabled"} aria-describedby="navHint">${esc(U("validate"))}</button>`}
    <button type="button" class="btn${done ? " pri" : ""}" data-act="next" data-key="next" ${done ? "" : "disabled"}>${esc(last ? U("result") : U("next"))}${AR_R}</button>`;
}

/* ---------- Ajustement automatique : aucun défilement ---------- */
function setK(k) { document.documentElement.style.setProperty("--k", k.toFixed(2)); }
function overflowing() {
  const els = [main].concat(Array.prototype.slice.call(main.querySelectorAll(".fit")));
  return els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
}
function fit() {
  const root = main.firstElementChild; if (!root) return;
  root.classList.remove("c1", "c2", "c3");
  let k = 1; setK(k);
  while (overflowing() && k > 0.8) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c1"); k = 1; setK(k);
  while (overflowing() && k > 0.76) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c2"); k = 1; setK(k);
  while (overflowing() && k > 0.72) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c3"); k = 1; setK(k);
  while (overflowing() && k > 0.62) { k -= 0.04; setK(k); }
}

/* ---------- Actions ---------- */
function validate() {
  const i = S.i; if (S.done[i] || !complete(i)) return;
  S.done[i] = true; S.ok[i] = check(i); S.sel = null;
  render('[data-key="next"]');
  const st = ST(i);
  announce((S.ok[i] ? U("ok") : U("ko")) + ". " + plain(S.ok[i] ? st.ok : st.ko) + " " + U("remember") + " : " + plain(st.key));
}
function place(l, z) {
  const arr = S.resp[S.i];
  for (let k = 0; k < arr.length; k++) if (arr[k] === l) arr[k] = null;
  arr[z] = l; S.sel = null;
  render(`[data-key="dz-${z}"]`);
  announce(fmtT(U("placed"), { l: ST(S.i).labels[l], z: ST(S.i).zones[z] }));
}
function act(a, b) {
  const i = S.i;
  switch (a) {
    case "start": S.view = "step"; S.i = 0; render("#stTitle"); break;
    case "prev": if (S.i > 0) { S.i--; render("#stTitle"); } else { S.view = "intro"; render("#startBtn"); } break;
    case "next": if (!S.done[i]) return; if (i < N - 1) { S.i++; render("#stTitle"); } else { S.view = "result"; render("#resTitle"); } break;
    case "validate": validate(); break;
    case "pick": if (S.done[i]) return; S.resp[i] = parseInt(b.dataset.v, 10); render(`[data-key="${b.dataset.key}"]`); break;
    case "gpick": {
      if (S.done[i]) return;
      const g = parseInt(b.dataset.g, 10); S.resp[i][g] = parseInt(b.dataset.v, 10);
      render(`[data-key="${b.dataset.key}"]`); break;
    }
    case "toggle": {
      if (S.done[i]) return;
      const v = parseInt(b.dataset.v, 10), arr = S.resp[i], p = arr.indexOf(v);
      if (p >= 0) arr.splice(p, 1); else arr.push(v);
      render(`[data-key="${b.dataset.key}"]`); break;
    }
    case "chip": {
      if (S.done[i]) return;
      if (suppressClick) { suppressClick = false; return; }
      const l = parseInt(b.dataset.l, 10); S.sel = S.sel === l ? null : l;
      if (S.sel != null) { const arr = S.resp[i]; const z = arr[0] == null ? 0 : (arr[1] == null ? 1 : 0); render(`[data-key="dz-${z}"]`); announce(fmtT(U("labelSel"), { l: ST(i).labels[l] })); }
      else render(`[data-key="chip-${l}"]`);
      break;
    }
    case "dz": {
      if (S.done[i]) return;
      const z = parseInt(b.dataset.z, 10);
      if (S.sel != null) place(S.sel, z);
      else if (S.resp[i][z] != null) { S.resp[i][z] = null; render(`[data-key="dz-${z}"]`); announce(fmtT(U("removed"), { z: ST(i).zones[z] })); }
      else announce(U("hDrag"));
      break;
    }
    case "review": S.view = "review"; S.page = 0; render("#rvTitle"); break;
    case "restart": initResp(); S.view = "step"; S.i = 0; render("#stTitle"); break;
    case "back": S.view = "result"; render("#resTitle"); break;
    case "pgprev": if (S.page > 0) { S.page--; render(S.page === 0 ? '[data-key="pgnext"]' : '[data-key="pgprev"]'); } break;
    case "pgnext": if (S.page < pageCount() - 1) { S.page++; render(S.page >= pageCount() - 1 ? '[data-key="pgprev"]' : '[data-key="pgnext"]'); } break;
    case "pause": S.paused = !S.paused; renderPause(); break;
  }
}

/* ---------- Glisser-déposer (souris, stylet, tactile) ---------- */
function onDown(e) { const c = e.target.closest(".chip"); if (!c || c.disabled || S.done[S.i]) return; drag = { l: parseInt(c.dataset.l, 10), x: e.clientX, y: e.clientY, el: c, moved: false, ghost: null }; }
function onMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true; const g = document.createElement("div"); g.className = "ghost"; g.textContent = drag.el.firstChild.textContent;
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("dragging");
  }
  if (drag.moved) {
    e.preventDefault(); drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
    const under = document.elementFromPoint(e.clientX, e.clientY);
    document.querySelectorAll(".dz").forEach(z => z.classList.toggle("hover", !!under && z.contains(under)));
  }
}
function onUp(e) {
  if (!drag) return; const d = drag; drag = null; if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  if (d.ghost) d.ghost.remove(); d.el.classList.remove("dragging");
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under ? under.closest(".dz") : null;
  document.querySelectorAll(".dz").forEach(x => x.classList.remove("hover"));
  if (z && !z.disabled) place(d.l, parseInt(z.dataset.z, 10));
}
function onCancel() { if (drag) { if (drag.ghost) drag.ghost.remove(); drag.el.classList.remove("dragging"); drag = null; } }

/* ---------- Démarrage ---------- */
function init() {
  main = $("#main"); nav = $("#nav"); prog = $("#prog"); live = $("#live");
  $("#langSel").innerHTML = LANGS.map(l => `<option value="${l}" lang="${l}">${esc(L[l].name)}</option>`).join("");
  const rm = window.matchMedia("(prefers-reduced-motion: reduce)");
  S.paused = rm.matches;
  if (rm.addEventListener) rm.addEventListener("change", e => { S.paused = e.matches; renderPause(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return; act(b.dataset.act, b); });
  $("#pauseBtn").addEventListener("click", () => act("pause"));
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "langSel") { S.lang = t.value; render("#langSel"); announce(L[S.lang].name); }
    else if (t.matches("select[data-row]")) { S.resp[S.i][parseInt(t.dataset.row, 10)] = t.value; render("#" + t.id); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel != null) { const l = S.sel; S.sel = null; render(`[data-key="chip-${l}"]`); } });
  document.addEventListener("pointerdown", onDown);
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
  let to = null;
  window.addEventListener("resize", () => { clearTimeout(to); to = setTimeout(() => { if (S.view === "review") render(); else fit(); }, 120); });
  render();
}
if (typeof document !== "undefined" && document.getElementById("app")) init();

})();
</script>
</body>
