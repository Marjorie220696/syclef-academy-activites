<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>F03 | Comprendre les différents types de pression</title>
<style>
:root{
  --blue:#386FB6;--blue-dark:#1C3D6E;--blue-ink:#24518F;
  --blue-light:#EAF2FB;--blue-light-border:#8DB6E3;
  --orange:#F4951F;--orange-bg:#FEF3E6;--orange-ink:#7A4300;
  --green:#94C356;--green-bg:#F1F8E8;--green-ink:#365F14;
  --bg:#F5F7FA;--card:#FFFFFF;--text:#1F2933;--muted:#4A5868;--line:#D5DDE7;
  --radius:10px;
  --shadow:0 1px 3px rgba(28,61,110,.08),0 1px 2px rgba(28,61,110,.05);
  --focus:0 0 0 3px #FFFFFF,0 0 0 6px #1C3D6E;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Calibri,Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:16px;line-height:1.42;overflow:hidden}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
h2,h3{color:var(--blue-dark);line-height:1.2;margin:0}
p{margin:0}
sub{font-size:.68em;line-height:0;vertical-align:-.3em}
[hidden]{display:none!important}

/* ---------- Structure "diapo" ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--blue);background:var(--bg)}
.tabs{display:flex;gap:6px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 12px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--blue-dark);font-weight:700;min-width:0;transition:background-color .2s,border-color .2s}
.tab .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--blue-light);font-size:.85rem}
.tab .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab .ts{flex:none;font-size:.8rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center}
.tab .ts svg{width:14px;height:14px}
.tab[aria-selected="true"]{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.tab[aria-selected="true"] .n{background:#fff;color:var(--blue-dark)}
.tab[aria-selected="true"] .ts{color:#fff}
.tab.done .ts{color:var(--green-ink)}
.tab[aria-selected="true"].done .ts{color:#D9F0BD}
.tab[aria-disabled="true"]{opacity:.62;cursor:not-allowed}
.tab:not([aria-disabled="true"]):not([aria-selected="true"]):hover{border-color:var(--blue)}
.lang{flex:none;display:flex;align-items:center;gap:6px;color:var(--muted)}
.lang svg{width:18px;height:18px}
.lang select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:40px;color:var(--blue-dark)}

.stage{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;overflow:auto;padding:12px 14px;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--blue-dark);color:#fff;padding:8px 14px;border-radius:8px;font-size:.9rem;max-width:90vw;box-shadow:var(--shadow);z-index:5}

/* ---------- Diapo 1 ---------- */
.s1{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;height:100%;min-height:0}
.ring{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto 1fr 1fr auto;gap:10px;align-content:center;grid-template-areas:"prog prog prog" "b1 dial b2" "b3 dial b4" ". b5 .";min-height:0}
.prog{grid-area:prog;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog-text{font-weight:700;color:var(--blue-dark)}
.pbar{flex:1 1 120px;height:10px;background:#E3E9F1;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.pbar span{display:block;height:100%;width:0;background:var(--green);transition:width .35s ease}
.ring [data-p="abs"]{grid-area:b1}.ring [data-p="rel"]{grid-area:b2}
.ring [data-p="atm"]{grid-area:b3}.ring [data-p="diff"]{grid-area:b4}
.ring [data-p="stat"]{grid-area:b5}
.dial{grid-area:dial;align-self:center;width:clamp(120px,24vh,190px);position:relative}
.dial svg{display:block;width:100%;height:auto}
.dial .needle{transform-box:view-box;transform-origin:100px 100px;transition:transform .45s ease}
.dial-center{position:absolute;left:0;right:0;top:62%;text-align:center;font-weight:700;color:var(--blue-dark);font-size:1.25rem;pointer-events:none}
.pbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px;position:relative;transition:border-color .2s,background-color .2s;align-self:center}
.pbtn:hover{border-color:var(--blue)}
.pbtn .ico{width:34px;height:34px;flex:none;border-radius:8px;background:var(--blue-light);color:var(--blue);display:grid;place-items:center}
.pbtn .ico svg{width:22px;height:22px}
.pbtn .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.pbtn .name{font-weight:700;color:var(--blue-dark);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.pbtn .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.pbtn .sym{color:var(--blue-ink);font-size:.95rem}
.pbtn .status{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--muted);border-radius:999px;padding:0 6px;border:1px solid var(--line);background:#F8FAFC}
.pbtn .status svg{width:11px;height:11px}
.pbtn.seen .status{color:var(--green-ink);border-color:var(--green);background:var(--green-bg)}
.pbtn[aria-pressed="true"]{border-color:var(--blue-dark);background:var(--blue-light);box-shadow:inset 0 0 0 1px var(--blue-dark),var(--shadow)}
.pbtn[aria-pressed="true"] .ico{background:var(--blue);color:#fff}

.fcol{display:flex;flex-direction:column;gap:10px;min-height:0}
.fiche{padding:14px 16px;flex:1;min-height:0;overflow:auto}
.fiche-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:var(--muted)}
.fiche-empty svg{width:52px;height:52px;color:var(--blue-light-border)}
.fiche-empty h3{font-size:1.1rem}
.fiche-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fiche-sym{flex:none;min-width:58px;height:58px;padding:0 8px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.45rem;font-weight:700}
.fiche-head h3{font-size:1.25rem;min-width:0;overflow-wrap:anywhere}
.fiche-head .symlbl{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-ink);font-weight:700}
.facts{margin:0;display:grid;gap:8px}
.facts>div{border-inline-start:4px solid var(--blue);background:#F8FAFD;border-radius:0 8px 8px 0;padding:6px 10px}
.facts dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--blue-ink)}
.facts dd{margin:1px 0 0}
.callout{margin-top:10px;border-radius:var(--radius);padding:9px 12px;border:1px solid;border-inline-start-width:6px}
.callout-title{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:2px;font-size:1rem}
.callout-title svg{width:19px;height:19px;flex:none}
.callout.remember{background:var(--green-bg);border-color:var(--green)}
.callout.remember .callout-title{color:var(--green-ink)}
.callout.practice{background:var(--blue-light);border-color:var(--blue-light-border)}
.callout.practice .callout-title{color:var(--blue-ink)}
.callout.vigil{background:var(--orange-bg);border-color:var(--orange);margin-top:0}
.callout.vigil .callout-title{color:var(--orange-ink)}
.cta{flex:none;align-self:flex-end;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--blue-dark);background:var(--blue-dark);color:#fff;font-weight:700}
.cta:hover{background:var(--blue);border-color:var(--blue)}
.cta svg{width:18px;height:18px}

/* ---------- Diapo 2 ---------- */
.s2{display:flex;flex-direction:column;gap:12px;min-height:100%}
.relrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch}
.formula{display:flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,1.1rem + 1.6vw,2.1rem);font-weight:700;color:var(--blue-dark);padding:8px 16px;background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);font-family:"Cambria Math",Cambria,"Times New Roman",serif;white-space:nowrap}
.t{display:inline-block;white-space:nowrap;padding:0 .12em;border-radius:6px;border-bottom:3px solid transparent}
.formula .op{padding:0 .2em}
.hl{background:#FFF3C4!important;border-bottom-color:var(--blue-dark)!important;outline:2px solid var(--blue-dark);outline-offset:1px}
.compose{display:flex;align-items:stretch;gap:8px;min-width:0}
.compose .op{align-self:center;font-size:1.6rem;font-weight:700;color:var(--blue-dark);flex:none;width:22px;text-align:center}
.zbtn{flex:1 1 0;min-width:0;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
.zbtn:hover{border-color:var(--blue)}
.zbtn .zname{font-weight:700;color:var(--blue-dark);overflow-wrap:anywhere;hyphens:auto;line-height:1.15}
.zbtn .zsym{font-size:1.1rem;color:var(--blue-ink);font-weight:700}
.zbtn .status{font-size:.72rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.zbtn .status svg{width:11px;height:11px}
.zbtn.seen .status{color:var(--green-ink)}
.zbtn[aria-pressed="true"]{border-color:var(--blue-dark);background:var(--blue-light);box-shadow:inset 0 0 0 1px var(--blue-dark),var(--shadow)}
.relgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.relgrid>*{padding:10px 12px}
.zexpl strong{color:var(--blue-dark);display:block}
.zexpl .ph{color:var(--muted)}
.relprog{margin-top:8px;font-size:.88rem;font-weight:700;color:var(--blue-ink)}
.example h3{font-size:1.05rem;margin-bottom:6px}
.exvals{margin:0;display:grid;gap:3px;font-size:.93rem}
.exvals>div{display:flex;justify-content:space-between;gap:8px;padding:2px 6px;border-radius:6px;border-bottom:2px solid transparent}
.exvals dt{color:var(--muted)}
.exvals dd{margin:0;font-weight:700;color:var(--blue-dark);white-space:nowrap}
.calc{margin-top:6px;font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.25rem;font-weight:700;color:var(--blue-dark);text-align:center;padding:6px;border-radius:8px;border:1px dashed var(--blue-light-border)}
.note{margin-top:6px;font-size:.85rem;color:var(--blue-ink)}
.s-foot{display:flex;justify-content:flex-end;margin-top:auto}

/* ---------- Diapo 3 ---------- */
.s3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;min-height:100%;align-items:start}
.scale{position:relative;padding-inline-start:44px}
.scale .z{padding:8px 10px;font-size:.92rem;border-radius:6px;display:flex;align-items:center;min-height:clamp(52px,12vh,90px);color:var(--blue-dark)}
.scale .zpos{background:linear-gradient(180deg,#D7E6F7,#EAF2FB)}
.scale .zneg{background:linear-gradient(180deg,#EEF3F8,#F7F9FB)}
.scale .latm{border-top:3px dashed var(--blue-dark);border-bottom:3px dashed var(--blue-dark);background:#fff;font-weight:700;color:var(--blue-dark);padding:6px 10px;margin:2px 0;font-size:.92rem}
.scale .vac{background:var(--blue-dark);color:#fff;font-weight:700;padding:6px 10px;border-radius:6px;font-size:.92rem}
.scale .floor{font-size:.78rem;color:var(--muted);padding:4px 2px 0}
.scale .on{outline:3px solid var(--blue-dark);outline-offset:-3px}
.marker{position:absolute;left:0;top:0;width:38px;height:38px;margin-top:-19px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);transition:top .45s ease}
.marker svg{width:20px;height:20px}
.nright{display:flex;flex-direction:column;gap:10px}
.nbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nbtn{min-height:58px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:6px;font-weight:700;color:var(--blue-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.15}
.nbtn:hover{border-color:var(--blue)}
.nbtn .sign{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blue-light);font-size:1.05rem}
.nbtn .chk{display:inline-flex;color:var(--green-ink)}
.nbtn .chk svg{width:13px;height:13px}
.nbtn[aria-pressed="true"]{border-color:var(--blue-dark);background:var(--blue-light)}
.nbtn[aria-pressed="true"] .sign{background:var(--blue-dark);color:#fff}
.ncap{padding:8px 12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--blue);min-height:3.2em}
.nright .callout{margin-top:0}

/* ---------- Fin ---------- */
.final{position:absolute;inset:0;background:rgba(245,247,250,.94);display:flex;align-items:center;justify-content:center;padding:16px;z-index:4;animation:fade .25s ease}
.final-card{max-width:560px;width:100%;padding:22px;background:var(--green-bg);border:2px solid var(--green);border-radius:var(--radius);box-shadow:0 6px 24px rgba(28,61,110,.15);text-align:center;max-height:100%;overflow:auto}
.final h2{color:var(--green-ink);display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.45rem}
.final h2 svg{width:28px;height:28px;flex:none}
.final h2:focus{outline:none}
.final p{margin:10px 0 16px}
.final-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reset{min-height:46px;padding:8px 20px;border-radius:999px;border:2px solid var(--blue-dark);background:var(--blue-dark);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.reset:hover{background:var(--blue)}
.reset svg{width:19px;height:19px}
.ghost{min-height:46px;padding:8px 18px;border-radius:999px;border:2px solid var(--blue-dark);background:#fff;color:var(--blue-dark);font-weight:700}

/* ---------- Adaptation ---------- */
@media (max-width:1000px){
  .relgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .relgrid .vigil{grid-column:1/-1}
  .relrow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .tab .tl{display:none}
  .tab[aria-selected="true"] .tl{display:block}
}
@media (max-width:700px){
  .s1{grid-template-columns:minmax(0,1fr);height:auto}
  .ring{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-template-areas:"prog prog" "b1 b2" "b3 b4" "b5 b5"}
  .dial{display:none}
  .fiche{overflow:visible}
  .s3{grid-template-columns:minmax(0,1fr)}
  .relgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  body{font-size:15px}
  .bar{flex-wrap:wrap}
  .tabs{order:2;flex-basis:100%}
  .lang{order:1;margin-inline-start:auto}
  .compose{flex-direction:column}
  .compose .op{width:auto;line-height:1}
  .zbtn{min-height:56px;flex:none}
  .nbtns{grid-template-columns:minmax(0,1fr)}
  .nbtn{flex-direction:row;justify-content:flex-start;text-align:start;min-height:48px}
  .slide{padding:10px}
}
@media (max-height:600px) and (min-width:701px){
  body{font-size:15px}
  .pbtn{min-height:48px;padding:6px 8px}
  .fiche-sym{min-width:48px;height:48px;font-size:1.25rem}
  .facts>div{padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
</style>
</head>
<body>
<div class="app">
  <h1 class="sr-only" id="title"></h1>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" class="tab" role="tab" id="tab1" data-s="1" aria-controls="s1" aria-selected="true"><span class="n" aria-hidden="true">1</span><span class="tl" id="tl1"></span><span class="ts" id="ts1"></span></button>
      <button type="button" class="tab" role="tab" id="tab2" data-s="2" aria-controls="s2" aria-selected="false" tabindex="-1"><span class="n" aria-hidden="true">2</span><span class="tl" id="tl2"></span><span class="ts" id="ts2"></span></button>
      <button type="button" class="tab" role="tab" id="tab3" data-s="3" aria-controls="s3" aria-selected="false" tabindex="-1"><span class="n" aria-hidden="true">3</span><span class="tl" id="tl3"></span><span class="ts" id="ts3"></span></button>
    </div>
    <div class="lang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="langSelect"></select>
    </div>
  </div>

  <div class="stage" id="stage">
    <!-- Diapo 1 : les cinq pressions -->
    <section class="slide" role="tabpanel" id="s1" aria-labelledby="tab1">
      <div class="s1">
        <div class="ring" role="group" id="ring" aria-labelledby="tl1">
          <div class="prog">
            <span class="prog-text" id="progressText"></span>
            <div class="pbar" role="progressbar" id="progressBar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span id="progressFill"></span></div>
          </div>
          <div class="dial" aria-hidden="true">
            <svg viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="94" fill="#FFFFFF" stroke="#386FB6" stroke-width="5"/>
              <circle cx="100" cy="100" r="84" fill="none" stroke="#D5DDE7" stroke-width="1.5"/>
              <g id="ticks" stroke="#1C3D6E" stroke-linecap="round"></g>
              <g class="needle" id="needle"><path d="M100 26 L104.5 100 L95.5 100 Z" fill="#1C3D6E"/></g>
              <circle cx="100" cy="100" r="9" fill="#386FB6" stroke="#1C3D6E" stroke-width="2"/>
            </svg>
            <div class="dial-center" id="dialCenter">?</div>
          </div>
        </div>
        <div class="fcol">
          <section class="card fiche" id="fiche" aria-labelledby="ficheTitle" tabindex="-1"></section>
          <button type="button" class="cta" id="goRel" hidden><span id="goRelLbl"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </section>

    <!-- Diapo 2 : relation fondamentale -->
    <section class="slide" role="tabpanel" id="s2" aria-labelledby="tab2" hidden>
      <div class="s2">
        <h2 class="sr-only" id="relTitle"></h2>
        <div class="relrow">
          <p class="formula" id="formula"></p>
          <div class="compose" role="group" aria-labelledby="relTitle">
            <button type="button" class="zbtn" data-z="rel" aria-pressed="false"></button>
            <span class="op" aria-hidden="true">+</span>
            <button type="button" class="zbtn" data-z="atm" aria-pressed="false"></button>
            <span class="op" aria-hidden="true">=</span>
            <button type="button" class="zbtn" data-z="abs" aria-pressed="false"></button>
          </div>
        </div>
        <div class="relgrid">
          <div class="card zexpl"><div id="zexpl"></div><p class="relprog" id="relProg"></p></div>
          <section class="card example" aria-labelledby="exTitle">
            <h3 id="exTitle"></h3>
            <dl class="exvals">
              <div data-ex="rel"><dt id="exRel"></dt><dd id="exRelV"></dd></div>
              <div data-ex="atm"><dt id="exAtm"></dt><dd id="exAtmV"></dd></div>
              <div data-ex="abs"><dt id="exAbs"></dt><dd id="exAbsV"></dd></div>
            </dl>
            <p class="calc" id="calc"></p>
            <p class="note" id="exNote"></p>
          </section>
          <aside class="callout vigil" aria-labelledby="vigilTitle">
            <h3 class="callout-title" id="vigilTitle"></h3>
            <p id="vigilText"></p>
          </aside>

    stat:{name:"Statischer Druck",def:"Örtlicher Druck des Fluids, unabhängig von der Wirkung seiner Geschwindigkeit.",usage:"Druckhaltung im Netz und Aufrechterhaltung geeigneter Betriebsbedingungen.",msg:"Mit dem statischen Druck lässt sich insbesondere der Druckhaltezustand eines Netzes analysieren."}
  },
  announceSelect:function(n){return "Informationsblatt angezeigt: "+n+".";},
  lockedText:"Die Grundbeziehung wird verfügbar, sobald Sie die fünf Druckarten angesehen haben.",
  announceUnlock:"Sie haben alle Druckarten erkundet. Der Teil „Die Grundbeziehung“ ist jetzt verfügbar.",
  relTitle:"Die Grundbeziehung",
  relIntro:"Wählen Sie jeden Term der Beziehung aus, um ihn in der Formel und im Beispiel hervorzuheben.",
  relProgress:function(n){return "Angesehene Terme der Beziehung: "+n+"/3";},
  relPlaceholder:"Wählen Sie einen Term aus, um seine Erklärung anzuzeigen.",
  zone:{
    rel:"Der Relativdruck wird gegenüber dem örtlichen atmosphärischen Druck gemessen. Diesen Wert zeigt ein herkömmliches Manometer in der Regel an.",
    atm:"Der atmosphärische Druck ist der Druck der Umgebungsluft. Er dient als Bezugspunkt, um vom Relativdruck zum Absolutdruck zu gelangen.",
    abs:"Der Absolutdruck wird gegenüber dem absoluten Vakuum gemessen. Er ergibt sich, indem man den atmosphärischen Druck zum Relativdruck addiert."
  },
  exTitle:"Rechenbeispiel",exRel:"Gemessener Relativdruck",exAtm:"Für das Beispiel angenommener atmosphärischer Druck",exAbs:"Ermittelter Absolutdruck",
  exNote:"Dieses Beispiel verwendet einen atmosphärischen Druck von 1,013 bar.",dec:",",
  vigilText:"Ein herkömmliches Manometer zeigt in der Regel einen Relativdruck an, bezogen auf die Atmosphäre. Prüfen Sie stets den angegebenen Bezug: bar absolut oder bar relativ. Eine Verwechslung dieser beiden Bezüge kann zu einer falschen Interpretation der Messung führen.",
  negTitle:"Negativer Relativdruck",
  negIntro:"Wählen Sie eine Situation aus, um sie im Verhältnis zum atmosphärischen Druck einzuordnen.",
  negBtn:{pos:"Positiver Relativdruck",zero:"Relativdruck gleich null",neg:"Negativer Relativdruck"},
  negCap:{pos:"Der gemessene Druck ist höher als der atmosphärische Druck ({rel} > 0).",zero:"Der gemessene Druck ist gleich dem atmosphärischen Druck ({rel} = 0).",neg:"Der gemessene Druck ist niedriger als der atmosphärische Druck ({rel} < 0). Der Absolutdruck bleibt oberhalb des absoluten Vakuums."},
  negCapEmpty:"Wählen Sie eine Situation aus, um ihre Erklärung anzuzeigen.",
  negMsg:"Ein negativer Relativdruck bedeutet, dass der gemessene Druck niedriger ist als der atmosphärische Druck. Diese Situation kann insbesondere auf der Saugseite einer Pumpe auftreten. Sie entspricht niemals einem negativen Absolutdruck.",
  scale:{pos:"Positiver Relativdruck ({rel} > 0)",atm:"Atmosphärischer Druck: Bezugsniveau ({rel} = 0)",neg:"Negativer Relativdruck ({rel} < 0)",vac:"Absolutes Vakuum: Grenze des Absolutdrucks ({abs} = 0)",below:"Keine Werte darunter: Der Absolutdruck kann nicht negativ sein."},
  endTitle:"Erkundung abgeschlossen",
  endText:"Sie haben die wichtigsten Druckbezüge der HLK-Technik kennengelernt. Merken Sie sich vor allem: Ein herkömmliches Manometer zeigt in der Regel einen Relativdruck an.",
  reset:"Infografik erneut ansehen",resetDone:"Infografik zurückgesetzt."
}
};

var LANGS=["fr","en","es","it","ro","pl","nl","pt","de"];
var KEYS=["abs","rel","atm","diff","stat"];
var SYM={abs:"p<sub>abs</sub>",rel:"p<sub>rel</sub>",atm:"p<sub>atm</sub>",diff:"&Delta;p",stat:"p<sub>stat</sub>"};
var SYM_SR={abs:"p abs",rel:"p rel",atm:"p atm",diff:"delta p",stat:"p stat"};
var CALLOUT={abs:"remember",rel:"practice",atm:"remember",diff:"practice",stat:"remember"};
var ANGLE={abs:-60,rel:60,atm:-120,diff:120,stat:180};
var ICON={
  abs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="2.5 2.5"/><path d="M12 9.2c1.5 0 2.3 1.2 2.3 2.8s-.8 2.8-2.3 2.8-2.3-1.2-2.3-2.8.8-2.8 2.3-2.8z"/></svg>',
  rel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4.2 16.5a8.5 8.5 0 1 1 15.6 0"/><path d="M12 13.5l4-5"/><circle cx="12" cy="13.5" r="1.4"/><path d="M8 20h8"/></svg>',
  atm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/><path d="M3 13c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/><path d="M12 16v5M9.5 18.5L12 21l2.5-2.5"/></svg>',
  diff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5.5" cy="12" r="2.5"/><circle cx="18.5" cy="12" r="2.5"/><path d="M8 12h8"/><path d="M12 4.5l3.5 5.5h-7z"/></svg>',
  stat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2.5 8.5h19M2.5 15.5h19"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.6" stroke-linecap="round"/></svg>'
};
var ICO_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
var ICO_DOT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>';
var ICO_LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
var ICO_REMEMBER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
var ICO_PRACTICE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.5 6.5a4 4 0 0 0-5.2 5.2L4 17l3 3 5.3-5.3a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>';
var ICO_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17v.5"/></svg>';
var ICO_EMPTY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.2 16.5a8.5 8.5 0 1 1 15.6 0"/><path d="M12 13.5V7"/><circle cx="12" cy="13.5" r="1.4"/></svg>';
var ICO_DONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';

var state;
function freshState(lang){return {lang:lang,slide:1,current:null,seen:{},zone:null,zonesSeen:{},neg:null,negSeen:{},unlocked:false,done:false,finalOpen:false};}
function count(o){var n=0;for(var k in o){if(o.hasOwnProperty(k))n++;}return n;}
function $(id){return document.getElementById(id);}
function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function T(){return I18N[state.lang];}
function fmt(s){
  var o=esc(s).replace(/\{abs\}/g,SYM.abs).replace(/\{rel\}/g,SYM.rel).replace(/\{atm\}/g,SYM.atm).replace(/\{stat\}/g,SYM.stat);
  if(state.lang==="fr"){o=o.replace(/ ([:;!?»])/g,"\u00a0$1").replace(/« /g,"«\u00a0");}
  return o;
}
function plain(s){return String(s).replace(/\{(abs|rel|atm|stat)\}/g,function(m,k){return SYM_SR[k];});}
function setHTML(id,s){$(id).innerHTML=fmt(s);}
function num(v){return v.replace(".",T().dec);}
var liveTimer=null;
function announce(msg){
  var live=$("live");live.textContent="";
  if(liveTimer)clearTimeout(liveTimer);
  liveTimer=setTimeout(function(){live.textContent=plain(msg);},60);
}
var hintTimer=null;
function hint(msg){
  var h=$("hint");h.textContent=plain(msg);h.hidden=false;
  if(hintTimer)clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){h.hidden=true;},2600);
}

/* ---------- Construction ---------- */
function buildTicks(){
  var html="";
  for(var i=0;i<36;i++){
    var a=i*10*Math.PI/180,major=(i%3===0),r1=major?72:77,r2=84;
    html+='<line x1="'+(100+r1*Math.sin(a)).toFixed(2)+'" y1="'+(100-r1*Math.cos(a)).toFixed(2)+'" x2="'+(100+r2*Math.sin(a)).toFixed(2)+'" y2="'+(100-r2*Math.cos(a)).toFixed(2)+'" stroke-width="'+(major?2.4:1.2)+'"/>';
  }
  $("ticks").innerHTML=html;
}
function buildButtons(){
  var ring=$("ring");
  KEYS.forEach(function(k){
    var b=document.createElement("button");
    b.type="button";b.className="pbtn";
    b.setAttribute("data-p",k);b.setAttribute("aria-pressed","false");b.setAttribute("aria-controls","fiche");
    b.innerHTML='<span class="ico">'+ICON[k]+'</span><span class="txt"><span class="name"></span><span class="meta"><span class="sym" aria-hidden="true">'+SYM[k]+'</span><span class="status"></span></span></span>';
    b.addEventListener("click",function(){selectPressure(k);});
    ring.appendChild(b);
  });
}
function buildLang(){
  var sel=$("langSelect");
  LANGS.forEach(function(l){var o=document.createElement("option");o.value=l;o.textContent=I18N[l].langName;o.lang=l;sel.appendChild(o);});
  sel.addEventListener("change",function(){state.lang=sel.value;renderAll();});
}

/* ---------- Rendu ---------- */
function renderStatic(){
  var t=T();
  document.documentElement.lang=state.lang;
  document.title=t.module+" – "+t.title;
  $("langSelect").value=state.lang;
  $("langSelect").setAttribute("aria-label",t.langLabel);
  $("tabs").setAttribute("aria-label",t.stepsLabel);
  setHTML("title",t.title);
  setHTML("tl1",t.tab1);setHTML("tl2",t.relTitle);setHTML("tl3",t.negTitle);
  setHTML("relTitle",t.relTitle);setHTML("negTitle",t.negTitle);
  setHTML("goRelLbl",t.goRel);setHTML("goNegLbl",t.goNeg);
  setHTML("exTitle",t.exTitle);setHTML("exRel",t.exRel);setHTML("exAtm",t.exAtm);setHTML("exAbs",t.exAbs);setHTML("exNote",t.exNote);
  $("exRelV").innerHTML=SYM.rel+" = 2&nbsp;bar";
  $("exAtmV").innerHTML=SYM.atm+" = "+num("1.013")+"&nbsp;bar";
  $("exAbsV").innerHTML=SYM.abs+" = "+num("3.013")+"&nbsp;bar";
  $("vigilTitle").innerHTML=ICO_WARN+"<span>"+fmt(t.vigilance)+"</span>";
  setHTML("vigilText",t.vigilText);
  $("negMsgTitle").innerHTML=ICO_REMEMBER+"<span>"+fmt(t.remember)+"</span>";
  setHTML("negMsg",t.negMsg);
  setHTML("sPos",t.scale.pos);setHTML("sAtm",t.scale.atm);setHTML("sNeg",t.scale.neg);setHTML("sVac",t.scale.vac);setHTML("sBelow",t.scale.below);
  $("endTitle").innerHTML=ICO_DONE+"<span>"+fmt(t.endTitle)+"</span>";
  setHTML("endText",t.endText);setHTML("resetLbl",t.reset);$("closeBtn").textContent=t.close;
}
function renderTabs(){
  var t=T(),n=count(state.seen),z=count(state.zonesSeen),g=count(state.negSeen);
  var status={1:n===5?ICO_CHECK:(n+"/5"),2:state.unlocked?(z===3?ICO_CHECK:(z+"/3")):ICO_LOCK,3:state.unlocked?(g===3?ICO_CHECK:(g+"/3")):ICO_LOCK};
  var done={1:n===5,2:z===3,3:g===3};
  var names={1:t.tab1,2:t.relTitle,3:t.negTitle};
  [1,2,3].forEach(function(i){
    var b=$("tab"+i),locked=(i>1&&!state.unlocked),sel=(state.slide===i);
    $("ts"+i).innerHTML=status[i];
    b.classList.toggle("done",done[i]);
    b.setAttribute("aria-selected",sel?"true":"false");
    b.setAttribute("tabindex",sel?"0":"-1");
    if(locked){b.setAttribute("aria-disabled","true");}else{b.removeAttribute("aria-disabled");}
    var extra=locked?t.lockedTab:(done[i]?t.statusDone:"");
    b.setAttribute("aria-label",i+". "+names[i]+(extra?" – "+extra:""));
    b.title=locked?t.lockedTab:names[i];
    $("s"+i).hidden=!sel;
  });
}
function renderProgress(){
  var t=T(),n=count(state.seen),bar=$("progressBar");
  $("progressText").textContent=t.progress(n);
  bar.setAttribute("aria-valuenow",String(n));
  bar.setAttribute("aria-valuetext",t.progress(n));
  bar.setAttribute("aria-label",t.progress(n));
  $("progressFill").style.width=(n/5*100)+"%";
  $("goRel").hidden=!state.unlocked;
}
function renderButtons(){
  var t=T();
  each(".pbtn",function(b){
    var k=b.getAttribute("data-p"),seen=!!state.seen[k];
    b.querySelector(".name").textContent=t.p[k].name;
    b.querySelector(".status").innerHTML=(seen?ICO_CHECK:ICO_DOT)+"<span>"+esc(seen?t.statusDone:t.statusTodo)+"</span>";
    b.classList.toggle("seen",seen);
    b.setAttribute("aria-pressed",state.current===k?"true":"false");
    b.setAttribute("aria-label",t.p[k].name+", "+SYM_SR[k]+" – "+(seen?t.statusDone:t.statusTodo));
  });
  $("dialCenter").innerHTML=state.current?SYM[state.current]:"?";
  $("needle").style.transform="rotate("+(state.current?ANGLE[state.current]:0)+"deg)";
}
function renderFiche(){
  var t=T(),f=$("fiche"),k=state.current;
  if(!k){f.innerHTML='<div class="fiche-empty">'+ICO_EMPTY+'<h3 id="ficheTitle">'+fmt(t.placeholderTitle)+'</h3><p>'+fmt(t.placeholderText)+'</p></div>';return;}
  var p=t.p[k],type=CALLOUT[k],isStat=(k==="stat");
  f.innerHTML='<div class="fiche-head"><span class="fiche-sym">'+SYM[k]+'</span><div><span class="symlbl">'+fmt(t.lblSymbol)+(state.lang==="fr"?"\u00a0: ":": ")+SYM[k]+'</span><h3 id="ficheTitle">'+fmt(p.name)+'</h3></div></div>'+
    '<dl class="facts"><div><dt>'+fmt(isStat?t.lblDefinition:t.lblReference)+'</dt><dd>'+fmt(isStat?p.def:p.ref)+'</dd></div>'+
    '<div><dt>'+fmt(t.lblUsage)+'</dt><dd>'+fmt(p.usage)+'</dd></div></dl>'+
    '<div class="callout '+type+'" role="note"><p class="callout-title">'+(type==="remember"?ICO_REMEMBER:ICO_PRACTICE)+'<span>'+fmt(type==="remember"?t.remember:t.practice)+'</span></p><p>'+fmt(p.msg)+'</p></div>';
}
function renderRelation(){
  var t=T(),z=state.zone;
  function term(key,inner){return '<span class="t'+(z===key?' hl':'')+'">'+inner+'</span>';}
  $("formula").innerHTML=term("abs",SYM.abs)+'<span class="op">=</span>'+term("rel",SYM.rel)+'<span class="op">+</span>'+term("atm",SYM.atm);
  $("calc").innerHTML=term("abs",SYM.abs)+' = '+term("rel","2")+' + '+term("atm",num("1.013"))+' = '+term("abs",num("3.013")+"&nbsp;bar");
  each(".exvals>div",function(e){e.classList.toggle("hl",e.getAttribute("data-ex")===z);});
  each(".zbtn",function(b){
    var k=b.getAttribute("data-z"),seen=!!state.zonesSeen[k];
    b.innerHTML='<span class="zname">'+fmt(t.p[k].name)+'</span><span class="zsym" aria-hidden="true">'+SYM[k]+'</span><span class="status">'+(seen?ICO_CHECK:ICO_DOT)+'<span>'+esc(seen?t.statusDone:t.statusTodo)+'</span></span>';
    b.classList.toggle("seen",seen);
    b.setAttribute("aria-pressed",z===k?"true":"false");
    b.setAttribute("aria-label",t.p[k].name+", "+SYM_SR[k]+" – "+(seen?t.statusDone:t.statusTodo));
  });
  $("zexpl").innerHTML=z?'<strong>'+fmt(t.p[z].name)+'</strong>'+fmt(t.zone[z]):'<span class="ph">'+fmt(t.relPlaceholder)+'</span>';
  $("relProg").textContent=t.relProgress(count(state.zonesSeen));
  $("goNeg").hidden=count(state.zonesSeen)<3;
}
function renderNeg(){
  var t=T(),n=state.neg;
  each(".nbtn",function(b){
    var k=b.getAttribute("data-n"),seen=!!state.negSeen[k];
    b.querySelector(".nl").textContent=t.negBtn[k];
    b.querySelector(".chk").innerHTML=seen?ICO_CHECK:"";
    b.setAttribute("aria-pressed",n===k?"true":"false");
    b.setAttribute("aria-label",t.negBtn[k]+(seen?" – "+t.statusDone:""));
  });
  $("ncap").innerHTML=n?'<strong>'+fmt(t.negBtn[n])+'</strong><br>'+fmt(t.negCap[n]):fmt(t.negCapEmpty);
  $("sPos").classList.toggle("on",n==="pos");
  $("sAtm").classList.toggle("on",n==="zero");
  $("sNeg").classList.toggle("on",n==="neg");
  placeMarker();
}
function placeMarker(){
  var m=$("marker"),n=state.neg;
  if(!n||$("s3").hidden){m.hidden=true;return;}
  var tg=n==="pos"?$("sPos"):(n==="zero"?$("sAtm"):$("sNeg"));
  m.hidden=false;m.style.top=(tg.offsetTop+tg.offsetHeight/2)+"px";
}
function renderFinal(){$("final").hidden=!state.finalOpen;}
function renderAll(){renderStatic();renderTabs();renderProgress();renderButtons();renderFiche();renderRelation();renderNeg();renderFinal();}

/* ---------- Navigation ---------- */
function goSlide(i,focusTab){
  var t=T();
  if(i>1&&!state.unlocked){hint(t.lockedTab);announce(t.lockedTab);return;}
  state.slide=i;
  renderTabs();
  $("s"+i).scrollTop=0;
  placeMarker();
  if(focusTab)$("tab"+i).focus();
}
function onTabKey(e){
  var i=parseInt(e.currentTarget.getAttribute("data-s"),10),order=state.unlocked?[1,2,3]:[1],pos=order.indexOf(i),next=null;
  if(e.key==="ArrowRight"||e.key==="ArrowDown")next=order[(pos+1)%order.length];
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp")next=order[(pos-1+order.length)%order.length];
  else if(e.key==="Home")next=order[0];
  else if(e.key==="End")next=order[order.length-1];
  if(next!==null){e.preventDefault();goSlide(next,true);}
}

/* ---------- Interactions ---------- */
function checkDone(){
  if(!state.done&&count(state.seen)===5&&count(state.zonesSeen)===3&&count(state.negSeen)===3){
    state.done=true;state.finalOpen=true;return true;
  }
  return false;
}
function openFinalFocus(){
  renderFinal();
  var t=T();
  announce(t.endTitle+". "+t.endText);
  setTimeout(function(){$("endTitle").focus();},30);
}
function selectPressure(k){
  var t=T();
  state.current=k;state.seen[k]=true;
  var msg=t.announceSelect(t.p[k].name)+" "+t.progress(count(state.seen))+".";
  if(!state.unlocked&&count(state.seen)===5){state.unlocked=true;msg+=" "+t.announceUnlock;}
  renderTabs();renderProgress();renderButtons();renderFiche();
  announce(msg);
  if(window.innerWidth<=700){var f=$("fiche");if(f.scrollIntoView)f.scrollIntoView({behavior:"smooth",block:"start"});}
  else{$("fiche").scrollTop=0;}
}
function selectZone(k){
  var t=T();
  state.zone=k;state.zonesSeen[k]=true;
  var fin=checkDone();
  renderTabs();renderRelation();
  announce(t.p[k].name+". "+t.zone[k]+" "+t.relProgress(count(state.zonesSeen))+".");
  if(fin)openFinalFocus();
}
function selectNeg(k){
  var t=T();
  state.neg=k;state.negSeen[k]=true;
  var fin=checkDone();
  renderTabs();renderNeg();
  announce(t.negBtn[k]+". "+t.negCap[k]);
  if(fin)openFinalFocus();
}
function closeFinal(){state.finalOpen=false;renderFinal();$("tab"+state.slide).focus();}
function resetAll(){
  var lang=state.lang;state=freshState(lang);renderAll();
  $("tab1").focus();
  var t=T();announce(t.resetDone+" "+t.progress(0)+".");
}

function init(){
  var lang="fr";
  try{var m=/[?&]lang=([a-z]{2})/.exec(window.location.search);if(m&&I18N[m[1]])lang=m[1];}catch(e){}
  state=freshState(lang);
  buildTicks();buildButtons();buildLang();
  [1,2,3].forEach(function(i){var b=$("tab"+i);b.addEventListener("click",function(){goSlide(i,false);});b.addEventListener("keydown",onTabKey);});
  $("goRel").addEventListener("click",function(){goSlide(2,true);});
  $("goNeg").addEventListener("click",function(){goSlide(3,true);});
  each(".zbtn",function(b){b.addEventListener("click",function(){selectZone(b.getAttribute("data-z"));});});
  each(".nbtn",function(b){b.addEventListener("click",function(){selectNeg(b.getAttribute("data-n"));});});
  $("resetBtn").addEventListener("click",resetAll);
  $("closeBtn").addEventListener("click",closeFinal);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.finalOpen)closeFinal();});
  var rt=null;
  window.addEventListener("resize",function(){if(rt)clearTimeout(rt);rt=setTimeout(placeMarker,120);});
  renderAll();
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
})();
</script>
</body>
