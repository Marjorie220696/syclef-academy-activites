<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Relevez le défi – SYCLEF ACADEMY</title>
<style>
:root{--blue:#386FB6;--orange:#F4951F;--green:#94C356;--gl:#B7BECF;--gd:#66778F;--white:#FFFFFF;--txt:#4F5E74;
  --b06:rgba(56,111,182,.06);--b12:rgba(56,111,182,.12);--b25:rgba(56,111,182,.25);--o12:rgba(244,149,31,.13);--odk:#A85F06;--g15:rgba(148,195,86,.17);--gdk:#4C7A1C;--gl35:rgba(183,190,207,.35);
  --font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;--r:14px;--sh:0 4px 16px rgba(102,119,143,.14)}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;overflow-y:auto}
html,body{margin:0;padding:0;width:100%;max-width:100%;height:auto;min-height:100%;background:var(--white)}
body{font-family:var(--font);color:var(--txt);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
img,svg{max-width:100%;height:auto}
button,select{font-family:inherit;font-size:inherit}
h1,h2,h3{color:var(--blue);line-height:1.2;margin:0}
p{margin:.4em 0}
.app{container-type:inline-size;width:100%;max-width:920px;margin:0 auto;padding:0 12px 24px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* En-tête permanent */
.top{padding:8px 0 10px;border-bottom:1px solid var(--gl35);margin-bottom:14px}
.top .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.logo{display:block;height:52px;width:auto;flex:0 0 auto}
.crumb{flex:1 1 220px;min-width:0;font-weight:700;color:var(--blue);font-size:.98rem}
.crumb b{color:var(--orange)}
.langbox select{min-height:44px;max-width:100%;border:2px solid var(--gl);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:4px 8px;cursor:pointer}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.prog .bar{flex:1;height:8px;border-radius:8px;background:var(--gl35);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .4s}
.prog .lbl{flex:0 0 auto;font-weight:700;font-size:.88rem;color:var(--blue)}

/* Écrans */
.screen{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--gl35);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--odk);background:var(--o12);border-radius:99px;padding:3px 10px;margin-bottom:8px}
.h-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.h-step .n{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.h-step h2{font-size:1.2rem;padding-top:4px}
.instr{display:flex;gap:8px;background:var(--b06);border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-weight:700;color:var(--blue);font-size:.95rem}
.instr::before{content:"☝";flex:0 0 auto}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;max-width:100%;padding:10px 26px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;text-align:center;white-space:normal;touch-action:manipulation}
.btn:disabled{background:var(--gl);cursor:not-allowed}
.btn.retry{background:var(--orange);color:#3D2400}
.hint{font-size:.88rem;color:var(--gd);font-weight:700;margin-top:6px}
.note{font-size:.8rem;font-style:italic;color:var(--gd)}

/* Ouverture */
.open-hero{border-radius:var(--r);background:radial-gradient(circle at calc(100% + 10px) -10px,transparent 74px,rgba(255,255,255,.12) 75px,rgba(255,255,255,.12) 100px,transparent 101px),var(--blue);color:#fff;padding:20px 18px;margin-bottom:14px;position:relative}
.open-hero .sig{display:inline-flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 14px}
.open-hero h1{color:#fff;font-size:clamp(1.4rem,5cqi,2rem);margin:10px 0 4px;position:relative;z-index:1}
.open-hero .mod{font-weight:700;opacity:.9;position:relative;z-index:1}
.langpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--b06);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.langpick label{font-weight:700;color:var(--blue)}
.langpick select{min-height:46px;flex:1 1 200px;max-width:320px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:4px 8px}

/* Situation */
.sit{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@container (min-width:720px){.sit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.fig{background:var(--b06);border-radius:12px;padding:8px}
.fig svg{display:block;width:100%;height:auto}
.sv{font-family:var(--font);font-size:17px;font-weight:700;fill:#4F5E74}
.spot{cursor:pointer}
.spot .c{fill:var(--orange);stroke:#fff;stroke-width:3}
.spot.seen .c{fill:var(--green)}
.spot text{font-family:var(--font);font-size:17px;font-weight:700;fill:#fff;pointer-events:none}
.spot .halo{fill:none;stroke:var(--orange);stroke-width:2.5;opacity:.6}
.spot.seen .halo{stroke:var(--green)}
.spot:focus{outline:none}.spot:focus-visible .halo{stroke:var(--blue);stroke-width:4;opacity:1}
.counter{display:inline-flex;font-weight:700;color:var(--blue);background:var(--b06);border-radius:99px;padding:4px 12px;font-size:.9rem}
.counter.full{color:var(--gdk);background:var(--g15)}
.clues{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.clue{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;min-height:52px;padding:8px 12px;border-radius:12px;border:2px dashed var(--gl);background:#fff;color:var(--gd);cursor:pointer}
.clue .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700}
.clue .tx{min-width:0;flex:1}
.clue .tx b{display:block;color:var(--txt)}
.clue .tx span{display:block;font-weight:700;color:var(--blue)}
.clue.seen{border-style:solid;border-color:var(--green);background:var(--g15);cursor:default}
.clue.seen .num{background:var(--green);color:#24400A}

/* Association / classement (toucher puis placer) */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:12px;background:var(--gl35);margin-bottom:12px}
.pool .lbl{width:100%;font-size:.8rem;font-weight:700;color:var(--gd);text-transform:uppercase;letter-spacing:.05em}
.item{min-height:48px;max-width:100%;border-radius:10px;border:2px solid var(--gl);background:#fff;padding:8px 12px;font-weight:700;color:var(--txt);cursor:pointer;text-align:left}
.item[aria-pressed="true"]{border-color:var(--blue);background:var(--b12);color:var(--blue);box-shadow:0 0 0 3px var(--b12)}
.bins{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:600px){.bins.b4{grid-template-columns:repeat(2,minmax(0,1fr))}.bins.b2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bin{width:100%;text-align:left;border-radius:12px;border:2px dashed var(--blue);background:#fff;padding:10px;min-height:88px;cursor:pointer;color:var(--txt);display:flex;flex-direction:column;gap:6px}
.bin.armed{background:var(--b06);border-style:solid}
.bin h3{font-size:1rem}
.bin .d{font-size:.85rem;color:var(--gd)}
.placed{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:inline-flex;align-items:center;gap:6px;border-radius:8px;background:var(--b12);color:var(--blue);padding:4px 8px;font-weight:700;font-size:.9rem;border:0;cursor:pointer;text-align:left;max-width:100%}
.pl::after{content:"↺";opacity:.6}
.pl.ok{background:var(--g15);color:var(--gdk);cursor:default}.pl.ok::after{content:"✓";opacity:1}
.pl.ko{background:var(--o12);color:var(--odk)}.pl.ko::after{content:"✕";opacity:1}

/* Choix */
.choice{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@container (min-width:720px){.choice{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:460px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{position:relative;width:100%;min-height:64px;text-align:left;padding:12px 12px 12px 50px;border-radius:12px;border:2px solid var(--gl);background:#fff;color:var(--txt);cursor:pointer;font-weight:700;font-size:1.08rem}
.opt .mk{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--gl);display:grid;place-items:center;color:#fff;font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--b06);color:var(--blue)}.opt[aria-pressed="true"] .mk{background:var(--blue);border-color:var(--blue)}.opt[aria-pressed="true"] .mk::after{content:"●"}
.opt.ok{border-color:var(--green);background:var(--g15);color:var(--gdk)}.opt.ok .mk{background:var(--green);border-color:var(--green);color:#24400A}.opt.ok .mk::after{content:"✓"}
.opt.ko{border-color:var(--orange);background:var(--o12);color:var(--odk)}.opt.ko .mk{background:var(--orange);border-color:var(--orange)}.opt.ko .mk::after{content:"✕"}

/* Feedback (identique pour toutes les activités) */
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.fb .ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.2rem}
.fb .bd{flex:1;min-width:0}
.fb h3{font-size:1.15rem}
.fb.ok{background:var(--g15);border-left:6px solid var(--green)}.fb.ok .ic{background:var(--green);color:#24400A}.fb.ok h3{color:var(--gdk)}
.fb.ko{background:var(--o12);border-left:6px solid var(--orange)}.fb.ko .ic{background:var(--orange);color:#3D2400}.fb.ko h3{color:var(--odk)}
@media (prefers-reduced-motion:no-preference){.fb{animation:rise .3s ease-out}.fb.ok .ic{animation:pop .45s ease-out}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* À retenir / Fin */
.retain h2,.final h2{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.rlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.rlist li{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px;background:var(--b06);border-left:6px solid var(--blue);font-weight:700}
.rlist li .k{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.rlist li.warn{background:var(--o12);border-left-color:var(--orange);color:var(--odk)}.rlist li.warn .k{background:var(--orange);color:#3D2400}
.final{text-align:center}
.final .trophy{width:76px;height:76px;border-radius:50%;background:var(--green);color:#24400A;display:grid;place-items:center;font-size:2.2rem;margin:4px auto 10px}
.final h2{justify-content:center;color:var(--gdk)}
.final .res{display:inline-block;margin:8px 0;border-radius:99px;padding:6px 14px;background:var(--b06);color:var(--blue);font-weight:700}

@container (max-width:460px){.logo{height:46px}.card{padding:12px}.btn{width:100%}}
@supports not (container-type:inline-size){@media (min-width:720px){.sit{grid-template-columns:1fr 1fr}.choice{grid-template-columns:.9fr 1.1fr}}@media (min-width:600px){.bins.b4,.bins.b2{grid-template-columns:1fr 1fr}}@media (min-width:460px){.opts{grid-template-columns:1fr 1fr}}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 "Gauge on the suction side (pump running)", "v": "1.4 bar(g)"}, {"t": "Gauge on the discharge side (pump running)", "v": "2.4 bar(g)"}, {"t": "Pressure tappings", "v": "Close to the pump, at the same level, comparable diameters"}, {"t": "Fluid", "v": "Water without glycol: ρ ≈ 1 000 kg/m³; g ≈ 9.81 m/s²"}, {"t": "High point of the system", "v": "10 m above the gauge"}, {"t": "Pressure at the low point, pump stopped", "v": "1.5 bar(g) – atmospheric pressure taken as 1.0 bar"}], "lbl": {"pump": "Circulator", "high": "High point", "low": "Low point", "dz": "10 m", "alt": "Schematic diagram of a closed circuit: circulator with gauges on the suction and discharge sides, riser up to the high point located 10 m above the gauge."}}, "steps": [{"title": "Identify the reference of each value", "instr": "Match each value from your readings to the type of pressure it represents.", "items": ["1.4 bar(g) read on the suction side", "3.4 bar(a) on the discharge side", "≈ 1.0 bar: ambient air pressure", "1.0 bar: discharge − suction difference"], "bins": [{"t": "Gauge pressure", "d": "Reference: local atmosphere"}, {"t": "Absolute pressure", "d": "Reference: perfect vacuum"}, {"t": "Atmospheric pressure", "d": "Ambient air"}, {"t": "Differential pressure", "d": "Difference between two points"}], "ok": "The gauge shows gauge pressure (bar(g)). On the discharge side, pabs = prel + patm = 2.4 + 1.0 = 3.4 bar(a). The difference between two points is a differential pressure: it is calculated between values with the same reference.", "hint": "Look at the notation: (g) for gauge, (a) for absolute. A difference between two points has no reference of its own: it is a difference."}, {"title": "Calculate the pump head", "instr": "Based on the clues gathered, what pump head does the circulator deliver?", "options": ["≈ 10.2 m WC", "≈ 24.5 m WC", "≈ 38.8 m WC", "≈ 1.0 m WC"], "ok": "Δp = 2.4 − 1.4 = 1.0 bar = 100 kPa. Tappings at the same level, comparable diameters, water: H ≈ Δp/(ρg) = 100 000/(1 000 × 9.81) ≈ 10.2 m WC.", "hint": "The pump head is derived from the difference between discharge and suction, with the pump running. Then convert this difference into metres of water column: 1 bar ≈ 10.2 m WC."}, {"title": "Check the pressure at the high point", "instr": "With the pump stopped, what gauge pressure theoretically remains at the high point? Tap the correct value on the column.", "options": ["≈ 2.48 bar(g)", "≈ 1.5 bar(g)", "≈ 0.52 bar(g)", "≈ − 0.48 bar(g)"], "ok": "Pressure decreases as you go up: 10 m of water ≈ 1 000 × 9.81 × 10 = 98 100 Pa ≈ 0.98 bar. At the high point: 1.5 − 0.98 ≈ 0.52 bar(g). Sufficient pressure at the high point limits air ingress, local loss of prime and the risk of cavitation.", "hint": "In a water column, pressure increases going down and decreases going up. With water, allow approximately 0.098 bar per metre of vertical difference."}, {"title": "Complete the service report", "instr": "Classify each statement: does it relate to the static pressurisation of the system or to the pump head?", "items": ["Maintain sufficient pressure at the high point", "Derived from the discharge − suction difference, while running", "Defined according to the static height, the expansion vessel and the system specifications", "Mainly overcomes the pressure losses of the closed circuit", "Measured with the pump stopped", "Depends on the flow rate and rotational speed"], "bins": [{"t": "Static pressurisation", "d": "System fill pressure"}, {"t": "Pump head", "d": "Energy supplied while running"}], "sol": [0, 1, 0, 1, 0, 1], "ok": "Two different functions: static pressurisation (1.5 bar(g) when stopped, ≈ 0.52 bar(g) at the high point) protects the high point; the pump delivers ≈ 10.2 m WC while running to overcome pressure losses.", "hint": "Ask yourself whether the item exists with the pump stopped (pressurisation) or only while running, between suction and discharge (pump head)."}], "retain": ["Always note the reference: bar(g), bar(a) or Δp. Never add values with different references without converting: pabs = prel + patm.", "Pump head ≈ Δp / (ρ × g), between discharge and suction, pump running. With water, a 1 bar difference ≈ 10.2 m WC.", "Caution: do not confuse static pressure with pump head. Pressurisation protects the high point; the pump mainly overcomes pressure losses."]}, "es": {"meta": {"code": "es", "lang": "Español"}, "ui": {"challenge": "Acepte el reto", "step": "Paso {n} / {t}", "language": "Idioma", "chooseLang": "Elija su idioma", "start": "Empezar", "continue": "Continuar", "validate": "Validar", "retry": "Reintentar", "finish": "Terminar", "correct": "¡Bien visto!", "incorrect": "No exactamente...", "intro": "Ha descubierto los conceptos esenciales de este módulo. ¡Ahora le toca a usted ponerlos en práctica!", "mission": "Su misión", "situation": "La situación", "clueCounter": "Pistas consultadas: {n} / {t}", "clueHidden": "Toque para consultar", "clueLock": "Consulte todas las pistas para continuar.", "selectFirst": "Seleccione una respuesta para validar.", "placeAll": "Coloque todos los elementos para validar.", "tapThenPlace": "Toque un elemento y, a continuación, la categoría en la que desea colocarlo.", "toPlace": "Elementos por colocar", "selected": "Seleccionado", "retain": "Para recordar", "doneTitle": "¡Reto completado!", "doneText": "Ha terminado la actividad de puesta en práctica.", "result": "Pasos superados al primer intento: {s} / {t}", "next": "Ahora puede continuar con su itinerario formativo.", "schemaNote": "Esquema de principio simplificado, no a escala.", "module": "Módulo"}, "module": "HYD-02 · Presiones y altura manométrica", "title": "Comprobar un circulador en circuito cerrado", "missionText": "Interviene en el circuito cerrado de calefacción de un edificio, lleno de agua. El circulador está en funcionamiento. Debe interpretar las lecturas de presión, calcular la altura manométrica proporcionada por la bomba, comprobar la presión en el punto alto y completar su ficha de intervención sin confundir la presurización estática con la altura manométrica.", "situation": {"instr": "Toque cada marca del esquema, o cada pista de la lista, para recoger la información útil.", "clues": [{"t": "Manómetro en la aspiración (bomba en marcha)", "v": "1,4 bar(g)"}, {"t": "Manómetro en la impulsión (bomba en marcha)", "v": "2,4 bar(g)"}, {"t": "Tomas de presión", "v": "Cerca de la bomba, al mismo nivel, diámetros comparables"}, {"t": "Fluido", "v": "Agua sin glicol: ρ ≈ 1 000 kg/m³; g ≈ 9,81 m/s²"}, {"t": "Punto alto de la instalación", "v": "10 m por encima del manómetro"}, {"t": "Presión en el punto bajo, bomba parada", "v": "1,5 bar(g) – presión atmosférica considerada igual a 1,0 bar"}], "lbl": {"pump": "Circulador", "high": "Punto alto", "low": "Punto bajo", "dz": "10 m", "alt": "Esquema de principio de un circuito cerrado: circulador con manómetros en la aspiración y en la impulsión, montante hasta el punto alto situado 10 m por encima del manómetro."}}, "steps": [{"title": "Identificar la referencia de cada valor", "instr": "Asocie cada valor de su lectura con el tipo de presión que representa.", "items": ["1,4 bar(g) leído en la aspiración", "3,4 bar(a) en la impulsión", "≈ 1,0 bar: presión del aire ambiente", "1,0 bar: diferencia impulsión − aspiración"], "bins": [{"t": "Presión relativa", "d": "Referencia: atmósfera local"}, {"t": "Presión absoluta", "d": "Referencia: vacío perfecto"}, {"t": "Presión atmosférica", "d": "Aire ambiente"}, {"t": "Presión diferencial", "d": "Diferencia entre dos puntos"}], "ok": "El manómetro indica una presión relativa (bar(g)). En la impulsión, pabs = prel + patm = 2,4 + 1,0 = 3,4 bar(a). La diferencia entre dos puntos es una presión diferencial: se calcula entre valores con la misma referencia.", "hint": "Fíjese en la notación: (g) para relativa, (a) para absoluta. Una diferencia entre dos puntos no tiene referencia propia: es una diferencia."}, {"title": "Calcular la altura manométrica", "instr": "A partir de las pistas recogidas, ¿qué altura manométrica proporciona el circulador?", "options": ["≈ 10,2 m.c.a.", "≈ 24,5 m.c.a.", "≈ 38,8 m.c.a.", "≈ 1,0 m.c.a."], "ok": "Δp = 2,4 − 1,4 = 1,0 bar = 100 kPa. Tomas al mismo nivel, diámetros comparables, agua: H ≈ Δp/(ρg) = 100 000/(1 000 × 9,81) ≈ 10,2 m.c.a.", "hint": "La altura manométrica se deduce de la diferencia entre impulsión y aspiración, con la bomba en marcha. Convierta después esa diferencia en metros de columna de agua: 1 bar ≈ 10,2 m.c.a."}, {"title": "Comprobar la presión en el punto alto", "instr": "Con la bomba parada, ¿qué presión relativa queda teóricamente en el punto alto? Toque el valor correcto en la columna.", "options": ["≈ 2,48 bar(g)", "≈ 1,5 bar(g)", "≈ 0,52 bar(g)", "≈ − 0,48 bar(g)"], "ok": "La presión disminuye al subir: 10 m de agua ≈ 1 000 × 9,81 × 10 = 98 100 Pa ≈ 0,98 bar. En el punto alto: 1,5 − 0,98 ≈ 0,52 bar(g). Una presión suficiente en el punto alto limita la entrada de aire, el descebado local y el riesgo de cavitación.", "hint": "En una columna de agua, la presión aumenta al bajar y disminuye al subir. Con agua, cuente aproximadamente 0,098 bar por metro de diferencia vertical."}, {"title": "Completar la ficha de intervención", "instr": "Clasifique cada afirmación: ¿se refiere a la presurización estática de la instalación o a la altura manométrica de la bomba?", "items": ["Mantener una presión suficiente en el punto alto", "Se deduce de la diferencia impulsión − aspiración, en marcha", "Se define según la altura estática, el vaso de expansión y las prescripciones del sistema", "Vence principalmente las pérdidas de carga del circuito cerrado", "Medida con la bomba parada", "Depende del caudal y de la velocidad de giro"], "bins": [{"t": "Presurización estática", "d": "Presión de llenado de la instalación"}, {"t": "Altura manométrica de la bomba", "d": "Energía aportada en marcha"}], "sol": [0, 1, 0, 1, 0, 1], "ok": "Dos funciones diferentes: la presurización estática (1,5 bar(g) en parada, ≈ 0,52 bar(g) en el punto alto) protege el punto alto; la bomba proporciona ≈ 10,2 m.c.a. en marcha para vencer las pérdidas de carga.", "hint": "Pregúntese si el elemento existe con la bomba parada (presurización) o solo en marcha, entre aspiración e impulsión (altura manométrica)."}], "retain": ["Anote siempre la referencia: bar(g), bar(a) o Δp. Nunca se suman valores con referencias distintas sin conversión: pabs = prel + patm.", "Altura manométrica ≈ Δp / (ρ × g), entre impulsión y aspiración, con la bomba en marcha. Con agua, 1 bar de diferencia ≈ 10,2 m.c.a.", "Atención: no confunda presión estática y altura manométrica. La presurización protege el punto alto; la bomba vence sobre todo las pérdidas de carga."]}, "it": {"meta": {"code": "it", "lang": "Italiano"}, "ui": {"challenge": "Raccolga la sfida", "step": "Fase {n} / {t}", "language": "Lingua", "chooseLang": "Scelga la Sua lingua", "start": "Inizia", "continue": "Continua", "validate": "Conferma", "retry": "Riprova", "finish": "Termina", "correct": "Ottima osservazione!", "incorrect": "Non proprio...", "intro": "Ha scoperto i concetti essenziali di questo modulo. Ora tocca a Lei metterli in pratica!", "mission": "La Sua missione", "situation": "La situazione", "clueCounter": "Indizi consultati: {n} / {t}", "clueHidden": "Tocchi per consultare", "clueLock": "Consulti tutti gli indizi per continuare.", "selectFirst": "Selezioni una risposta per confermare.", "placeAll": "Collochi tutti gli elementi per confermare.", "tapThenPlace": "Tocchi un elemento, poi la categoria in cui collocarlo.", "toPlace": "Elementi da collocare", "selected": "Selezionato", "retain": "Da ricordare", "doneTitle": "Sfida completata!", "doneText": "Ha completato l’attività pratica.", "result": "Fasi superate al primo tentativo: {s} / {t}", "next": "Ora può proseguire il Suo percorso.", "schemaNote": "Schema di principio semplificato, non in scala.", "module": "Modulo"}, "module": "HYD-02 · Pressioni e prevalenza", "title": "Controllare un circolatore in un circuito chiuso", "missionText": "Interviene sul circuito chiuso di riscaldamento di un edificio, riempito d’acqua. Il circolatore è in funzione. Deve interpretare le letture di pressione, calcolare la prevalenza fornita dalla pompa, verificare la pressione nel punto alto e completare la Sua scheda di intervento senza confondere pressurizzazione statica e prevalenza.", "situation": {"instr": "Tocchi ogni riferimento dello schema, o ogni indizio dell’elenco, per rilevare le informazioni utili.", "clues": [{"t": "Manometro in aspirazione (pompa in funzione)", "v": "1,4 bar(g)"}, {"t": "Manometro in mandata (pompa in funzione)", "v": "2,4 bar(g)"}, {"t": "Prese di pressione", "v": "Vicine alla pompa, allo stesso livello, diametri comparabili"}, {"t": "Fluido", "v": "Acqua senza glicole: ρ ≈ 1 000 kg/m³; g ≈ 9,81 m/s²"}, {"t": "Punto alto dell’impianto", "v": "10 m sopra il manometro"}, {"t": "Pressione nel punto basso, pompa ferma", "v": "1,5 bar(g) – pressione atmosferica assunta pari a 1,0 bar"}], "lbl": {"pump": "Circolatore", "high": "Punto alto", "low": "Punto basso", "dz": "10 m", "alt": "Schema di principio di un circuito chiuso: circolatore con manometri in aspirazione e in mandata, colonna montante fino al punto alto situato 10 m sopra il manometro."}}, "steps": [{"title": "Identificare il riferimento di ogni valore", "instr": "Associ ogni valore della Sua lettura al tipo di pressione che rappresenta.", "items": ["1,4 bar(g) letto in aspirazione", "3,4 bar(a) in mandata", "≈ 1,0 bar: pressione dell’aria ambiente", "1,0 bar: differenza mandata − aspirazione"], "bins": [{"t": "Pressione relativa", "d": "Riferimento: atmosfera locale"}, {"t": "Pressione assoluta", "d": "Riferimento: vuoto perfetto"}, {"t": "Pressione atmosferica", "d": "Aria ambiente"}, {"t": "Pressione differenziale", "d": "Differenza tra due punti"}], "ok": "Il manometro indica una pressione relativa (bar(g)). In mandata, pabs = prel + patm = 2,4 + 1,0 = 3,4 bar(a). La differenza tra due punti è una pressione differenziale: si calcola tra valori con lo stesso riferimento.", "hint": "Osservi la notazione: (g) per relativa, (a) per assoluta. Una differenza tra due punti non ha un riferimento proprio: è una differenza."}, {"title": "Calcolare la prevalenza", "instr": "In base agli indizi rilevati, quale prevalenza fornisce il circolatore?", "options": ["≈ 10,2 m c.a.", "≈ 24,5 m c.a.", "≈ 38,8 m c.a.", "≈ 1,0 m c.a."], "ok": "Δp = 2,4 − 1,4 = 1,0 bar = 100 kPa. Prese allo stesso livello, diametri comparabili, acqua: H ≈ Δp/(ρg) = 100 000/(1 000 × 9,81) ≈ 10,2 m c.a.", "hint": "La prevalenza si ricava dalla differenza tra mandata e aspirazione, con la pompa in funzione. Converta poi questa differenza in metri di colonna d’acqua: 1 bar ≈ 10,2 m c.a."}, {"title": "Verificare la pressione nel punto alto", "instr": "Con la pompa ferma, quale pressione relativa rimane teoricamente nel punto alto? Tocchi il valore corretto sulla colonna.", "options": ["≈ 2,48 bar(g)", "≈ 1,5 bar(g)", "≈ 0,52 bar(g)", "≈ − 0,48 bar(g)"], "ok": "La pressione diminuisce salendo: 10 m d’acqua ≈ 1 000 × 9,81 × 10 = 98 100 Pa ≈ 0,98 bar. Nel punto alto: 1,5 − 0,98 ≈ 0,52 bar(g). Una pressione sufficiente nel punto alto limita l’ingresso d’aria, il disinnesco locale e il rischio di cavitazione.", "hint": "In una colonna d’acqua la pressione aumenta scendendo e diminuisce salendo. Con l’acqua, consideri circa 0,098 bar per metro di dislivello."}, {"title": "Completare la scheda di intervento", "instr": "Classifichi ogni affermazione: riguarda la pressurizzazione statica dell’impianto o la prevalenza della pompa?", "items": ["Mantenere una pressione sufficiente nel punto alto", "Si ricava dalla differenza mandata − aspirazione, in funzione", "Si definisce in base all’altezza statica, al vaso di espansione e alle prescrizioni dell’impianto", "Vince principalmente le perdite di carico del circuito chiuso", "Misurata a pompa ferma", "Dipende dalla portata e dalla velocità di rotazione"], "bins": [{"t": "Pressurizzazione statica", "d": "Pressione di riempimento dell’impianto"}, {"t": "Prevalenza della pompa", "d": "Energia fornita in funzione"}], "sol": [0, 1, 0, 1, 0, 1], "ok": "Due funzioni diverse: la pressurizzazione statica (1,5 bar(g) a pompa ferma, ≈ 0,52 bar(g) nel punto alto) protegge il punto alto; la pompa fornisce ≈ 10,2 m c.a. in funzione per vincere le perdite di carico.", "hint": "Si chieda se l’elemento esiste a pompa ferma (pressurizzazione) o solo in funzione, tra aspirazione e mandata (prevalenza)."}], "retain": ["Annoti sempre il riferimento: bar(g), bar(a) o Δp. Non si sommano mai valori con riferimenti diversi senza conversione: pabs = prel + patm.", "Prevalenza ≈ Δp / (ρ × g), tra mandata e aspirazione, pompa in funzione. Con l’acqua, 1 bar di differenza ≈ 10,2 m c.a.", "Attenzione: non confonda pressione statica e prevalenza. La pressurizzazione protegge il punto alto; la pompa vince soprattutto le perdite di carico."]}, "ro": {"meta": {"code": "ro", "lang": "Română"}, "ui": {"challenge": "Acceptați provocarea", "step": "Etapa {n} / {t}", "language": "Limba", "chooseLang": "Alegeți limba dumneavoastră", "start": "Începeți", "continue": "Continuați", "validate": "Validați", "retry": "Reîncercați", "finish": "Finalizați", "correct": "Bine observat!", "incorrect": "Nu chiar...", "intro": "Ați descoperit noțiunile esențiale ale acestui modul. Acum este rândul dumneavoastră să le puneți în practică!", "mission": "Misiunea dumneavoastră", "situation": "Situația", "clueCounter": "Indicii consultate: {n} / {t}", "clueHidden": "Atingeți pentru a consulta", "clueLock": "Consultați toate indiciile pentru a continua.", "selectFirst": "Selectați un răspuns pentru a valida.", "placeAll": "Plasați toate elementele pentru a valida.", "tapThenPlace": "Atingeți un element, apoi categoria în care doriți să-l plasați.", "toPlace": "Elemente de plasat", "selected": "Selectat", "retain": "De reținut", "doneTitle": "Provocare finalizată!", "doneText": "Ați finalizat activitatea practică.", "result": "Etape reușite din prima încercare: {s} / {t}", "next": "Acum vă puteți continua parcursul.", "schemaNote": "Schemă de principiu simplificată, nu la scară.", "module": "Modul"}, "module": "HYD-02 · Presiuni și înălțime de pompare", "title": "Verificarea unei pompe de circulație într-un circuit închis", "missionText": "Interveniți pe circuitul închis de încălzire al unei clădiri, umplut cu apă. Pompa de circulație funcționează. Trebuie să interpretați citirile de presiune, să calculați înălțimea de pompare furnizată de pompă, să verificați presiunea în punctul cel mai înalt și să completați fișa de intervenție fără a confunda presurizarea statică cu înălțimea de pompare.", "situation": {"instr": "Atingeți fiecare reper din schemă sau fiecare indiciu din listă pentru a nota informațiile utile.", "clues": [{"t": "Manometru pe aspirație (pompa în funcțiune)", "v": "1,4 bar(g)"}, {"t": "Manometru pe refulare (pompa în funcțiune)", "v": "2,4 bar(g)"}, {"t": "Prize de presiune", "v": "Aproape de pompă, la același nivel, diametre comparabile"}, {"t": "Fluid", "v": "Apă fără glicol: ρ ≈ 1 000 kg/m³; g ≈ 9,81 m/s²"}, {"t": "Punctul cel mai înalt al rețelei", "v": "La 10 m deasupra manometrului"}, {"t": "Presiunea în punctul cel mai jos, pompa oprită", "v": "1,5 bar(g) – presiunea atmosferică considerată egală cu 1,0 bar"}], "lbl": {"pump": "Pompă de circulație", "high": "Punct înalt", "low": "Punct jos", "dz": "10 m", "alt": "Schemă de principiu a unui circuit închis: pompă de circulație cu manometre pe aspirație și pe refulare, coloană ascendentă până la punctul cel mai înalt, situat la 10 m deasupra manometrului."}}, "steps": [{"title": "Identificați referința fiecărei valori", "instr": "Asociați fiecare valoare din citirile dumneavoastră cu tipul de presiune pe care îl reprezintă.", "items": ["1,4 bar(g) citit pe aspirație", "3,4 bar(a) pe refulare", "≈ 1,0 bar: presiunea aerului ambiant", "1,0 bar: diferența refulare − aspirație"], "bins": [{"t": "Presiune relativă", "d": "Referință: atmosfera locală"}, {"t": "Presiune absolută", "d": "Referință: vid perfect"}, {"t": "Presiune atmosferică", "d": "Aerul ambiant"}, {"t": "Presiune diferențială", "d": "Diferența dintre două puncte"}], "ok": "Manometrul indică o presiune relativă (bar(g)). Pe refulare, pabs = prel + patm = 2,4 + 1,0 = 3,4 bar(a). Diferența dintre două puncte este o presiune diferențială: se calculează între valori cu aceeași referință.", "hint": "Observați notația: (g) pentru relativă, (a) pentru absolută. O diferență între două puncte nu are o referință proprie: este o diferență."}, {"title": "Calculați înălțimea de pompare", "instr": "Pe baza indiciilor notate, ce înălțime de pompare furnizează pompa de circulație?", "options": ["≈ 10,2 mCA", "≈ 24,5 mCA", "≈ 38,8 mCA", "≈ 1,0 mCA"], "ok": "Δp = 2,4 − 1,4 = 1,0 bar = 100 kPa. Prize la același nivel, diametre comparabile, apă: H ≈ Δp/(ρg) = 100 000/(1 000 × 9,81) ≈ 10,2 mCA.", "hint": "Înălțimea de pompare se deduce din diferența dintre refulare și aspirație, cu pompa în funcțiune. Convertiți apoi această diferență în metri coloană de apă: 1 bar ≈ 10,2 mCA."}, {"title": "Verificați presiunea în punctul cel mai înalt", "instr": "Cu pompa oprită, ce presiune relativă rămâne teoretic în punctul cel mai înalt? Atingeți valoarea corectă pe coloană.", "options": ["≈ 2,48 bar(g)", "≈ 1,5 bar(g)", "≈ 0,52 bar(g)", "≈ − 0,48 bar(g)"], "ok": "Presiunea scade pe măsură ce urcăm: 10 m de apă ≈ 1 000 × 9,81 × 10 = 98 100 Pa ≈ 0,98 bar. În punctul cel mai înalt: 1,5 − 0,98 ≈ 0,52 bar(g). O presiune suficientă în punctul cel mai înalt limitează pătrunderea aerului, dezamorsarea locală și riscul de cavitație.", "hint": "Într-o coloană de apă, presiunea crește la coborâre și scade la urcare. Pentru apă, socotiți aproximativ 0,098 bar pe metru de diferență de nivel."}, {"title": "Completați fișa de intervenție", "instr": "Clasificați fiecare afirmație: se referă la presurizarea statică a rețelei sau la înălțimea de pompare a pompei?", "items": ["Menținerea unei presiuni suficiente în punctul cel mai înalt", "Se deduce din diferența refulare − aspirație, în funcțiune", "Se stabilește în funcție de înălțimea statică, vasul de expansiune și prescripțiile sistemului", "Învinge în principal pierderile de sarcină ale circuitului închis", "Măsurată cu pompa oprită", "Depinde de debit și de turația pompei"], "bins": [{"t": "Presurizare statică", "d": "Presiunea de umplere a rețelei"}, {"t": "Înălțimea de pompare", "d": "Energia furnizată în funcțiune"}], "sol": [0, 1, 0, 1, 0, 1], "ok": "Două funcții diferite: presurizarea statică (1,5 bar(g) cu pompa oprită, ≈ 0,52 bar(g) în punctul cel mai înalt) protejează punctul cel mai înalt; pompa furnizează ≈ 10,2 mCA în funcțiune pentru a învinge pierderile de sarcină.", "hint": "Întrebați-vă dacă elementul există cu pompa oprită (presurizare) sau doar în funcțiune, între aspirație și refulare (înălțime de pompare)."}], "retain": ["Notați întotdeauna referința: bar(g), bar(a) sau Δp. Nu adunați niciodată valori cu referințe diferite fără conversie: pabs = prel + patm.", "Înălțimea de pompare ≈ Δp / (ρ × g), între refulare și aspirație, cu pompa în funcțiune. Pentru apă, o diferență de 1 bar ≈ 10,2 mCA.", "Atenție: nu confundați presiunea statică cu înălțimea de pompare. Presurizarea protejează punctul cel mai înalt; pompa învinge în special pierderile de sarcină."]}, "pl": {"meta": {"code": "pl", "lang": "Polski"}, "ui": {"challenge": "Czas na wyzwanie", "step": "Krok {n} / {t}", "language": "Język", "chooseLang": "Wybór języka", "start": "Rozpocznij", "continue": "Dalej", "validate": "Zatwierdź", "retry": "Spróbuj ponownie", "finish": "Zakończ", "correct": "Dobrze zauważone!", "incorrect": "Nie do końca...", "intro": "Najważniejsze zagadnienia tego modułu zostały już omówione. Teraz czas zastosować je w praktyce!", "mission": "Zadanie", "situation": "Sytuacja", "clueCoun , "dz": "10 m", "alt": "Schemat ideowy obiegu zamkniętego: pompa obiegowa z manometrami po stronie ssawnej i tłocznej, pion prowadzący do najwyższego punktu położonego 10 m powyżej manometru."}}, "steps": [{"title": "Określenie odniesienia każdej wartości", "instr": "Należy przyporządkować każdą odczytaną wartość do rodzaju ciśnienia, który ona przedstawia.", "items": ["1,4 bar(g) odczytane po stronie ssawnej", "3,4 bar(a) po stronie tłocznej", "≈ 1,0 bar: ciśnienie otaczającego powietrza", "1,0 bar: różnica tłoczenie − ssanie"], "bins": [{"t": "Ciśnienie względne", "d": "Odniesienie: lokalne ciśnienie atmosferyczne"}, {"t": "Ciśnienie bezwzględne", "d": "Odniesienie: próżnia doskonała"}, {"t": "Ciśnienie atmosferyczne", "d": "Otaczające powietrze"}, {"t": "Ciśnienie różnicowe", "d": "Różnica między dwoma punktami"}], "ok": "Manometr wskazuje ciśnienie względne (bar(g)). Po stronie tłocznej pabs = prel + patm = 2,4 + 1,0 = 3,4 bar(a). Różnica między dwoma punktami to ciśnienie różnicowe: oblicza się ją z wartości o tym samym odniesieniu.", "hint": "Warto zwrócić uwagę na oznaczenie: (g) – ciśnienie względne, (a) – ciśnienie bezwzględne. Różnica między dwoma punktami nie ma własnego odniesienia: jest to po prostu różnica."}, {"title": "Obliczenie wysokości podnoszenia", "instr": "Jaką wysokość podnoszenia zapewnia pompa obiegowa, na podstawie zebranych wskazówek?", "options": ["≈ 10,2 m H₂O", "≈ 24,5 m H₂O", "≈ 38,8 m H₂O", "≈ 1,0 m H₂O"], "ok": "Δp = 2,4 − 1,4 = 1,0 bar = 100 kPa. Punkty pomiaru na tym samym poziomie, porównywalne średnice, woda: H ≈ Δp/(ρg) = 100 000/(1 000 × 9,81) ≈ 10,2 m H₂O.", "hint": "Wysokość podnoszenia wyznacza się z różnicy ciśnień między stroną tłoczną a ssawną przy pracującej pompie. Następnie różnicę tę należy przeliczyć na metry słupa wody: 1 bar ≈ 10,2 m H₂O."}, {"title": "Sprawdzenie ciśnienia w najwyższym punkcie", "instr": "Jakie ciśnienie względne teoretycznie pozostaje w najwyższym punkcie przy wyłączonej pompie? Proszę wskazać właściwą wartość na pionie.", "options": ["≈ 2,48 bar(g)", "≈ 1,5 bar(g)", "≈ 0,52 bar(g)", "≈ − 0,48 bar(g)"], "ok": "Ciśnienie maleje wraz ze wzrostem wysokości: 10 m słupa wody ≈ 1 000 × 9,81 × 10 = 98 100 Pa ≈ 0,98 bar. W najwyższym punkcie: 1,5 − 0,98 ≈ 0,52 bar(g). Wystarczające ciśnienie w najwyższym punkcie ogranicza przedostawanie się powietrza, miejscowe zapowietrzenie (utratę zalania) i ryzyko kawitacji.", "hint": "W słupie wody ciśnienie rośnie w kierunku w dół i maleje w kierunku w górę. Dla wody można przyjąć około 0,098 bar na metr różnicy wysokości."}, {"title": "Uzupełnienie karty serwisowej", "instr": "Należy sklasyfikować każde stwierdzenie: czy dotyczy ciśnienia statycznego instalacji, czy wysokości podnoszenia pompy?", "items": ["Utrzymanie wystarczającego ciśnienia w najwyższym punkcie", "Wyznaczana z różnicy tłoczenie − ssanie, podczas pracy", "Określane na podstawie wysokości statycznej, naczynia wzbiorczego i wymagań instalacji", "Pokonuje głównie straty ciśnienia w obiegu zamkniętym", "Mierzone przy wyłączonej pompie", "Zależy od przepływu i prędkości obrotowej"], "bins": [{"t": "Ciśnienie statyczne instalacji", "d": "Ciśnienie napełnienia instalacji"}, {"t": "Wysokość podnoszenia pompy", "d": "Energia dostarczana podczas pracy"}], "sol": [0, 1, 0, 1, 0, 1], "ok": "Dwie różne funkcje: ciśnienie statyczne (1,5 bar(g) przy wyłączonej pompie, ≈ 0,52 bar(g) w najwyższym punkcie) chroni najwyższy punkt; pompa podczas pracy zapewnia ≈ 10,2 m H₂O, aby pokonać straty ciśnienia.", "hint": "Warto zadać sobie pytanie, czy dana wielkość występuje przy wyłączonej pompie (ciśnienie statyczne), czy tylko podczas pracy, między stroną ssawną a tłoczną (wysokość podnoszenia)."}], "retain": ["Zawsze należy zapisywać odniesienie: bar(g), bar(a) lub Δp. Nigdy nie dodaje się wartości o różnych odniesieniach bez przeliczenia: pabs = prel + patm.", "Wysokość podnoszenia H ≈ Δp / (ρ × g), między stroną tłoczną a ssawną, przy pracującej pompie. Dla wody różnica 1 bar ≈ 10,2 m H₂O.", "Uwaga: nie należy mylić ciśnienia statycznego z wysokością podnoszenia. Ciśnienie statyczne chroni najwyższy punkt; pompa pokonuje przede wszystkim straty ciśnienia."]}, "nl": {"meta": {"code": "nl", "lang": "Nederlands"}, "ui": {"challenge": "Ga de uitdaging aan", "step": "Stap {n} / {t}", "language": "Taal", "chooseLang": "Kies uw taal", "start": "Starten", "continue": "Doorgaan", "validate": "Controleren", "retry": "Opnieuw", "finish": "Afronden", "correct": "Goed gezien!", "incorrect": "Niet helemaal...", "intro": "U hebt de belangrijkste begrippen van deze module leren kennen. Nu is het aan u om ze in de praktijk toe te passen!", "mission": "Uw opdracht", "situation": "De situatie", "clueCounter": "Bekeken aanwijzingen: {n} / {t}", "clueHidden": "Tik om te bekijken", "clueLock": "Bekijk alle aanwijzingen om door te gaan.", "selectFirst": "Selecteer een antwoord om te controleren.", "placeAll": "Plaats alle elementen om te controleren.", "tapThenPlace": "Tik op een element en daarna op de categorie waarin u het wilt plaatsen.", "toPlace": "Te plaatsen elementen", "selected": "Geselecteerd", "retain": "Onthoud", "doneTitle": "Uitdaging voltooid!", "doneText": "U hebt de praktijkopdracht afgerond.", "result": "Stappen in één keer goed: {s} / {t}", "next": "U kunt nu verdergaan met uw leertraject.", "schemaNote": "Vereenvoudigd principeschema, niet op schaal.", "module": "Module"}, "module": "HYD-02 · Drukken en opvoerhoogte", "title": "Een circulatiepomp in een gesloten systeem controleren", "missionText": "U werkt aan het gesloten, met water gevulde cv-systeem van een gebouw. De circulatiepomp draait. U moet de drukmetingen interpreteren, de door de pomp geleverde opvoerhoogte berekenen, de druk op het hoogste punt controleren en uw werkbon invullen zonder de statische systeemdruk en de opvoerhoogte met elkaar te verwarren.", "situation": {"instr": "Tik op elke markering in het schema of op elke aanwijzing in de lijst om de benodigde gegevens te /* ---------- Schémas (principe, non à l'échelle) ---------- */
function gauge(cx,cy,r,val,max,lbl){var a0=-225,a1=45,s='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+5)+'" fill="#C9CFDA"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#386FB6" stroke-width="3"/>';
  for(var k=0;k<=4;k++){var a=(a0+k/4*(a1-a0))*Math.PI/180;s+='<line x1="'+(cx+Math.cos(a)*(r-3)).toFixed(1)+'" y1="'+(cy+Math.sin(a)*(r-3)).toFixed(1)+'" x2="'+(cx+Math.cos(a)*(r-9)).toFixed(1)+'" y2="'+(cy+Math.sin(a)*(r-9)).toFixed(1)+'" stroke="#66778F" stroke-width="2"/>';}
  if(val!=null){var an=a0+val/max*(a1-a0);s+='<g transform="rotate('+an.toFixed(1)+' '+cx+' '+cy+')"><polygon points="'+cx+','+(cy-2.5)+' '+(cx+r-10)+','+cy+' '+cx+','+(cy+2.5)+'" fill="#F4951F"/></g>';}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#66778F"/>';if(lbl)s+='<text x="'+cx+'" y="'+(cy+r+22)+'" text-anchor="middle" class="sv" style="font-size:16px;fill:#386FB6">'+esc(lbl)+'</text>';return s;}
function arrowH(x,y,d,c){var p=d==="r"?[x,y,x-11,y-7,x-11,y+7]:d==="l"?[x,y,x+11,y-7,x+11,y+7]:d==="u"?[x,y,x-7,y+11,x+7,y+11]:[x,y,x-7,y-11,x+7,y-11];return '<polygon points="'+p.join(",")+'" fill="'+c+'"/>';}
function circuit(spots){var B=L.situation.lbl,s=['<svg viewBox="0 0 440 420" role="img" aria-label="'+esc(B.alt)+'">'];
  /* boucle fermée : retour descendant à gauche → aspiration ; refoulement → colonne montante à droite → point haut */
  s.push('<path d="M150 340 H60 V60 H380 V340 H290" fill="none" stroke="#386FB6" stroke-width="9" stroke-linejoin="round"/>');
  s.push(arrowH(60,200,"d","#fff")+arrowH(380,200,"u","#fff")+arrowH(220,60,"l","#fff"));
  /* circulateur */
  s.push('<line x1="150" y1="340" x2="195" y2="340" stroke="#386FB6" stroke-width="9"/><line x1="245" y1="340" x2="290" y2="340" stroke="#386FB6" stroke-width="9"/>');
  s.push('<circle cx="220" cy="340" r="26" fill="#fff" stroke="#386FB6" stroke-width="4"/><polygon points="208,326 208,354 236,340" fill="#386FB6"/>');
  s.push('<text x="220" y="398" text-anchor="middle" class="sv">'+esc(B.pump)+'</text>');
  /* prises + manomètres aspiration / refoulement au même niveau */
  s.push('<line x1="168" y1="336" x2="168" y2="292" stroke="#66778F" stroke-width="3"/><line x1="272" y1="336" x2="272" y2="292" stroke="#66778F" stroke-width="3"/>');
  s.push(gauge(168,268,22,1.4,4,"")+gauge(272,268,22,2.4,4,""));
  /* point haut, cote 10 m */
  s.push('<circle cx="380" cy="60" r="8" fill="#F4951F"/><text x="368" y="38" text-anchor="end" class="sv">'+esc(B.high)+'</text>');
  s.push('<path d="M412 64 V264" stroke="#66778F" stroke-width="2" stroke-dasharray="5 4"/>'+arrowH(412,62,"u","#66778F")+arrowH(412,266,"d","#66778F")+'<text x="404" y="170" text-anchor="end" class="sv" style="font-size:16px">'+esc(B.dz)+'</text>');
  s.push('<line x1="300" y1="268" x2="420" y2="268" stroke="#66778F" stroke-width="1.5" stroke-dasharray="3 4"/>');
  s.push('<text x="60" y="372" class="sv" style="font-size:15px" text-anchor="start">'+esc(B.low)+'</text>');
  if(!REDUCE)s.push('<circle r="5" fill="#fff"><animateMotion dur="7s" repeatCount="indefinite" path="M290 340 H380 V60 H60 V340 H150"/></circle><circle r="5" fill="#fff"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M290 340 H380 V60 H60 V340 H150"/></circle>');
  if(spots){var P=[[132,250],[308,250],[220,296],[60,130],[380,100],[100,340]];
    P.forEach(function(p,i){var sn=!!S.clues[i];s.push('<g class="spot'+(sn?' seen':'')+'" data-clue="'+i+'" tabindex="0" role="button" aria-label="'+(i+1)+' – '+esc(L.situation.clues[i].t)+'"><circle class="halo" cx="'+p[0]+'" cy="'+p[1]+'" r="21"/><circle class="c" cx="'+p[0]+'" cy="'+p[1]+'" r="16"/><text x="'+p[0]+'" y="'+(p[1]+6)+'" text-anchor="middle">'+(sn?"✓":(i+1))+'</text></g>');});}
  return s.join("")+'</svg>';}
function gaugesIll(){var C=L.situation.clues;return '<svg viewBox="0 0 400 200" role="img" aria-label="'+esc(C[0].v+" / "+C[1].v)+'">'+
  '<line x1="20" y1="170" x2="380" y2="170" stroke="#386FB6" stroke-width="9"/><circle cx="200" cy="170" r="22" fill="#fff" stroke="#386FB6" stroke-width="4"/><polygon points="190,158 190,182 214,170" fill="#386FB6"/>'+
  '<line x1="110" y1="166" x2="110" y2="124" stroke="#66778F" stroke-width="3"/><line x1="290" y1="166" x2="290" y2="124" stroke="#66778F" stroke-width="3"/>'+gauge(110,86,36,1.4,4,"")+gauge(290,86,36,2.4,4,"")+
  '<rect x="62" y="0" width="96" height="26" rx="8" fill="#fff" stroke="#386FB6" stroke-width="2"/><text x="110" y="19" text-anchor="middle" class="sv" style="font-size:15px;fill:#386FB6">'+esc(C[0].v)+'</text>'+
  '<rect x="242" y="0" width="96" height="26" rx="8" fill="#fff" stroke="#386FB6" stroke-width="2"/><text x="290" y="19" text-anchor="middle" class="sv" style="font-size:15px;fill:#386FB6">'+esc(C[1].v)+'</text>'+
  '<text x="200" y="110" text-anchor="middle" class="sv" style="font-size:22px;fill:#A85F06">Δp ?</text>'+arrowH(370,170,"r","#fff")+'</svg>';}
function columnIll(sel){var C=L.situation.clues,opts=L.steps[2].options;var s='<svg viewBox="0 0 400 300" role="img" aria-label="'+esc(C[4].t+" – "+C[5].v)+'">';
  s+='<rect x="70" y="30" width="34" height="240" rx="6" fill="#D5E2F4" stroke="#386FB6" stroke-width="3"/>';
  s+='<circle cx="87" cy="30" r="9" fill="#F4951F"/><text x="116" y="36" class="sv" style="font-size:16px">'+esc(L.situation.lbl.high)+' : ? bar(g)</text>';
  s+='<circle cx="87" cy="270" r="9" fill="#386FB6"/>';
  s+='<text x="116" y="278" class="sv" style="font-size:16px;fill:#386FB6">'+esc(L.situation.lbl.low)+' : 1,5 bar(g)</text>'.replace("1,5",L.meta.code==="en"?"1.5":"1,5");
  s+='<path d="M40 36 V262" stroke="#66778F" stroke-width="2" stroke-dasharray="5 4"/>'+arrowH(40,34,"u","#66778F")+arrowH(40,264,"d","#66778F")+'<text x="30" y="156" text-anchor="end" class="sv" style="font-size:15px">10 m</text>';
  s+='<path d="M150 110 v80" stroke="#F4951F" stroke-width="4"/>'+arrowH(150,106,"u","#F4951F")+'<text x="162" y="160" class="sv" style="font-size:15px;fill:#A85F06">≈ 0,098 bar / m</text>'.replace("0,098",L.meta.code==="en"?"0.098":"0,098");
  return s+'</svg>';}

/* ---------- Rendu ---------- */
function progress(){var n=S.scr+1,p=Math.round(S.scr/(NSCR-1)*100);$("pfill").style.width=p+"%";$("pbar").setAttribute("aria-valuenow",p);$("plbl").textContent=fmt(L.ui.step,{n:n,t:NSCR});
  $("crumb").innerHTML='<b>'+esc(L.ui.challenge)+'</b> | '+esc(L.title);$("langLbl").textContent=L.ui.language;document.title=L.ui.challenge+" – "+L.title;}
function feedback(i){var f=S.fb[i];if(!f)return "";var st=L.steps[i];
  return f==="ok"?'<div class="fb ok" role="status"><span class="ic" aria-hidden="true">✓</span><div class="bd"><h3>'+esc(L.ui.correct)+'</h3><p>'+esc(st.ok)+'</p><div class="actions"><button type="button" class="btn" id="bNext">'+esc(L.ui.continue)+'</button></div></div></div>'
   :'<div class="fb ko" role="alert"><span class="ic" aria-hidden="true">!</span><div class="bd"><h3>'+esc(L.ui.incorrect)+'</h3><p>'+esc(st.hint)+'</p><div class="actions"><button type="button" class="btn retry" id="bRetry">↻ '+esc(L.ui.retry)+'</button></div></div></div>';}
function stepHead(i){var st=L.steps[i];return '<div class="h-step"><span class="n">'+(i+1)+'</span><h2>'+esc(st.title)+'</h2></div><div class="instr">'+esc(st.instr)+'</div>';}
function render(){progress();var m=$("main"),h='<div class="screen">',U=L.ui;
  if(S.scr===0){h+='<section class="open-hero"><span class="sig">🎯 '+esc(U.challenge)+'</span><h1>'+esc(L.title)+'</h1><p class="mod">'+esc(U.module)+' : '+esc(L.module)+'</p></section>'+
    '<div class="langpick"><label for="lang2">🌐 '+esc(U.chooseLang)+'</label><select id="lang2"></select></div>'+
    '<section class="card"><p><b>'+esc(U.intro)+'</b></p><h2 style="font-size:1.1rem;margin-top:12px">'+esc(U.mission)+'</h2><p>'+esc(L.missionText)+'</p><div class="actions"><button type="button" class="btn" id="bStart">'+esc(U.start)+'</button></div></section>';}
  else if(S.scr===1){var n=Object.keys(S.clues).length,C=L.situation.clues;
    h+='<section class="card"><div class="h-step"><span class="n" aria-hidden="true">i</span><h2>'+esc(U.situation)+'</h2></div><div class="instr">'+esc(L.situation.instr)+'</div><div class="sit"><div><div class="fig">'+circuit(true)+'</div><p class="note">'+esc(U.schemaNote)+'</p></div><div><span class="counter'+(n>=C.length?" full":"")+'" aria-live="polite">'+esc(fmt(U.clueCounter,{n:n,t:C.length}))+'</span><ul class="clues">';
    C.forEach(function(c,i){var sn=!!S.clues[i];h+='<li><button type="button" class="clue'+(sn?" seen":"")+'" data-clue="'+i+'" aria-pressed="'+sn+'"><span class="num">'+(sn?"✓":(i+1))+'</span><span class="tx"><b>'+esc(c.t)+'</b>'+(sn?'<span>'+esc(c.v)+'</span>':'<span style="color:#66778F;font-weight:400">'+esc(U.clueHidden)+'</span>')+'</span></button></li>';});
    h+='</ul></div></div><div class="actions"><button type="button" class="btn" id="bCont"'+(n<C.length?' disabled':'')+'>'+esc(U.continue)+'</button></div>'+(n<C.length?'<p class="hint">🔒 '+esc(U.clueLock)+'</p>':'')+'</section>';}
  else if(S.scr>=2&&S.scr<=5){var i=S.scr-2;h+='<section class="card">'+stepHead(i);
    if(i===0||i===3)h+=sorterHtml(i);
    else h+=choiceHtml(i);
    h+='</section>';}
  else if(S.scr===6){h+='<section class="card retain"><h2>💡 '+esc(U.retain)+'</h2><ul class="rlist">'+L.retain.map(function(r,k){return '<li class="'+(k===2?"warn":"")+'"><span class="k" aria-hidden="true">'+(k===2?"!":(k+1))+'</span><span>'+esc(r)+'</span></li>';}).join("")+'</ul><div class="actions"><button type="button" class="btn" id="bFinish">'+esc(U.finish)+'</button></div></section>';}
  else{var s=S.first.filter(function(x){return x===true;}).length;h+='<section class="card final"><div class="trophy" aria-hidden="true">🏆</div><h2>'+esc(U.doneTitle)+'</h2><p><b>'+esc(U.doneText)+'</b></p><span class="res">'+esc(fmt(U.result,{s:s,t:4}))+'</span><p>'+esc(U.next)+'</p></section>';}
  m.innerHTML=h+'</div>';if($("lang2"))fillSelect($("lang2"));wire();}
function sorterHtml(i){var st=L.steps[i],P=S.place[i],U=L.ui,fbk=S.fb[i],sol=i===0?KEY.s1:st.sol,locked=!!fbk;
  var h='<div class="pool"><span class="lbl">'+esc(U.toPlace)+'</span>';
  st.items.forEach(function(t,k){if(P[k]==null)h+='<button type="button" class="item" data-item="'+k+'" aria-pressed="'+(S.armed===k)+'"'+(locked?' disabled':'')+'>'+esc(t)+'</button>';});
  h+='</div><p class="hint">'+esc(U.tapThenPlace)+'</p><div class="bins '+(st.bins.length===4?"b4":"b2")+'">';
  st.bins.forEach(function(b,j){h+='<button type="button" class="bin'+(S.armed!=null&&!locked?" armed":"")+'" data-bin="'+j+'"'+(locked?' disabled':'')+'><h3>'+esc(b.t)+'</h3><span class="d">'+esc(b.d)+'</span><span class="placed">';
    st.items.forEach(function(t,k){if(P[k]===j){var cls=fbk?(sol[k]===j?" ok":" ko"):"";h+='<span class="pl'+cls+'" data-back="'+k+'" role="button" tabindex="0">'+esc(t)+'</span>';}});h+='</span></button>';});
  var all=Object.keys(P).length===st.items.length;h+='</div>';
  if(!fbk)h+='<div class="actions"><button type="button" class="btn" id="bVal"'+(all?'':' disabled')+'>'+esc(U.validate)+'</button></div>'+(all?'':'<p class="hint">'+esc(U.placeAll)+'</p>');
  return h+feedback(i);}
function choiceHtml(i){var st=L.steps[i],U=L.ui,fbk=S.fb[i],key=i===1?KEY.s2:KEY.s3,h='<div class="choice"><div class="fig">'+(i===1?gaugesIll():columnIll())+'</div><div><div class="opts" role="group" aria-label="'+esc(st.title)+'">';
  st.options.forEach(function(o,k){var cls=fbk==="ok"&&k===key?" ok":(S.tried[i][k]?" ko":"");var pr=!fbk&&S.sel[i]===k;
    h+='<button type="button" class="opt'+cls+'" data-opt="'+k+'" aria-pressed="'+pr+'"'+(fbk||S.tried[i][k]?' disabled':'')+'><span class="mk" aria-hidden="true"></span>'+esc(o)+'</button>';});
  h+='</div>';if(!fbk)h+='<div class="actions"><button type="button" class="btn" id="bVal"'+(S.sel[i]==null?' disabled':'')+'>'+esc(U.validate)+'</button></div>'+(S.sel[i]==null?'<p class="hint">'+esc(U.selectFirst)+'</p>':'');
  return h+'</div></div>'+feedback(i);}

/* ---------- Interactions ---------- */
function go(n){S.scr=n;S.armed=null;render();var m=$("main");if(m){m.focus({preventScroll:true});try{window.scrollTo({top:0,behavior:REDUCE?"auto":"smooth"});}catch(e){window.scrollTo(0,0);}}SC.progress(n/(NSCR-1));}
function wire(){var b;
  if(b=$("bStart"))b.onclick=function(){go(1);};
  document.querySelectorAll("[data-clue]").forEach(function(el){var f=function(){var i=+el.getAttribute("data-clue");if(!S.clues[i]){S.clues[i]=1;var y=window.pageYOffset;render();window.scrollTo(0,y);}};el.addEventListener("click",f);
    if(el.tagName!=="BUTTON")el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}});});
  if(b=$("bCont"))b.onclick=function(){if(Object.keys(S.clues).length>=L.situation.clues.length)go(2);};
  var i=S.scr-2;
  document.querySelectorAll("[data-item]").forEach(function(el){el.onclick=function(){var k=+el.getAttribute("data-item");S.armed=S.armed===k?null:k;keep();};});
  document.querySelectorAll("[data-bin]").forEach(function(el){el.onclick=function(e){if(S.fb[i])return;if(S.armed==null)return;e.stopPropagation();S.place[i][S.armed]=+el.getAttribute("data-bin");S.armed=null;keep();};});
  document.querySelectorAll("[data-back]").forEach(function(el){var f=function(e){if(S.armed!=null)return;e.stopPropagation();if(S.fb[i])return;delete S.place[i][+el.getAttribute("data-back")];keep();};el.addEventListener("click",f);el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();f(e);}});});
  document.querySelectorAll("[data-opt]").forEach(function(el){el.onclick=function(){if(S.fb[i])return;S.sel[i]=+el.getAttribute("data-opt");keep();};});
  if(b=$("bVal"))b.onclick=function(){validate(i);};
  if(b=$("bRetry"))b.onclick=function(){retry(i);};
  if(b=$("bNext"))b.onclick=function(){go(S.scr+1);};
  if(b=$("bFinish"))b.onclick=function(){var s=S.first.filter(function(x){return x===true;}).length;SC.complete(Math.round(s/4*100));go(7);};}
function keep(){var y=window.pageYOffset;render();window.scrollTo(0,y);}
function validate(i){var ok;S.tries[i]++;
  if(i===0||i===3){var sol=i===0?KEY.s1:L.steps[3].sol,P=S.place[i];ok=L.steps[i].items.every(function(_,k){return P[k]===sol[k];});}
  else{var key=i===1?KEY.s2:KEY.s3;if(S.sel[i]==null)return;ok=S.sel[i]===key;if(!ok)S.tried[i][S.sel[i]]=1;}
  if(S.first[i]===null)S.first[i]=ok;S.fb[i]=ok?"ok":"ko";keep();var f=$(ok?"bNext":"bRetry");if(f)f.focus({preventScroll:false});}
function retry(i){S.fb[i]=null;if(i===0||i===3){var sol=i===0?KEY.s1:L.steps[3].sol,P=S.place[i];Object.keys(P).forEach(function(k){if(P[k]!==sol[k])delete P[k];});}else S.sel[i]=null;keep();
  var t=document.querySelector(".item,.opt:not(:disabled)");if(t)t.focus();}

/* ---------- Démarrage ---------- */
(function(){var saved=null;try{saved=sessionStorage.getItem("syclef-defi-lang");}catch(e){}S.lang=saved&&I18N[saved]?saved:detect();L=I18N[S.lang];document.documentElement.lang=S.lang;
  fillSelect($("lang"));SC.init();render();window.addEventListener("pagehide",function(){SC.finish();});})();
</script>
</body>
