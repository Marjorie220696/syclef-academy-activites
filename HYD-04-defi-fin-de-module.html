<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HYD-04 | Pertes de charge et réseaux – Relevez le défi de fin de module</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
:root{--k:1;--fs:calc(var(--k) * clamp(14px, 0.55vw + 0.85vh + 3px, 19px));--cyan:#55C2FB;--orange:#FA9035;--ok:#5EE0A0;--ko:#FF9A8C;--line:rgba(170,210,255,.30);--muted:#CFDDF2}
body{font-family:Calibri,Arial,sans-serif;color:#F4F8FF;background:#0b2350;font-size:var(--fs);line-height:1.3;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 80% 55% at 50% -8%,rgba(103,164,225,.55),transparent 60%),radial-gradient(ellipse 60% 50% at 88% 110%,rgba(85,194,251,.16),transparent 60%),linear-gradient(180deg,#1d5296 0%,#164382 35%,#0f3268 70%,#0a234c 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.defs{position:absolute;width:0;height:0;overflow:hidden}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #FFD27A;outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:middle}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,28px)}
.mod{margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.tbtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:.45em;padding:0 .9em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-weight:700;font-size:.9em}
.tbtn:hover{background:rgba(255,255,255,.15)}
.langbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:0 0 0 12px;min-height:44px}
.langbox label{font-weight:700;font-size:.9em}
select{font:inherit;color:#fff;background:#12396f;border:1px solid var(--line);border-radius:9px;min-height:44px;padding:0 6px;max-width:100%}

/* Progression */
.prog{display:flex;align-items:center;gap:clamp(8px,2vw,22px);padding:0 clamp(10px,2vw,28px) clamp(6px,1.1vh,12px)}
.prog[hidden],.nav[hidden]{display:none}
.ptxt{margin:0;font-weight:700;white-space:nowrap;font-size:.95em}
.dots{display:flex;list-style:none;margin:0;padding:0;flex:1;align-items:center;min-width:0}
.dots li{flex:1;display:flex;align-items:center;min-width:0}
.dots li:last-child{flex:0 0 auto}
.dot{width:clamp(20px,2.3vw,28px);height:clamp(20px,2.3vw,28px);border-radius:50%;display:grid;place-items:center;font-size:.72em;font-weight:700;border:2px solid rgba(207,221,242,.45);color:rgba(235,243,255,.75);background:rgba(255,255,255,.05);flex:none;transition:transform .25s}
.dot svg{width:70%;height:70%}
.dot.done{background:var(--cyan);border-color:var(--cyan);color:#0b2350}
.dot.cur{border-color:var(--orange);color:#fff;background:rgba(250,144,53,.28);transform:scale(1.2);box-shadow:0 0 0 4px rgba(250,144,53,.22)}
.seg{flex:1;height:3px;margin:0 4px;border-radius:2px;background:rgba(207,221,242,.22)}
.seg.done{background:var(--cyan)}

/* Zone principale */
main{min-height:0;overflow:hidden;padding:0 clamp(10px,2vw,28px);display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
main>*{min-height:0;min-width:0}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(0,12,45,.35),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fit{overflow:hidden}
.btn{min-height:44px;min-width:44px;padding:.45em 1.1em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.09);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1.1}
.btn:hover:not(:disabled){background:rgba(255,255,255,.17)}
.btn.pri{background:linear-gradient(180deg,#FFB06A,#FA9035);color:#0b1f3f;border-color:#FFC896;box-shadow:0 6px 18px rgba(250,144,53,.35)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#FFC08A,#FF9C45)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.big{font-size:1.2em;padding:.6em 2.1em}
h1,h2,h3{margin:0;line-height:1.15}

/* Introduction */
.intro{display:grid;place-items:center;min-height:0;padding-bottom:clamp(6px,1.4vh,16px)}
.icard{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1.5vh,16px);padding:clamp(12px,2.2vw,30px)}
.icard img{width:100%;height:auto;max-height:30vh;object-fit:cover;border-radius:14px;min-height:0;flex:0 1 auto;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.intro.c1 .icard img{max-height:16vh}
.intro.c2 .icard img{display:none}
h1{font-size:2.15em}
.lead{margin:0;font-size:1.15em;font-weight:700}
.case{margin:0;color:var(--muted);max-width:52em}
.meta{margin:0;font-size:.85em;border:1px solid var(--line);border-radius:999px;padding:.25em .9em;color:#E6F0FF}

/* Étape */
.step{display:grid;gap:clamp(8px,1.4vw,18px);grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-bottom:2px}
.visual{order:-1;display:flex;flex-direction:column;padding:clamp(6px,1vw,14px);min-height:0;min-width:0}
.qpanel{display:flex;flex-direction:column;gap:.5em;padding:clamp(10px,1.4vw,22px);min-height:0;min-width:0}
.stagewrap{flex:1;min-height:0;min-width:0;container-type:size;display:grid;place-items:center}
.stage{position:relative;width:min(100cqw,calc(100cqh * 5 / 3));height:min(100cqh,calc(100cqw * 3 / 5))}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.qhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.badge{background:var(--orange);color:#0b1f3f;font-weight:700;border-radius:999px;padding:.12em .7em;font-size:.8em;white-space:nowrap}
h2{font-size:1.3em}
.sit{margin:0;color:var(--muted)}
.sit .lab{display:inline-block;font-weight:700;color:#fff;font-size:.74em;text-transform:uppercase;letter-spacing:.06em;margin-inline-end:.5em;border:1px solid var(--line);border-radius:6px;padding:0 .4em;vertical-align:1px}
.q{margin:0;font-weight:700;font-size:1.08em;color:#fff}
.hint{margin:0;font-size:.86em;color:var(--muted)}
.inter{display:flex;flex-direction:column;gap:.42em}
.qpanel>*{flex-shrink:0}
.qpanel{container-type:inline-size}
@container (min-width:440px){.inter .arow{flex-direction:row;align-items:center;gap:.6em}.inter .arow label{flex:0 0 36%}.inter .arow select{flex:1;min-width:0}}
.step.c1 .hint{display:none}
.step.c3.answered .sit{display:none}
.opts{display:flex;flex-direction:column;gap:.42em}
.opt{display:flex;align-items:center;gap:.7em;text-align:start;width:100%;min-height:44px;padding:.42em .8em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);line-height:1.2}
.opt:hover:not(:disabled){background:rgba(255,255,255,.13)}
.opt .rad{flex:none;width:1.15em;height:1.15em;border-radius:50%;border:2px solid #D7E8F8;display:grid;place-items:center}
.opt[aria-pressed="true"]{border:2px solid var(--cyan);background:rgba(85,194,251,.17)}
.opt[aria-pressed="true"] .rad::after{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--cyan)}
.opt .otx{flex:1}
.opt .mk{flex:none;display:flex}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:1.15em;font-weight:700;min-height:54px}
.tf .opt .otx{flex:0 1 auto}
.is-ok{border-color:var(--ok)!important;border-width:2px!important;background:rgba(94,224,160,.15)!important}
.is-ko{border-color:var(--ko)!important;border-width:2px!important;background:rgba(255,154,140,.14)!important}

/* Association */
.arow{display:flex;flex-direction:column;gap:.2em}
.arow label{font-weight:700;display:flex;align-items:center;gap:.4em}
.arow select{width:100%;min-height:44px;font-size:.92em}
.sheet{height:100%;display:flex;flex-direction:column;gap:.6em;justify-content:center;padding:.4em .6em}
.sh-t{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.85em;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:.35em}
.srow{display:grid;grid-template-columns:auto minmax(0,.8fr) minmax(0,1.4fr);align-items:center;gap:.7em;padding:.5em .6em;border:1px dashed rgba(207,221,242,.4);border-radius:12px;background:rgba(6,24,56,.35)}
.srow.filled{border-style:solid;border-color:rgba(85,194,251,.65)}
.sic svg{width:clamp(28px,3.4vw,46px);height:auto;display:block}
.sn{font-weight:700}
.sv{color:var(--muted);font-size:.9em}
.srow.filled .sv{color:#fff}

/* Saisie numérique */
.numl{font-weight:700}
.numrow{display:flex;align-items:center;gap:.6em}
.numrow input{font:inherit;font-size:1.25em;width:7em;min-height:48px;border-radius:10px;border:2px solid var(--line);background:rgba(4,20,48,.6);color:#fff;padding:0 .5em}
.numrow input::placeholder{color:#9FB4D3}
.unit{font-weight:700;font-size:1.1em}

/* Classement */
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.32em}
.ord li{display:flex;align-items:center;gap:.5em;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);padding:.12em .25em .12em .6em;min-height:44px}
.pos{font-weight:700;color:var(--muted);width:1.2em;flex:none}
.let{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--orange);color:#0b1f3f;font-weight:700;display:grid;place-items:center;font-size:.85em}
.ord .otx{flex:1;line-height:1.15}
.mv{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.09);display:grid;place-items:center}
.mv:hover:not(:disabled){background:rgba(255,255,255,.18)}
.mv:disabled{opacity:.3}
.ord .mk{display:flex;padding:0 .4em}

/* Étiquettes et zones */
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{min-height:44px;padding:.3em .95em;border-radius:999px;border:2px dashed rgba(207,221,242,.65);background:rgba(10,35,76,.65);font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none}
.chip:hover:not(:disabled){background:rgba(30,70,130,.8)}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--orange);background:rgba(250,144,53,.25)}
.chip .where{font-weight:400;color:var(--muted);font-size:.85em}
.chip.dragging{opacity:.4}
.chip:disabled{cursor:default;opacity:.75}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);padding:.3em .9em;border-radius:999px;border:2px solid var(--orange);background:#16437f;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.zbtn,.hs,.dz{position:absolute;border-radius:14px;display:flex;flex-direction:column;align-items:center;min-width:44px;min-height:44px}
.zbtn{border:2px dashed rgba(207,221,242,.5);background:transparent;justify-content:flex-start;padding-top:.4em}
.zbtn:hover:not(:disabled),.hs:hover:not(:disabled){background:rgba(85,194,251,.1)}
.zbtn[aria-pressed="true"],.hs[aria-pressed="true"]{border:3px solid var(--cyan);background:rgba(85,194,251,.13)}
.hs{border:2px dashed rgba(207,221,242,.6);background:transparent;justify-content:flex-end;padding:.15em}
.ztag{background:rgba(8,26,56,.9);border:1px solid var(--line);border-radius:999px;padding:.15em .75em;font-weight:700;font-size:.92em;display:inline-flex;gap:.35em;align-items:center;line-height:1.15;text-align:center}
.hs .ztag{font-size:.86em;padding:.12em .55em}
.selm{font-weight:400;color:var(--cyan)}
.zbtn:disabled,.hs:disabled,.dz:disabled{cursor:default}
.dz{border:2px dashed rgba(250,144,53,.8);background:rgba(8,26,56,.78);justify-content:center;text-align:center;padding:.15em .3em;font-size:.92em;line-height:1.1}
.dz .zn{font-size:.78em;color:var(--muted);font-weight:700;text-transform:uppercase;display:inline-flex;gap:.3em;align-items:center}
.dz .zv{font-weight:700}
.dz.filled{border-style:solid;border-color:var(--cyan)}
.dz.hover{background:rgba(250,144,53,.3)}

/* Retour pédagogique */
.fb{border-radius:14px;padding:.55em .85em;border:1px solid;display:flex;flex-direction:column;gap:.28em}
.fb.ok{border-color:rgba(94,224,160,.65);background:rgba(16,80,58,.5)}
.fb.ko{border-color:rgba(255,154,140,.65);background:rgba(96,30,42,.5)}
.fb-t{margin:0;font-weight:700;display:flex;align-items:center;gap:.4em;font-size:1.05em}
.fb-x,.fb-k{margin:0;font-size:.95em}
.fb-k .tag{display:inline-block;font-size:.74em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(85,194,251,.22);border:1px solid rgba(85,194,251,.55);border-radius:6px;padding:0 .4em;margin-inline-end:.45em;vertical-align:1px}

/* Résultat */
.result{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(8px,1.4vw,18px);padding-bottom:2px}
.rcard{padding:clamp(12px,1.6vw,24px);display:flex;flex-direction:column;gap:.6em;min-height:0}
.rs-top{display:flex;align-items:center;gap:1.2em;flex-wrap:wrap}
.ring{width:clamp(90px,20vh,170px);height:auto;flex:none}
.rnum{fill:#fff;font:700 28px Calibri,Arial,sans-serif}
.kpis{display:flex;flex-direction:column;gap:.5em}
.kpi{margin:0;display:flex;flex-direction:column}
.kpi span{color:var(--muted);font-size:.85em}
.kpi strong{font-size:1.6em;line-height:1.1}
.lvl{margin:0;font-weight:700;font-size:1.25em;display:flex;align-items:center;gap:.45em}
.lvl3{color:#A8F5CF}.lvl2{color:#FFD9A8}.lvl1{color:#FFC2B8}
.lmsg{margin:0;color:var(--muted)}
h3{font-size:.95em;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
.rsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.35em}
.rsteps li{display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.3em .1em;border-radius:10px;border:1px solid var(--line);font-size:.85em;font-weight:700}
.rsteps li.ok{border-color:rgba(94,224,160,.55)}
.rsteps li.ko{border-color:rgba(255,154,140,.55)}
.notions{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em}
.notions li{display:flex;gap:.55em;align-items:center}
.nn{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--ko);display:grid;place-items:center;font-size:.8em;font-weight:700}
.none{margin:0;color:var(--muted)}
.rbtns{margin-top:auto;display:flex;flex-wrap:wrap;gap:.6em;padding-top:.3em}

/* Revoir mes réponses */
.review{display:flex;flex-direction:column;gap:.55em;padding-bottom:2px}
.rgrid{display:grid;gap:.55em;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.pp9 .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.pp6 .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pp3 .rgrid{grid-template-columns:minmax(0,1fr)}
.rv{padding:.5em .75em;display:flex;flex-direction:column;gap:.22em;min-height:0;overflow:hidden;font-size:.86em}
.rv p{margin:0}
.rv.ok{border-color:rgba(94,224,160,.5)}
.rv.ko{border-color:rgba(255,154,140,.5)}
.rvh{display:flex;align-items:center;justify-content:space-between;gap:.4em}
.rv .st{display:inline-flex;align-items:center;gap:.3em;font-weight:700}
.rv h3{font-size:1em;text-transform:none;letter-spacing:0;color:#fff}
.lab2{font-weight:700;color:var(--cyan)}

/* Navigation */
.nav{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,28px);padding-bottom:max(clamp(6px,1.2vh,14px),env(safe-area-inset-bottom))}
.nav .sp{flex:1;margin:0;font-size:.82em;color:var(--muted);text-align:center}

/* SVG */
.zonebg{fill:rgba(255,255,255,.035);stroke:rgba(207,221,242,.25);stroke-dasharray:5 6}
.pipe{fill:none;stroke:#4A3020;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.pipe-in{fill:none;stroke:#C0835A;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#8FE3FF;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:7 13;animation:flow 3.4s linear infinite;filter:url(#glow)}
.flow.fast{animation-duration:2.4s}
.flow.slow{stroke:#7EE8D2;stroke-width:7;stroke-dasharray:12 8;animation-duration:9s}
.flow.weak{stroke-dasharray:3 17;animation-duration:6s}
.flow.big{stroke-width:5}
.flow.still{animation:pulse 5s ease-in-out infinite;stroke-dasharray:none;opacity:.55;stroke-width:3}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{50%{opacity:.95}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drop{animation:drop 2.4s linear infinite;opacity:0}
.drop.d2{animation-delay:-.8s}.drop.d3{animation-delay:-1.6s}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
.lbl{fill:#EEF5FF;font:700 19px Calibri,Arial,sans-serif;paint-order:stroke;stroke:#0a2148;stroke-width:5px;stroke-linejoin:round}
.tagt{fill:#fff;font:700 18px Calibri,Arial,sans-serif}
.lett{fill:#0b1f3f;font:700 21px Calibri,Arial,sans-serif}

@media (min-aspect-ratio:1/1) and (min-width:561px){.step.c2.answered .sit{display:none}}
/* Écrans portrait / étroits : visuel au-dessus de la question */
@media (max-aspect-ratio:1/1),(max-width:560px){
  .step{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,34%) minmax(0,1fr)}
  .step.c1{grid-template-rows:minmax(0,25%) minmax(0,1fr)}
  .step.c2.answered,.step.c3.answered{grid-template-rows:minmax(0,1fr)}
  .step.c2.answered .visual,.step.c3.answered .visual{display:none}
  .result{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ring{width:clamp(80px,14vh,130px)}
  .rsteps{grid-template-columns:repeat(9,minmax(0,1fr))}
}
@media (max-width:560px){
  .mod{display:none}
  .top{justify-content:flex-end}
  .nav .btxt,.tbtn .btxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav .sp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nav{justify-content:space-between}
  .ptxt{font-size:.85em}
  .rsteps li{font-size:.75em}
  .rsteps li .ic{width:1em;height:1em}
  h1{font-size:1.7em}
}
@media (max-height:500px){
  .top{padding-top:4px;padding-bottom:4px}
  .prog{padding-bottom:4px}
  .nav{padding-top:4px;padding-bottom:4px}
  .icard img{max-height:22vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

/* ===== Compléments HYD-02 ===== */
.hero{width:100%;height:auto;max-height:30vh;border-radius:14px;min-height:0;flex:0 1 auto;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.intro.c1 .hero{max-height:16vh}
.intro.c2 .hero{display:none}
.fx{white-space:nowrap;font-family:Calibri,Arial,sans-serif;font-weight:700;color:#FFE3B8}
.fx sub{font-size:.72em;line-height:0}
.opt.sm{min-height:44px;padding:.35em .7em;width:auto;flex:1 1 auto}
.segs{display:flex;flex-wrap:wrap;gap:.4em}
.grp{display:flex;flex-direction:column;gap:.3em;padding:.45em .6em;border:1px solid var(--line);border-radius:12px;background:rgba(6,24,56,.3)}
.glab{margin:0;font-weight:700}
.gsel{margin:0;color:var(--cyan);font-weight:700}
.fxcard{border:1px solid rgba(85,194,251,.5);border-radius:14px;background:rgba(6,24,56,.45);padding:.6em .9em;display:flex;flex-direction:column;gap:.25em}
.fxl{margin:0;font-size:.78em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.fxm{margin:0;font-size:1.35em}
.fxd{margin:0;color:#fff;font-weight:700}
.checks{display:grid;grid-template-columns:1fr;gap:.35em}
@container (min-width:520px){.checks{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:.6em;text-align:start;min-height:44px;padding:.35em .65em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);line-height:1.15;font-size:.95em}
.chk:hover:not([aria-disabled="true"]){background:rgba(255,255,255,.13)}
.chk .box{flex:none;width:1.15em;height:1.15em;border-radius:4px;border:2px solid #D7E8F8;display:grid;place-items:center}
.chk[aria-checked="true"]{border:2px solid var(--cyan);background:rgba(85,194,251,.17)}
.chk[aria-checked="true"] .box{background:var(--cyan);border-color:var(--cyan)}
.chk[aria-checked="true"] .box::after{content:"";width:.32em;height:.6em;border:solid #0b2350;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .otx{flex:1}.chk .mk{flex:none;display:flex}
.chk[aria-disabled="true"]{cursor:default}
.is-miss{border:2px dashed var(--ok)!important}
.vbtn{position:absolute;display:flex;align-items:center;justify-content:center;gap:.35em;min-width:44px;min-height:44px;border-radius:12px;border:2px solid rgba(207,221,242,.6);background:rgba(8,26,56,.85);font-weight:700;font-size:1em;padding:0 .4em}
.vbtn:hover:not(:disabled){background:rgba(30,70,130,.9)}
.vbtn[aria-pressed="true"]{border:3px solid var(--cyan);background:rgba(85,194,251,.25)}
.vbtn:disabled{cursor:default}
.hs.gauge{justify-content:flex-start;padding-top:.2em}
.dz .zn{text-transform:none;font-size:.82em;line-height:1.1}
/* SVG HYD-02 */
.lbl.sym{font-size:22px}
.lbl.small{font-size:15px;fill:#CFDDF2}
.sbs{font-size:70%}
.fxbox{fill:rgba(6,24,56,.75);stroke:#55C2FB;stroke-width:1.5}
.fxs{fill:#FFE3B8;font:700 21px Calibri,Arial,sans-serif}
.sbox{fill:rgba(6,24,56,.6);stroke:rgba(170,210,255,.45);stroke-width:1.5}
.sbox.empty{stroke-dasharray:6 5;stroke:#FA9035}
.big1{fill:#fff;font:700 24px Calibri,Arial,sans-serif}
.gnum{fill:#0B2350;font:700 15px Calibri,Arial,sans-serif}
.gunit{fill:#36506F;font:700 14px Calibri,Arial,sans-serif}
.lcd{fill:#8FE3FF;font:700 20px Calibri,Arial,sans-serif}
.tagr{fill:rgba(8,26,56,.9);stroke:#55C2FB;stroke-width:1.5}
.tagr.big{stroke:#FA9035;stroke-width:2.5}
.tagr.q{stroke:#FA9035;stroke-dasharray:5 4}
.flow.up{animation-duration:4.5s}
.flow.slow2{animation-duration:6s}
.bub{animation:bub 3s ease-in-out infinite}
@keyframes bub{50%{transform:translateY(-6px)}}
.fill{transition:y .5s ease,height .5s ease}
.rsteps.n8{grid-template-columns:repeat(8,minmax(0,1fr))}
.pp8 .rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.pp4 .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pp2 .rgrid{grid-template-columns:minmax(0,1fr)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
/* ===== Compléments HYD-03 ===== */
.sy{white-space:nowrap}
.sy sub{font-size:.72em;line-height:0}
.dz .zv{font-size:1.15em}
/* ===== Compléments HYD-04 ===== */
.lbl.small2{font-size:17px;fill:#EEF5FF}
.lbl.val{fill:#FFE3B8}
.pline{fill:none;stroke:#FFD27A;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.curve{fill:none;stroke:#55C2FB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.curve.dash{stroke-dasharray:6 7;opacity:.8}
.colr{fill:url(#gSteel);stroke:#5E7290;stroke-width:1.5}
.hl{fill:none;stroke-width:24;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.hlA{stroke:#55C2FB}
.hlB{stroke:#FFA24D;animation:hlp 2.4s ease-in-out infinite}
@keyframes hlp{50%{opacity:.45}}
.heat{animation:heat 2.6s ease-in-out infinite}
@keyframes heat{50%{transform:translateY(-4px);opacity:.55}}
.turb,.turb.d2,.turb.d3{animation:spin 2.8s linear infinite;transform-box:fill-box;transform-origin:center}
.turb.d2{animation-duration:2.1s}.turb.d3{animation-duration:3.4s}
/* Dernier palier d'ajustement : le visuel décoratif s'efface si l'interaction n'en dépend pas (évite un texte trop petit) */
.step.c3:not(.needvis){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.step.c3:not(.needvis) .visual{display:none}
/* Panneau large (paysage, grand écran) : lignes compactes */
.arows{display:flex;flex-direction:column;gap:.42em}
.step.c2 .inter .arow{flex-direction:row;align-items:center;gap:.6em}.step.c2 .inter .arow label{flex:0 0 38%}.step.c2 .inter .arow select{flex:1;min-width:0}
@container (min-width:700px){
 .arows{display:grid;grid-template-columns:1fr 1fr;gap:.42em 1em}
 .grp{flex-direction:row;align-items:center;gap:.8em}.grp .glab{flex:0 0 34%}.grp .segs{flex:1}
 .checks{grid-template-columns:1fr 1fr 1fr}
 .opts{display:grid;grid-template-columns:1fr 1fr}
}
/* Paysage de faible hauteur (téléphone couché) : progression et outils sur une seule ligne */
@media (max-height:500px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto}
  .prog{grid-column:1;grid-row:1;padding-top:4px;padding-bottom:4px}
  .top{grid-column:2;grid-row:1}
  .top .mod{display:none}
  main,.nav{grid-column:1/-1}
}
/* Paliers compacts : mise en grille dès que le panneau le permet */
@container (min-width:560px){
 .step.c2 .arows{display:grid;grid-template-columns:1fr 1fr;gap:.42em 1em}
 .step.c2 .grp{flex-direction:row;align-items:center;gap:.8em}.step.c2 .grp .glab{flex:0 0 34%}.step.c2 .grp .segs{flex:1}
 .step.c2 .opts{display:grid;grid-template-columns:1fr 1fr}
}
.step.c3 .checks{grid-template-columns:1fr 1fr}
.step.c3.answered .q{display:none}
.step.c3 .grp{padding:.2em .5em}.step.c3 .inter,.step.c3 .arows,.step.c3 .checks,.step.c3 .opts{gap:.28em}.step.c3 .qpanel{gap:.35em}
@container (min-width:560px){.step.c2 .checks,.step.c3 .checks{grid-template-columns:1fr 1fr 1fr}}
.dz .zn{font-size:1em;color:#fff}.dz .zv{font-size:1.05em;color:var(--cyan)}.dz.filled .zv{color:#fff}

   q: "Quelle perte de charge le réseau présentera-t-il environ à 10 m³/h ?",
   svg: { x: "Débit" },
   ok: "Avec {F6}, le débit double, donc la perte est multipliée par 2² = 4 : 25 × 4 = 100 kPa. Repères : débit × 0,5 → Δp × 0,25 ; × 1,2 → × 1,44 ; × 1,5 → × 2,25 ; × 2 → × 4.",
   ko: "En régime principalement turbulent et à configuration fixe, la perte ne suit pas le débit proportionnellement : {F6}. Débit × 2 donne Δp × 4, soit 25 × 4 = 100 kPa. Repères : × 0,5 → × 0,25 ; × 1,2 → × 1,44 ; × 1,5 → × 2,25.",
   key: "K change si une vanne se déplace, si un filtre s'encrasse ou si des branches s'ouvrent ou se ferment : le réseau n'a pas une courbe unique dans toutes les situations.",
   notion: "Courbe du réseau",
   alt: "Graphique Δp en kPa en fonction du débit q en m³/h : courbe du réseau Δp = K × q² passant par le point connu 25 kPa à 5 m³/h. Une ligne verticale repère 10 m³/h, soit le débit multiplié par 2 ; la perte correspondante est inconnue. Après validation, la courbe complète atteint 100 kPa." },
 { title: "Diagnostic final : circuit défavorisé",

   groups: [{ label: "1. Perte du parcours tronc commun + branche A" }, { label: "2. Circuit défavorisé", opts: ["Branche A : 57 kPa", "Branche B : 66 kPa", "Branches A + B : 123 kPa"] }, { label: "3. Hauteur équivalente en eau : 66 000 / (1 000 × 9,81)" }],
   svg: { pump: "Pompe", trunk: "Tronc commun", ar: "aller + retour", a: "Branche A", b: "Branche B", pipe: "Tuyauterie", coil: "Batterie", valve: "Vanne", col: "Collecteurs" },

  introMeta: "8 steps · 1 decision or 1 calculation per step · one common case study",

  }, steps: [
 { title: "Linear or local?",
   sit: "Before estimating the pressure losses of the section supplying a coil, you identify six elements on the diagram.",
   q: "Classify each identified element by the type of loss it causes.",
   items: ["1 · Straight pipe", "2 · Flexible hose", "3 · Elbow", "4 · Tee", "5 · Valve", "6 · Filter"],
   choices: ["Linear loss (distributed)", "Local loss (concentrated)"],
   svg: { hx: "Exchanger", flow: "Flow direction" },
   ok: "The straight pipe and the flexible hose cause a linear loss: the fluid rubs against the walls along their whole length. The elbow, tee, valve and filter, like the exchanger, cause a local loss: the geometry or component creates local turbulence. In both cases, the dissipated energy is converted into heat.",
   ko: "Ask yourself where the dissipation occurs. Distributed along a pipe (straight pipe, flexible hose): it is friction, so a linear loss. Concentrated at a change of direction, a change of cross-section or a component (elbow, tee, valve, filter, exchanger): it is turbulence, so a local loss.",
   key: "A pressure loss is the dissipation of the fluid's mechanical energy as heat; it appears as a drop in total pressure in the direction of flow.",
   notion: "Origin and types of losses",
   alt: "Section of a loop network. Marker 1: straight pipe; marker 2: corrugated flexible hose; marker 3: elbow; marker 4: tee with branch; marker 5: valve; marker 6: filter. An unnumbered plate heat exchanger is fitted on the return. An arrow shows the flow direction." },
 { title: "Influencing factors",
   sit: "On this network, the total pressure drops more than at commissioning. You list the parameters to examine.",
   q: "Select all the factors that influence pressure losses.",
   items: ["Fluid flow rate and velocity", "Pipe length and inner diameter", "Wall roughness and fouling", "Fluid density and viscosity", "Number and geometry of fittings", "Valve positions, filter and exchanger condition", "Static fill pressure of the circuit", "Useful volume of the circuit's expansion vessel"],
   svg: { p: "Total pressure", x: "Flow direction", heat: "Energy dissipated as heat" },
   ok: "All six factors act on friction or turbulence: flow rate and velocity, length and inner diameter, roughness and fouling, fluid properties, fittings, valves, filters and exchangers. The static fill pressure and the expansion vessel are not among them.",
   ko: "The static fill pressure only ensures sufficient pressure at every point of the closed circuit, and the expansion vessel does not resist the flow. Losses vary with flow rate and velocity, length and inner diameter, roughness and fouling, ρ and viscosity, fittings, valves, filters and exchangers.",
   key: "In operation, the pump supplies the pressure difference needed to overcome the losses of the circuit the water flows through.",
   notion: "Influencing factors",
   alt: "Pipe fitted with a valve and a filter, with heat waves along the pipe. Below, a graph of total pressure along the flow direction: the curve falls steadily along the pipe and drops more sharply at the valve and the filter." },
 { title: "Calculate a linear loss",
   sit: "A straight water pipe supplies the coil: L = 40 m, D = 0.050 m, v = 1 m/s, λ = 0.025 and ρ = 1 000 kg/m³.",
   q: "Apply {F1} in three steps.",
   groups: [{ label: "1. Ratio L/D" }, { label: "2. Dynamic pressure ρv²/2" }, { label: "3. Linear loss {dpl}" }],
   svg: { pipe: "Straight pipe · water" },
   ok: "L/D = 40 / 0.050 = 800; ρv²/2 = 1 000 × 1² / 2 = 500 Pa; {dpl} = 0.025 × 800 × 500 = 10 000 Pa = 10 kPa, i.e. about 1.02 mCE with water.",
   ko: "Check each link: L/D = 40 / 0.050 = 800, dimensionless; the dynamic pressure ρv²/2 = 1 000 × 1² / 2 = 500 Pa, without forgetting to divide by 2; finally 0.025 × 800 × 500 = 10 000 Pa = 10 kPa.",
   key: "λ depends on the flow regime, the Reynolds number and the relative roughness: it comes from a chart, software or design data. Always use the actual inner diameter.",
   notion: "Linear losses (Darcy-Weisbach)",
   alt: "Straight water pipe of length L = 40 m and inner diameter D = 0.050 m, with v = 1 m/s, λ = 0.025 and ρ = 1 000 kg/m³. Calculation chain: L/D, then ρv²/2, then Δpₗ = λ × (L/D) × (ρv²/2). The selected values appear as you answer." },
 { title: "Unit pressure loss",
   sit: "The design office gives a unit linear loss R = 180 Pa/m for a 50 m straight pipe.",
   q: "On the diagram, select the linear loss of this pipe.",
   svg: { pipe: "Straight pipe" },
   ok: "{F3}: 180 Pa/m × 50 m = 9 000 Pa, i.e. 9 kPa. This direct reading in Pa/m is widely used by design offices.",
   ko: "The unit loss is expressed per metre: multiply it by the length; do not divide it or add it. {F3}: 180 × 50 = 9 000 Pa = 9 kPa.",
   key: "Same logic for any pipe: with R = 250 Pa/m over 40 m, Δp = 250 × 40 = 10 000 Pa.",
   notion: "Unit loss R × L",
   alt: "50 m straight pipe graduated every 10 m, with a pressure gauge at each end. Unit loss R = 180 Pa/m, i.e. 1 m → 180 Pa. The Δp between the two gauges is unknown. Options: 3.6 Pa, 230 Pa, 9 000 Pa and 90 000 Pa." },
 { title: "Local loss",
   sit: "On the coil supply, water flows at v = 1.5 m/s through an elbow with a coefficient ζ = 2.",
   q: "Calculate the local loss, then anticipate the effect of a more resistant fitting.",
   groups: [{ label: "1. Local loss: {F2}" }, { label: "2. At the same velocity, if ζ doubles, {dps}…", opts: ["is halved", "doubles", "stays constant"] }],
   svg: { acc: "Elbow, cutaway" },
   ok: "ρv²/2 = 1 000 × 1.5² / 2 = 1 125 Pa, so {dps} = 2 × 1 125 = 2 250 Pa = 2.25 kPa. {dps} is directly proportional to ζ: if ζ doubles, the loss doubles.",
   ko: "Square the velocity, then divide by 2: ρv²/2 = 1 000 × 2.25 / 2 = 1 125 Pa, and multiply by ζ: 2 250 Pa. As {dps} is proportional to ζ, doubling ζ doubles the local loss.",
   key: "For exchangers, filters, valves and meters, prefer the manufacturer's Δp/flow rate curves to a generic estimate.",
   notion: "Local losses (ζ)",
   alt: "Cutaway of a pipe elbow: the water changes direction and forms eddies on the outside of the bend. Data: v = 1.5 m/s, ρ = 1 000 kg/m³, ζ = 2. Boxes: Δpₛ = ζ × (ρv²/2) and ρv²/2 = 1 000 × 1.5² / 2, then the result Δpₛ, then the effect of ζ × 2." },
 { title: "Series or parallel?",
   sit: "You compare two arrangements: a line where pipe, filter, coil and valve follow one another, and two branches connected to the same headers.",
   q: "Place the right rule on each arrangement. One card is a trap.",
   zones: ["Components in series", "Branches in parallel"],
   labels: ["Losses added: 55 kPa", "Same Δp between headers", "Branch losses added together"],
   svg: { pipe: "Pipe", filter: "Filter", coil: "Coil", valve: "Valve", col: "Headers" },
   ok: "In series, the same flow rate passes through each component: 12 + 8 + 25 + 10 = 55 kPa. In parallel, the branches share the same start and end nodes: same Δp between headers, and the total flow rate divides according to their resistance: {F5}.",
   ko: "Adding the losses of two parallel branches assumes the same flow rate passes through them one after the other: that is wrong. In series, {F4}: 12 + 8 + 25 + 10 = 55 kPa. In parallel, the Δp is identical between the common headers.",
   key: "Only add components that are actually in series. A less resistant branch receives more flow if it is not balanced.",
   notion: "Series and parallel networks",
   alt: "On the left, a series line: pipe 12 kPa, filter 8 kPa, coil 25 kPa and valve 10 kPa. On the right, two branches A and B, each with a coil, connected to the same two headers; a Δp arrow links the headers. At the top, two drop zones: Components in series and Branches in parallel." },
 { title: "System curve",
   sit: "The network, with an unchanged configuration, loses 25 kPa at 5 m³/h. The operator plans to raise the flow rate to 10 m³/h.",
   q: "Approximately what pressure loss will the network have at 10 m³/h?",
   svg: { x: "Flow" },
   ok: "With {F6}, the flow rate doubles, so the loss is multiplied by 2² = 4: 25 × 4 = 100 kPa. Benchmarks: flow rate × 0.5 → Δp × 0.25; × 1.2 → × 1.44; × 1.5 → × 2.25; × 2 → × 4.",
   ko: "In mainly turbulent flow with a fixed configuration, the loss is not proportional to the flow rate: {F6}. Flow rate × 2 gives Δp × 4, i.e. 25 × 4 = 100 kPa. Benchmarks: × 0.5 → × 0.25; × 1.2 → × 1.44; × 1.5 → × 2.25.",
   key: "K changes if a valve moves, a filter clogs or branches open or close: the network does not have a single curve in every situation.",
   notion: "System curve",
   alt: "Graph of Δp in kPa against flow rate q in m³/h: system curve Δp = K × q² through the known point 25 kPa at 5 m³/h. A vertical line marks 10 m³/h, i.e. the flow rate multiplied by 2; the corresponding loss is unknown. After submission, the full curve reaches 100 kPa." },
 { title: "Final diagnosis: index circuit",
   sit: "Chilled water loop at design flow rate. Common main supply + return: 18 kPa. Branch A: pipework 9, coil 22, valve 8 kPa. Branch B: pipework 14, coil 28, valve 6 kPa.",
   q: "Carry out the diagnosis in three decisions.",
   groups: [{ label: "1. Loss along common main + branch A" }, { label: "2. Index circuit", opts: ["Branch A: 57 kPa", "Branch B: 66 kPa", "Branches A + B: 123 kPa"] }, { label: "3. Equivalent water head: 66 000 / (1 000 × 9.81)" }],
   svg: { pump: "Pump", trunk: "Common main", ar: "supply + return", a: "Branch A", b: "Branch B", pipe: "Pipework", coil: "Coil", valve: "Valve", col: "Headers" },
   ok: "Path A: 18 + 9 + 22 + 8 = 57 kPa; path B: 18 + 14 + 28 + 6 = 66 kPa. Branch B is the index circuit, i.e. 66 000 / (1 000 × 9.81) ≈ 6.73 mCE. The pump must deliver the total flow rate while supplying the Δp of path B; branch A will need balancing.",
   ko: "The common main is counted only once per path: A = 18 + 39 = 57 kPa, B = 18 + 48 = 66 kPa. Parallel branches are not added: take the most resistant one, B. Finally 66 000 / 9 810 ≈ 6.73 mCE.",
   key: "The index circuit is not necessarily the longest: it is the one with the highest total resistance at design flow rate.",
   notion: "Index circuit",
   alt: "Chilled water loop: a pump, a common supply and return main of 18 kPa, then two parallel branches between headers. Branch A: pipework 9 kPa, coil 22 kPa, valve 8 kPa. Branch B: pipework 14 kPa, coil 28 kPa, valve 6 kPa. The relevant path is highlighted as you make your decisions." }
 ]},

  }, steps: [
 { title: "¿Lineal o singular?",
   sit: "Antes de estimar las pérdidas de carga del tramo que alimenta una batería, identifica seis elementos en el esquema.",
   q: "Clasifique cada elemento identificado según el tipo de pérdida que genera.",
   items: ["1 · Tubo recto", "2 · Flexible", "3 · Codo", "4 · Te", "5 · Válvula", "6 · Filtro"],
   choices: ["Pérdida lineal (repartida)", "Pérdida singular (localizada)"],
   svg: { hx: "Intercamb.", flow: "Sentido del flujo" },
   ok: "El tubo recto y el flexible generan una pérdida lineal: el fluido roza contra las paredes a lo largo de toda su longitud. El codo, la te, la válvula y el filtro, como el intercambiador, crean una pérdida singular: la geometría o el componente provoca turbulencias locales. En ambos casos, la energía disipada se transforma en calor.",
   ko: "Pregúntese dónde se produce la disipación. Repartida a lo largo de una tubería (tubo recto, flexible): es el rozamiento, luego una pérdida lineal. Localizada en un cambio de dirección, de sección o en un componente (codo, te, válvula, filtro, intercambiador): son turbulencias, luego una pérdida singular.",
   key: "Una pérdida de carga es una disipación de la energía mecánica del fluido en forma de calor; se manifiesta como un descenso de la presión total en el sentido del flujo.",
   notion: "Origen y tipos de pérdidas",
   alt: "Tramo de una red en circuito cerrado. Marca 1: tubo recto; marca 2: flexible corrugado; marca 3: codo; marca 4: te con derivación; marca 5: válvula; marca 6: filtro. Un intercambiador de placas, sin numerar, está montado en el retorno. Una flecha indica el sentido del flujo." },
 { title: "Factores de influencia",
   sit: "En esta red, la presión total cae más que en la puesta en servicio. Enumera los parámetros que debe examinar.",
   q: "Seleccione todos los factores que influyen en las pérdidas de carga.",
   items: ["Caudal y velocidad del fluido", "Longitud y diámetro interior de la tubería", "Rugosidad de las paredes y suciedad", "Densidad y viscosidad del fluido", "Número y geometría de los accesorios", "Posición de válvulas, estado de filtros e intercambiadores", "Presión estática de llenado del circuito", "Volumen útil del vaso de expansión del circuito"],
   svg: { p: "Presión total", x: "Sentido del flujo", heat: "Energía disipada en calor" },
   ok: "Los seis factores actúan sobre el rozamiento o las turbulencias: caudal y velocidad, longitud y diámetro interior, rugosidad y suciedad, propiedades del fluido, accesorios, válvulas, filtros e intercambiadores. La presión estática de llenado y el vaso de expansión no forman parte de ellos.",
   ko: "La presión estática de llenado solo garantiza una presión suficiente en todos los puntos del circuito cerrado, y el vaso de expansión no frena el flujo. Las pérdidas varían con el caudal y la velocidad, la longitud y el diámetro interior, la rugosidad y la suciedad, ρ y la viscosidad, los accesorios, las válvulas, los filtros y los intercambiadores.",
   key: "En funcionamiento, es la bomba la que aporta la diferencia de presión necesaria para vencer las pérdidas del circuito recorrido.",
   notion: "Factores de influencia",
   alt: "Tubería equipada con una válvula y un filtro, con ondas de calor a lo largo del tubo. Debajo, un gráfico de la presión total según el sentido del flujo: la curva desciende de forma regular a lo largo de la tubería y cae más claramente a la altura de la válvula y del filtro." },
 { title: "Calcule una pérdida lineal",
   sit: "Una tubería recta de agua alimenta la batería: L = 40 m, D = 0,050 m, v = 1 m/s, λ = 0,025 y ρ = 1 000 kg/m³.",
   q: "Aplique {F1} en tres pasos.",
   groups: [{ label: "1. Relación L/D" }, { label: "2. Presión dinámica ρv²/2" }, { label: "3. Pérdida lineal {dpl}" }],
   svg: { pipe: "Tubería recta · agua" },
   ok: "L/D = 40 / 0,050 = 800; ρv²/2 = 1 000 × 1² / 2 = 500 Pa; {dpl} = 0,025 × 800 × 500 = 10 000 Pa = 10 kPa, es decir, unos 1,02 mCE con agua.",
   ko: "Compruebe cada eslabón: L/D = 40 / 0,050 = 800, sin unidad; la presión dinámica ρv²/2 = 1 000 × 1² / 2 = 500 Pa, sin olvidar la división entre 2; por último, 0,025 × 800 × 500 = 10 000 Pa = 10 kPa.",
   key: "λ depende del régimen de flujo, del número de Reynolds y de la rugosidad relativa: procede de un ábaco, de un programa o de los datos de dimensionamiento. Utilice siempre el diámetro interior real.",
   notion: "Pérdidas lineales (Darcy-Weisbach)",
   alt: "Tubería recta de agua de longitud L = 40 m y diámetro interior D = 0,050 m, con v = 1 m/s, λ = 0,025 y ρ = 1 000 kg/m³. Cadena de cálculo: L/D, después ρv²/2 y luego Δpₗ = λ × (L/D) × (ρv²/2). Los valores elegidos aparecen a medida que responde." },
 { title: "Pérdida unitaria",
   sit: "La oficina técnica indica una pérdida lineal unitaria R = 180 Pa/m para una tubería recta de 50 m.",
   q: "En el esquema, seleccione la pérdida lineal de esta tubería.",
   svg: { pipe: "Tubería recta" },
   ok: "{F3}: 180 Pa/m × 50 m = 9 000 Pa, es decir, 9 kPa. Esta lectura directa en Pa/m es muy utilizada por las oficinas técnicas.",
   ko: "La pérdida unitaria se expresa por metro: se multiplica por la longitud, no se divide ni se suma. {F3}: 180 × 50 = 9 000 Pa = 9 kPa.",
   key: "La misma lógica vale para cualquier tubería: con R = 250 Pa/m en 40 m, Δp = 250 × 40 = 10 000 Pa.",
   notion: "Pérdida unitaria R × L",
   alt: "Tubería recta de 50 m graduada cada 10 m, con un manómetro en cada extremo. Pérdida unitaria R = 180 Pa/m, es decir, 1 m → 180 Pa. La Δp entre los dos manómetros es desconocida. Valores propuestos: 3,6 Pa, 230 Pa, 9 000 Pa y 90 000 Pa." },
 { title: "Pérdida singular",
   sit: "En la impulsión de la batería, el agua circula a v = 1,5 m/s por un codo de coeficiente ζ = 2.",
   q: "Calcule la pérdida singular y anticipe después el efecto de un accesorio más resistente.",
   groups: [{ label: "1. Pérdida singular: {F2}" }, { label: "2. A igual velocidad, si ζ se duplica, {dps}…", opts: ["se reduce a la mitad", "se duplica", "permanece constante"] }],
   svg: { acc: "Codo en corte" },
   ok: "ρv²/2 = 1 000 × 1,5² / 2 = 1 125 Pa, luego {dps} = 2 × 1 125 = 2 250 Pa = 2,25 kPa. {dps} es directamente proporcional a ζ: si ζ se duplica, la pérdida se duplica.",
   ko: "Eleve la velocidad al cuadrado y divida entre 2: ρv²/2 = 1 000 × 2,25 / 2 = 1 125 Pa; después multiplique por ζ: 2 250 Pa. Como {dps} es proporcional a ζ, duplicar ζ duplica la pérdida singular.",
   key: "Para intercambiadores, filtros, válvulas y contadores, prefiera las curvas Δp/caudal del fabricante a una estimación genérica.",
   notion: "Pérdidas singulares (ζ)",
   alt: "Codo de tubería en corte: el agua cambia de dirección y forma remolinos en el exterior del codo. Datos: v = 1,5 m/s, ρ = 1 000 kg/m³, ζ = 2. Recuadros: Δpₛ = ζ × (ρv²/2) y ρv²/2 = 1 000 × 1,5² / 2, después el resultado Δpₛ y luego el efecto de ζ × 2." },
 { title: "¿Serie o paralelo?",
   sit: "Compara dos montajes: una línea en la que se suceden tubería, filtro, batería y válvula, y dos ramales conectados a los mismos colectores.",
   q: "Coloque la regla correcta en cada montaje. Una tarjeta es una trampa.",
   zones: ["Componentes en serie", "Ramales en paralelo"],
   labels: ["Pérdidas sumadas: 55 kPa", "Misma Δp entre colectores", "Pérdidas de ramales sumadas"],
   svg: { pipe: "Tubería", filter: "Filtro", coil: "Batería", valve: "Válvula", col: "Colectores" },
   ok: "En serie, el mismo caudal atraviesa cada componente: 12 + 8 + 25 + 10 = 55 kPa. En paralelo, los ramales comparten los mismos nudos de partida y llegada: misma Δp entre colectores, y el caudal total se reparte según su resistencia: {F5}.",
   ko: "Sumar las pérdidas de dos ramales en paralelo equivale a suponer que el mismo caudal los atraviesa uno tras otro: es falso. En serie, {F4}: 12 + 8 + 25 + 10 = 55 kPa. En paralelo, la Δp es idéntica entre los colectores comunes.",
   key: "Sume solo los componentes que estén realmente en serie. Un ramal menos resistente recibe más caudal si no está equilibrado.",
   notion: "Redes en serie y en paralelo",
   alt: "A la izquierda, una línea en serie: tubería 12 kPa, filtro 8 kPa, batería 25 kPa y válvula 10 kPa. A la derecha, dos ramales A y B, cada uno con una batería, conectados a los mismos dos colectores; una flecha Δp une los colectores. Arriba, dos zonas de colocación: Componentes en serie y Ramales en paralelo." },
 { title: "Curva de la red",
   sit: "La red, con la configuración sin cambios, pierde 25 kPa a 5 m³/h. El explotador prevé aumentar el caudal a 10 m³/h.",
   q: "¿Qué pérdida de carga presentará aproximadamente la red a 10 m³/h?",
   svg: { x: "Caudal" },
   ok: "Con {F6}, el caudal se duplica, luego la pérdida se multiplica por 2² = 4: 25 × 4 = 100 kPa. Referencias: caudal × 0,5 → Δp × 0,25; × 1,2 → × 1,44; × 1,5 → × 2,25; × 2 → × 4.",
   ko: "En régimen principalmente turbulento y con configuración fija, la pérdida no es proporcional al caudal: {F6}. Caudal × 2 da Δp × 4, es decir, 25 × 4 = 100 kPa. Referencias: × 0,5 → × 0,25; × 1,2 → × 1,44; × 1,5 → × 2,25.",
   key: "K cambia si se mueve una válvula, si se ensucia un filtro o si se abren o cierran ramales: la red no tiene una curva única en todas las situaciones.",
   notion: "Curva de la red",
   alt: "Gráfico de Δp en kPa en función del caudal q en m³/h: curva de la red Δp = K × q² que pasa por el punto conocido 25 kPa a 5 m³/h. Una línea vertical marca 10 m³/h, es decir, el caudal multiplicado por 2; la pérdida correspondiente es desconocida. Tras la validación, la curva completa alcanza 100 kPa." },
 { title: "Diagnóstico final: circuito más desfavorable",
   sit: "Circuito de agua helada al caudal de cálculo. Tramo común ida + retorno: 18 kPa. Ramal A: tubería 9, batería 22, válvula 8 kPa. Ramal B: tubería 14, batería 28, válvula 6 kPa.",
   q: "Realice el diagnóstico en tres decisiones.",
   groups: [{ label: "1. Pérdida del recorrido tramo común + ramal A" }, { label: "2. Circuito más desfavorable", opts: ["Ramal A: 57 kPa", "Ramal B: 66 kPa", "Ramales A + B: 123 kPa"] }, { label: "3. Altura equivalente de agua: 66 000 / (1 000 × 9,81)" }],
   svg: { pump: "Bomba", trunk: "Tramo común", ar: "ida + retorno", a: "Ramal A", b: "Ramal B", pipe: "Tubería", coil: "Batería", valve: "Válvula", col: "Colectores" },
   ok: "Recorrido A: 18 + 9 + 22 + 8 = 57 kPa; recorrido B: 18 + 14 + 28 + 6 = 66 kPa. El ramal B es el más desfavorable, es decir, 66 000 / (1 000 × 9,81) ≈ 6,73 mCE. La bomba debe asegurar el caudal total aportando la Δp del recorrido B; habrá que equilibrar el ramal A.",
   ko: "El tramo común se cuenta una sola vez por recorrido: A = 18 + 39 = 57 kPa, B = 18 + 48 = 66 kPa. Los ramales en paralelo no se suman: se toma el más resistente, B. Por último, 66 000 / 9 810 ≈ 6,73 mCE.",
   key: "El circuito más desfavorable no es necesariamente el más largo: es aquel cuya suma de resistencias al caudal de cálculo es la más elevada.",
   notion: "Circuito más desfavorable",
   alt: "Circuito de agua helada: una bomba, un tramo común de ida y retorno de 18 kPa y, después, dos ramales en paralelo entre colectores. Ramal A: tubería 9 kPa, batería 22 kPa, válvula 8 kPa. Ramal B: tubería 14 kPa, batería 28 kPa, válvula 6 kPa. El recorrido correspondiente se resalta a medida que toma las decisiones." }
 ]},

 }, steps: [
 { title: "Linear ou singular?",
   sit: "Antes de estimar as perdas de carga do troço que alimenta uma bateria, identifica seis elementos no esquema.",
   q: "Classifique cada elemento identificado segundo a família de perda que gera.",
   items: ["1 · Tubo reto", "2 · Flexível", "3 · Curva", "4 · Tê", "5 · Válvula", "6 · Filtro"],
   choices: ["Perda linear (distribuída)", "Perda singular (localizada)"],
   svg: { hx: "Permutador", flow: "Sentido do fluxo" },
   ok: "O tubo reto e o flexível geram uma perda linear: o fluido atrita contra as paredes ao longo de todo o seu comprimento. A curva, o tê, a válvula e o filtro, tal como o permutador, criam uma perda singular: a geometria ou o órgão provoca turbulência local. Em ambos os casos, a energia dissipada transforma-se em calor.",
   ko: "Pergunte-se onde ocorre a dissipação. Distribuída ao longo de uma tubagem (tubo reto, flexível): é o atrito, logo uma perda linear. Localizada numa mudança de direção, de secção ou num órgão (curva, tê, válvula, filtro, permutador): é turbulência, logo uma perda singular.",
   key: "Uma perda de carga é uma dissipação da energia mecânica do fluido em calor; manifesta-se como uma descida da pressão total no sentido do escoamento.",
   notion: "Origem e famílias de perdas",
   alt: "Troço de rede em circuito fechado. Referência 1: tubo reto; referência 2: flexível corrugado; referência 3: curva; referência 4: tê com derivação; referência 5: válvula; referência 6: filtro. Um permutador de placas, não numerado, está montado no retorno. Uma seta indica o sentido do escoamento." },
 { title: "Fatores de influência",
   sit: "Nesta rede, a pressão total cai mais do que na colocação em serviço. Lista os parâmetros a examinar.",
   q: "Selecione todos os fatores que influenciam as perdas de carga.",
   items: ["Caudal e velocidade do fluido", "Comprimento e diâmetro interior da tubagem", "Rugosidade das paredes e sujidade", "Massa volúmica e viscosidade do fluido", "Número e geometria dos acessórios", "Posição das válvulas, estado de filtros e permutadores", "Pressão estática de enchimento do circuito", "Volume útil do vaso de expansão do circuito"],
   svg: { p: "Pressão total", x: "Sentido do fluxo", heat: "Energia dissipada em calor" },
   ok: "Os seis fatores atuam sobre o atrito ou a turbulência: caudal e velocidade, comprimento e diâmetro interior, rugosidade e sujidade, propriedades do fluido, acessórios, válvulas, filtros e permutadores. A pressão estática de enchimento e o vaso de expansão não fazem parte deles.",
   ko: "A pressão estática de enchimento apenas garante uma pressão suficiente em todos os pontos do circuito fechado, e o vaso de expansão não trava o escoamento. As perdas variam com o caudal e a velocidade, o comprimento e o diâmetro interior, a rugosidade e a sujidade, ρ e a viscosidade, os acessórios, as válvulas, filtros e permutadores.",
   key: "Em funcionamento, é a bomba que fornece a diferença de pressão necessária para vencer as perdas do circuito percorrido.",
   notion: "Fatores de influência",
   alt: "Tubagem equipada com uma válvula e um filtro, com ondas de calor ao longo do tubo. Por baixo, um gráfico da pressão total no sentido do escoamento: a curva desce regularmente ao longo da tubagem e cai de forma mais acentuada na válvula e no filtro." },
 { title: "Calcule uma perda linear",
   sit: "Uma tubagem reta de água alimenta a bateria: L = 40 m, D = 0,050 m, v = 1 m/s, λ = 0,025 e ρ = 1 000 kg/m³.",
   q: "Aplique {F1} em três etapas.",
   groups: [{ label: "1. Relação L/D" }, { label: "2. Pressão dinâmica ρv²/2" }, { label: "3. Perda linear {dpl}" }],
   svg: { pipe: "Tubagem reta · água" },
   ok: "L/D = 40 / 0,050 = 800; ρv²/2 = 1 000 × 1² / 2 = 500 Pa; {dpl} = 0,025 × 800 × 500 = 10 000 Pa = 10 kPa, ou seja, cerca de 1,02 mCE com água.",
   ko: "Verifique cada elo: L/D = 40 / 0,050 = 800, sem unidade; a pressão dinâmica ρv²/2 = 1 000 × 1² / 2 = 500 Pa, sem esquecer a divisão por 2; por fim, 0,025 × 800 × 500 = 10 000 Pa = 10 kPa.",
   key: "λ depende do regime de escoamento, do número de Reynolds e da rugosidade relativa: provém de um ábaco, de um software ou dos dados de dimensionamento. Utilize sempre o diâmetro interior real.",
   notion: "Perdas lineares (Darcy-Weisbach)",
   alt: "Tubagem reta de água com comprimento L = 40 m e diâmetro interior D = 0,050 m, com v = 1 m/s, λ = 0,025 e ρ = 1 000 kg/m³. Cadeia de cálculo: L/D, depois ρv²/2, depois Δpₗ = λ × (L/D) × (ρv²/2). Os valores escolhidos aparecem à medida das respostas." },
 { title: "Perda unitária",
   sit: "O gabinete de projeto indica uma perda linear unitária R = 180 Pa/m para uma tubagem reta de 50 m.",
   q: "No esquema, selecione a perda linear desta tubagem.",
   svg: { pipe: "Tubagem reta" },
   ok: "{F3}: 180 Pa/m × 50 m = 9 000 Pa, ou seja, 9 kPa. Esta leitura direta em Pa/m é muito usada pelos gabinetes de projeto.",
   ko: "A perda unitária exprime-se por metro: multiplica-se pelo comprimento, não se divide nem se soma. {F3}: 180 × 50 = 9 000 Pa = 9 kPa.",
   key: "Mesma lógica para qualquer tubagem: com R = 250 Pa/m em 40 m, Δp = 250 × 40 = 10 000 Pa.",
   notion: "Perda unitária R × L",
   alt: "Tubagem reta de 50 m graduada a cada 10 m, com um manómetro em cada extremidade. Perda unitária R = 180 Pa/m, ou seja, 1 m → 180 Pa. O Δp entre os dois manómetros é desconhecido. Valores propostos: 3,6 Pa, 230 Pa, 9 000 Pa e 90 000 Pa." },
 { title: "Perda singular",
   sit: "Na ida para a bateria, a água circula a v = 1,5 m/s numa curva com coeficiente ζ = 2.",
   q: "Calcule a perda singular e antecipe o efeito de um acessório mais resistente.",
   groups: [{ label: "1. Perda singular: {F2}" }, { label: "2. À mesma velocidade, se ζ duplicar, {dps}…", opts: ["é dividida por dois", "duplica", "fica constante"] }],
   svg: { acc: "Curva em corte" },
   ok: "ρv²/2 = 1 000 × 1,5² / 2 = 1 125 Pa, logo {dps} = 2 × 1 125 = 2 250 Pa = 2,25 kPa. {dps} é diretamente proporcional a ζ: se ζ duplicar, a perda duplica.",
   ko: "Eleve a velocidade ao quadrado e divida por 2: ρv²/2 = 1 000 × 2,25 / 2 = 1 125 Pa; depois multiplique por ζ: 2 250 Pa. Como {dps} é proporcional a ζ, duplicar ζ duplica a perda singular.",
   key: "Para permutadores, filtros, válvulas e contadores, prefira as curvas Δp/caudal do fabricante a uma estimativa genérica.",
   notion: "Perdas singulares (ζ)",
   alt: "Curva de tubagem em corte: a água muda de direção e forma turbilhões no exterior da curva. Dados: v = 1,5 m/s, ρ = 1 000 kg/m³, ζ = 2. Caixas: Δpₛ = ζ × (ρv²/2) e ρv²/2 = 1 000 × 1,5² / 2, depois o resultado Δpₛ, depois o efeito de ζ × 2." },
 { title: "Série ou paralelo?",
   sit: "Compara duas montagens: uma linha em que tubagem, filtro, bateria e válvula se sucedem, e dois ramais ligados aos mesmos coletores.",
   q: "Coloque a regra correta em cada montagem. Um cartão é uma armadilha.",
   zones: ["Componentes em série", "Ramais em paralelo"],
   labels: ["Perdas somadas: 55 kPa", "Mesmo Δp entre os coletores", "Perdas dos ramais somadas"],
   svg: { pipe: "Tubagem", filter: "Filtro", coil: "Bateria", valve: "Válvula", col: "Coletores" },
   ok: "Em série, o mesmo caudal atravessa cada componente: 12 + 8 + 25 + 10 = 55 kPa. Em paralelo, os ramais partilham os mesmos nós de partida e de chegada: mesmo Δp entre coletores, e o caudal total reparte-se segundo a sua resistência: {F5}.",
   ko: "Somar as perdas de dois ramais em paralelo equivale a supor que o mesmo caudal os atravessa sucessivamente: é falso. Em série, {F4}: 12 + 8 + 25 + 10 = 55 kPa. Em paralelo, o Δp é idêntico entre os coletores comuns.",
   key: "Some apenas os componentes realmente em série. Um ramal menos resistente recebe mais caudal se não estiver equilibrado.",
   notion: "Redes em série e em paralelo",
   alt: "À esquerda, uma linha em série: tubagem 12 kPa, filtro 8 kPa, bateria 25 kPa e válvula 10 kPa. À direita, dois ramais A e B, cada um com uma bateria, ligados aos mesmos dois coletores; uma seta Δp liga os coletores. No topo, duas zonas de colocação: Componentes em série e Ramais em paralelo." },
 { title: "Curva da rede",
   sit: "A rede, com configuração inalterada, perde 25 kPa a 5 m³/h. A exploração pondera aumentar o caudal para 10 m³/h.",
   q: "Que perda de carga terá a rede, aproximadamente, a 10 m³/h?",
   svg: { x: "Caudal" },
   ok: "Com {F6}, o caudal duplica, logo a perda é multiplicada por 2² = 4: 25 × 4 = 100 kPa. Referências: caudal × 0,5 → Δp × 0,25; × 1,2 → × 1,44; × 1,5 → × 2,25; × 2 → × 4.",
   ko: "Em regime essencialmente turbulento e com configuração fixa, a perda não acompanha o caudal de forma proporcional: {F6}. Caudal × 2 dá Δp × 4, ou seja, 25 × 4 = 100 kPa. Referências: × 0,5 → × 0,25; × 1,2 → × 1,44; × 1,5 → × 2,25.",
   key: "K muda se uma válvula se mover, se um filtro colmatar ou se ramais abrirem ou fecharem: a rede não tem uma curva única em todas as situações.",
   notion: "Curva da rede",
   alt: "Gráfico de Δp em kPa em função do caudal q em m³/h: curva da rede Δp = K × q² que passa pelo ponto conhecido 25 kPa a 5 m³/h. Uma linha vertical marca 10 m³/h, ou seja, o caudal multiplicado por 2; a perda correspondente é desconhecida. Após a validação, a curva completa atinge 100 kPa." },
 { title: "Diagnóstico final: circuito desfavorável",
   sit: "Circuito de água gelada ao caudal de cálculo. Tronco comum ida + retorno: 18 kPa. Ramal A: tubagem 9, bateria 22, válvula 8 kPa. Ramal B: tubagem 14, bateria 28, válvula 6 kPa.",
   q: "Faça o diagnóstico em três decisões.",
   groups: [{ label: "1. Perda do percurso tronco comum + ramal A" }, { label: "2. Circuito desfavorável", opts: ["Ramal A: 57 kPa", "Ramal B: 66 kPa", "Ramais A + B: 123 kPa"] }, { label: "3. Altura equivalente em água: 66 000 / (1 000 × 9,81)" }],
   svg: { pump: "Bomba", trunk: "Tronco comum", ar: "ida + retorno", a: "Ramal A", b: "Ramal B", pipe: "Tubagem", coil: "Bateria", valve: "Válvula", col: "Coletores" },
   ok: "Percurso A: 18 + 9 + 22 + 8 = 57 kPa; percurso B: 18 + 14 + 28 + 6 = 66 kPa. O ramal B é o mais desfavorável, ou seja, 66 000 / (1 000 × 9,81) ≈ 6,73 mCE. A bomba deve garantir o caudal total fornecendo o Δp do percurso B; o ramal A terá de ser equilibrado.",
   ko: "O tronco comum conta-se uma única vez por percurso: A = 18 + 39 = 57 kPa, B = 18 + 48 = 66 kPa. Os ramais em paralelo não se somam: considera-se o mais resistente, B. Por fim, 66 000 / 9 810 ≈ 6,73 mCE.",
   key: "O circuito desfavorável não é necessariamente o mais longo: é aquele cuja soma das resistências ao caudal de cálculo é a mais elevada.",
   notion: "Circuito desfavorável",
   alt: "Circuito de água gelada: uma bomba, um tronco comum de ida e retorno de 18 kPa e, depois, dois ramais em paralelo entre coletores. Ramal A: tubagem 9 kPa, bateria 22 kPa, válvula 8 kPa. Ramal B: tubagem 14 kPa, bateria 28 kPa, válvula 6 kPa. O percurso em causa fica realçado à medida das decisões." }
 ]},

 { title: "Distribuita o concentrata?",

 { title: "Fattori d'influenza",

   svg: { p: "Pressione totale", x: "Verso del flusso", heat: "Energia dissipata in calore" },

   ko: "La pressione statica di riempimento garantisce solo una pressione sufficiente in ogni punto del circuito chiuso, e il vaso d'espansione non frena il flusso. Le perdite variano con portata e velocità, lunghezza e diametro interno, rugosità e sporcamento, ρ e viscosità, accessori, valvole, filtri e scambiatori.",

 { title: "Calcola una perdita distribuita",

 { title: "Perdita unitaria",

   notion: "Perdita unitaria R × L",
   alt: "Tubazione dritta di 50 m graduata ogni 10 m, con un manometro a ciascuna estremità. Perdita unitaria R = 180 Pa/m, ossia 1 m → 180 Pa. Il Δp tra i due manometri è sconosciuto. Valori proposti: 3,6 Pa, 230 Pa, 9 000 Pa e 90 000 Pa." },
 { title: "Perdita concentrata",

 { title: "Curva della rete",

   ko: "In regime prevalentemente turbolento e a configurazione fissa, la perdita non varia in proporzione alla portata: {F6}. Portata × 2 dà Δp × 4, ossia 25 × 4 = 100 kPa. Riferimenti: × 0,5 → × 0,25; × 1,2 → × 1,44; × 1,5 → × 2,25.",

function complete(i) {
  const c = CFG[i], r = S.resp[i];
  switch (c.type) {
    case "drag": return r.every(v => v !== null);
    case "assoc": return r.every(v => v !== "");
    case "groups": return r.every(v => v !== null);
    case "multi": return r.length > 0;
    default: return r !== null;

  const c = CFG[i], r = S.resp[i];
  switch (c.type) {
    case "drag": return r[0] === c.correct[0] && r[1] === c.correct[1];
    case "assoc": return r.every((v, k) => Number(v) === c.correct[k]);
    case "groups": return r.every((v, k) => v === c.groups[k].correct);
    case "multi": return r.length === c.correct.length && c.correct.every(x => r.indexOf(x) >= 0);
    default: return r === c.correct;
  }
}
function groupOpts(i, g) {
  const c = CFG[i], st = ST(i);
  if (st.groups[g].opts) return st.groups[g].opts;
  return c.groups[g].vals.map(nv);

function ansText(i, r, isCorrect) {
  const c = CFG[i], st = ST(i);
  switch (c.type) {
    case "single": return r == null ? null : singleOpts(i)[r];
    case "valpick": return r == null ? null : (c.pre || "") + nv(c.vals[r]);
    case "assoc": return r.every(v => v === "") ? null : r.map((v, k) => st.items[k] + " → " + (v === "" ? "—" : st.choices[+v])).join(" · ");
    case "groups": return r.every(v => v == null) ? null : r.map((v, g) => (v == null ? "—" : groupOpts(i, g)[v])).join(" · ");
    case "drag": return r.every(v => v == null) ? null : r.map((l, z) => st.zones[z] + " = " + (l == null ? "—" : st.labels[l])).join(" · ");
    case "multi": {
      if (isCorrect) return U("allBut") + " " + st.items.filter((t, k) => c.correct.indexOf(k) < 0).join(" ; ");
      if (!r.length) return null;
      const good = r.filter(x => c.correct.indexOf(x) >= 0).length, bad = r.length - good + (c.correct.length - good);
      return fmtT(U("multiAns"), { c: good, n: c.correct.length, w: bad });
    }
  }
  return null;
}
function corrText(i) {
  const c = CFG[i];
  if (c.type === "drag" || c.type === "assoc") return ansText(i, c.correct.map(x => c.type === "assoc" ? String(x) : x));
  if (c.type === "groups") return ansText(i, c.groups.map(g => g.correct));
  if (c.type === "multi") return ansText(i, c.correct, true);
  return ansText(i, c.correct);
}

/* manomètre : valeur v sur l'échelle [min, max] */
function gauge(x, y, r, min, max, v, opt = {}) {
  const f = p => (p - min) / (max - min);
  const A = t => (135 + 270 * t) * Math.PI / 180;
  const pt = (t, rr) => [(rr * Math.cos(A(t))).toFixed(1), (rr * Math.sin(A(t))).toFixed(1)];
  let s = `<circle r="${r + 4}" fill="#C9D6E6"/><circle r="${r}" fill="url(#gWhite)" stroke="#8FA3BD" stroke-width="2"/>`;
  const steps = opt.ticks || [];
  const nmin = opt.minor || 10;
  for (let k = 0; k <= nmin; k++) { const a = pt(k / nmin, r - 3), b = pt(k / nmin, r - 9); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#36506F" stroke-width="1.3"/>`; }
  steps.forEach(p => { const t = f(p), a = pt(t, r - 3), b = pt(t, r - 14), c = pt(t, r - 28); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${p === 0 && opt.zero ? "#1E7FD0" : "#1B2A41"}" stroke-width="${p === 0 && opt.zero ? 4 : 2.4}"/><text class="gnum" x="${c[0]}" y="${(+c[1] + 6).toFixed(1)}" text-anchor="middle">${esc(nv(String(p)))}</text>`; });
  const n = pt(f(v), r - 12);
  s += `<line x1="0" y1="0" x2="${n[0]}" y2="${n[1]}" stroke="#C21B22" stroke-width="${Math.max(3, r / 22)}" stroke-linecap="round"/><circle r="${Math.max(4, r / 12)}" fill="#0B2350"/>`;
  if (opt.unit) s += `<text class="gunit" y="${(r * 0.55).toFixed(1)}" text-anchor="middle">${esc(opt.unit)}</text>`;
  return G(x, y, s);
}

/* ---------- Éléments de la page ---------- */
const $ = s => document.querySelector(s);
let main, nav, prog, live;
let suppressClick = false, drag = null;
function announce(msg) { live.textContent = ""; setTimeout(() => { live.textContent = msg; }, 60); }

function render(focusSel) {
  const u = L[S.lang].ui;
  document.documentElement.lang = S.lang;
  document.title = u.module + " – " + u.introTitle;
  $("#mod").textContent = u.module;
  $("#langLbl").textContent = u.lang;
  $("#langSel").value = S.lang;
  renderPause(); renderProg();
  if (S.view === "intro") renderIntro();
  else if (S.view === "step") renderStep();
  else if (S.view === "result") renderResult();
  else renderReview();
  renderNav();
  requestAnimationFrame(() => {
    fit();
    if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
  });
}
function renderPause() {
  const b = $("#pauseBtn");
  document.body.classList.toggle("paused", S.paused);
  b.innerHTML = (S.paused ? IC_PLAY : IC_PAUSE) + '<span class="btxt">' + esc(S.paused ? U("resume") : U("pause")) + "</span>";
  b.setAttribute("aria-label", S.paused ? U("resumeAria") : U("pauseAria"));
}
function renderProg() {
  if (S.view === "intro") { prog.hidden = true; prog.innerHTML = ""; return; }
  prog.hidden = false;
  const cur = S.view === "step" ? S.i : -1, n = S.view === "step" ? S.i + 1 : N;
  prog.setAttribute("aria-label", U("progress"));
  let h = `<p class="ptxt">${esc(fmtT(U("stepOf"), { n: n, t: N }))}</p><ol class="dots">`;
  for (let k = 0; k < N; k++) {
    const st = k === cur ? "cur" : (S.done[k] ? "done" : "todo");
    const t = k === cur ? U("stCur") : (S.done[k] ? U("stDone") : U("stTodo"));

/* ---------- Ajustement automatique : aucun défilement ---------- */
function setK(k) { document.documentElement.style.setProperty("--k", k.toFixed(2)); }
function overflowing() {
  const els = [main].concat(Array.prototype.slice.call(main.querySelectorAll(".fit")));
  return els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
}
function fit() {
  const root = main.firstElementChild; if (!root) return;
  root.classList.remove("c1", "c2", "c3");
  let k = 1; setK(k);
  while (overflowing() && k > 0.8) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c1"); k = 1; setK(k);
  while (overflowing() && k > 0.76) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c2"); k = 1; setK(k);
  while (overflowing() && k > 0.72) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c3"); k = 1; setK(k);
  while (overflowing() && k > 0.62) { k -= 0.04; setK(k); }
}

/* ---------- Actions ---------- */
function validate() {
  const i = S.i; if (S.done[i] || !complete(i)) return;
  S.done[i] = true; S.ok[i] = check(i); S.sel = null;
  render('[data-key="next"]');
  const st = ST(i);
  announce((S.ok[i] ? U("ok") : U("ko")) + ". " + plain(S.ok[i] ? st.ok : st.ko) + " " + U("remember") + " : " + plain(st.key));
}
function place(l, z) {
  const arr = S.resp[S.i];
  for (let k = 0; k < arr.length; k++) if (arr[k] === l) arr[k] = null;
  arr[z] = l; S.sel = null;
  render(`[data-key="dz-${z}"]`);
  announce(fmtT(U("placed"), { l: ST(S.i).labels[l], z: ST(S.i).zones[z] }));
}
function act(a, b) {
  const i = S.i;
  switch (a) {
    case "start": S.view = "step"; S.i = 0; render("#stTitle"); break;
    case "prev": if (S.i > 0) { S.i--; render("#stTitle"); } else { S.view = "intro"; render("#startBtn"); } break;
    case "next": if (!S.done[i]) return; if (i < N - 1) { S.i++; render("#stTitle"); } else { S.view = "result"; render("#resTitle"); } break;
    case "validate": validate(); break;
    case "pick": if (S.done[i]) return; S.resp[i] = parseInt(b.dataset.v, 10); render(`[data-key="${b.dataset.key}"]`); break;
    case "gpick": {
      if (S.done[i]) return;
      const g = parseInt(b.dataset.g, 10); S.resp[i][g] = parseInt(b.dataset.v, 10);
      render(`[data-key="${b.dataset.key}"]`); break;
    }
    case "toggle": {
      if (S.done[i]) return;
      const v = parseInt(b.dataset.v, 10), arr = S.resp[i], p = arr.indexOf(v);
      if (p >= 0) arr.splice(p, 1); else arr.push(v);
      render(`[data-key="${b.dataset.key}"]`); break;
    }
    case "chip": {
      if (S.done[i]) return;
      if (suppressClick) { suppressClick = false; return; }
      const l = parseInt(b.dataset.l, 10); S.sel = S.sel === l ? null : l;
      if (S.sel != null) { const arr = S.resp[i]; const z = arr[0] == null ? 0 : (arr[1] == null ? 1 : 0); render(`[data-key="dz-${z}"]`); announce(fmtT(U("labelSel"), { l: ST(i).labels[l] })); }
      else render(`[data-key="chip-${l}"]`);
      break;
    }
    case "dz": {
      if (S.done[i]) return;
      const z = parseInt(b.dataset.z, 10);
      if (S.sel != null) place(S.sel, z);
      else if (S.resp[i][z] != null) { S.resp[i][z] = null; render(`[data-key="dz-${z}"]`); announce(fmtT(U("removed"), { z: ST(i).zones[z] })); }
      else announce(U("hDrag"));
      break;
    }
    case "review": S.view = "review"; S.page = 0; render("#rvTitle"); break;
    case "restart": initResp(); S.view = "step"; S.i = 0; render("#stTitle"); break;
    case "back": S.view = "result"; render("#resTitle"); break;
    case "pgprev": if (S.page > 0) { S.page--; render(S.page === 0 ? '[data-key="pgnext"]' : '[data-key="pgprev"]'); } break;
    case "pgnext": if (S.page < pageCount() - 1) { S.page++; render(S.page >= pageCount() - 1 ? '[data-key="pgprev"]' : '[data-key="pgnext"]'); } break;
    case "pause": S.paused = !S.paused; renderPause(); break;
  }
}

/* ---------- Glisser-déposer (souris, stylet, tactile) ---------- */
function onDown(e) { const c = e.target.closest(".chip"); if (!c || c.disabled || S.done[S.i]) return; drag = { l: parseInt(c.dataset.l, 10), x: e.clientX, y: e.clientY, el: c, moved: false, ghost: null }; }
function onMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true; const g = document.createElement("div"); g.className = "ghost"; g.textContent = drag.el.firstChild.textContent;
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("dragging");
  }
  if (drag.moved) {
    e.preventDefault(); drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
    const under = document.elementFromPoint(e.clientX, e.clientY);
    document.querySelectorAll(".dz").forEach(z => z.classList.toggle("hover", !!under && z.contains(under)));
  }
}
function onUp(e) {
  if (!drag) return; const d = drag; drag = null; if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  if (d.ghost) d.ghost.remove(); d.el.classList.remove("dragging");
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under ? under.closest(".dz") : null;
  document.querySelectorAll(".dz").forEach(x => x.classList.remove("hover"));
  if (z && !z.disabled) place(d.l, parseInt(z.dataset.z, 10));
}
function onCancel() { if (drag) { if (drag.ghost) drag.ghost.remove(); drag.el.classList.remove("dragging"); drag = null; } }

/* ---------- Démarrage ---------- */
function init() {
  main = $("#main"); nav = $("#nav"); prog = $("#prog"); live = $("#live");
  $("#langSel").innerHTML = LANGS.map(l => `<option value="${l}" lang="${l}">${esc(L[l].name)}</option>`).join("");
  const rm = window.matchMedia("(prefers-reduced-motion: reduce)");
  S.paused = rm.matches;
  if (rm.addEventListener) rm.addEventListener("change", e => { S.paused = e.matches; renderPause(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return; act(b.dataset.act, b); });
  $("#pauseBtn").addEventListener("click", () => act("pause"));
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "langSel") { S.lang = t.value; render("#langSel"); announce(L[S.lang].name); }
    else if (t.matches("select[data-row]")) { S.resp[S.i][parseInt(t.dataset.row, 10)] = t.value; render("#" + t.id); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel != null) { const l = S.sel; S.sel = null; render(`[data-key="chip-${l}"]`); } });
  document.addEventListener("pointerdown", onDown);
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
  let to = null;
  window.addEventListener("resize", () => { clearTimeout(to); to = setTimeout(() => { if (S.view === "review") render(); else fit(); }, 120); });
  render();
}
if (typeof document !== "undefined" && document.getElementById("app")) init();

})();
</script>
</body>
</html>
