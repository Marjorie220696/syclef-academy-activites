<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SYCLEF ACADEMY – Boucles primaires et secondaires</title>
<style>
:root{
  --blue:#386FB6; --blue-d:#2A5694; --blue-l:#EAF1FA;
  --orange:#F4951F; --orange-l:#FEF3E4;
  --green:#94C356; --green-l:#F1F8E8;
  --grey-l:#B7BECF; --grey-d:#66778F; --grey-xl:#EEF1F6;
  --ink:#2B3646; --bg:#F5F7FA; --card:#FFFFFF;
  --sup:#F4951F; --ret:#386FB6;
  --radius:14px;
  --font:"Lato","Calibri","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{ color-scheme: light; } }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Header */
header.top{background:#fff;border-block-end:1px solid var(--grey-xl)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{height:46px;width:auto;display:block}
.lang{display:flex;align-items:center;gap:8px}
.lang label{font-size:13px;color:var(--grey-d);font-weight:600}
.lang select{font-family:var(--font);font-size:15px;color:var(--ink);background:#fff;border:2px solid var(--grey-l);border-radius:10px;padding:7px 30px 7px 10px;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--blue) 50%),linear-gradient(135deg,var(--blue) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.lang select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* Hero */
.hero{padding-block:22px 6px}
.dash{width:46px;height:4px;background:var(--orange);border-radius:2px;margin-block-end:12px}
.kicker{color:var(--orange);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:0 0 4px}
h1{color:var(--blue);font-size:clamp(22px,3.2vw,32px);line-height:1.2;margin:0 0 10px;font-weight:800}
.intro{margin:0;max-width:880px;font-size:clamp(15px,1.6vw,17px)}
.intro strong{color:var(--blue-d)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-block:18px 12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--grey-l);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font-family:var(--font);font-size:14px;font-weight:700;border:0;background:transparent;color:var(--grey-d);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:38px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg.mode button[aria-pressed="true"].heat{background:var(--orange)}
.seg button:focus-visible{outline:3px solid var(--orange);outline-offset:1px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--grey-d);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:42px;height:24px;border-radius:999px;background:var(--grey-l);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;inset-block-start:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--orange);outline-offset:2px}

/* Layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 10px rgba(43,54,70,.07);border:1px solid var(--grey-xl)}
.diagram{padding:10px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.scroller svg{display:block;width:100%;height:auto;min-width:0}
.swipe{display:none;text-align:center;font-size:12.5px;color:var(--grey-d);margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:13px;color:var(--grey-d);padding:8px 4px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:26px;height:5px;border-radius:3px}
.legend i.sw{height:12px;width:18px;border-radius:3px;border:1.5px dashed}

/* Panel */
.panel{padding:18px 18px 20px;position:sticky;inset-block-start:12px}
.panel .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);margin-block-end:10px}
.panel .tag.p{background:var(--orange-l);color:#A85E05}
.panel .tag.s{background:var(--blue-l);color:var(--blue-d)}
.panel .tag.b{background:var(--green-l);color:#4E7A1E}
.panel h2{margin:0 0 8px;color:var(--blue);font-size:21px;line-height:1.25}
.panel p{margin:0 0 12px;font-size:15.5px}
.panel .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;font-size:14px;margin-inline-end:8px;vertical-align:2px}
.hint{font-size:13.5px;color:var(--grey-d);border-block-start:1px solid var(--grey-xl);padding-block-start:10px;margin:6px 0 0}
.chips-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grey-d);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips button{font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--ink);background:var(--grey-xl);border:1.5px solid transparent;border-radius:999px;padding:7px 12px 7px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:36px;text-align:start}
.chips button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;flex:none}
.chips button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-l)}
.chips button[aria-pressed="true"] b{background:var(--orange)}
.chips button:focus-visible{outline:3px solid var(--orange);outline-offset:1px}

/* SVG */
svg text{font-family:var(--font)}
.zone-p{fill:#FFF7EC;stroke:#F8C27C;stroke-width:1.5;stroke-dasharray:7 6}
.zone-s{fill:#F0F5FC;stroke:#9DB8DE;stroke-width:1.5;stroke-dasharray:7 6}
.zone-label{font-size:15px;font-weight:800;letter-spacing:.08em}
.pipe{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.pipe.sup{stroke:var(--sup)} .pipe.ret{stroke:var(--ret)}
.flow{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1 17;opacity:.95;animation:flow 1.1s linear infinite}
.paused .flow{animation-play-state:paused;opacity:0}
@keyframes flow{to{stroke-dashoffset:-18}}
.comp{cursor:pointer;outline:none}
.comp .hit{fill:transparent}
.comp .body{transition:filter .2s}
.comp:hover .body,.comp:focus-visible .body{filter:drop-shadow(0 0 6px rgba(244,149,31,.85))}
.comp.sel .body{filter:drop-shadow(0 0 7px rgba(244,149,31,1))}
.badge circle{fill:var(--orange);stroke:#fff;stroke-width:2.5}
.comp.sel .badge circle{fill:var(--blue)}
.badge text{fill:#fff;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.lbl{font-size:14px;font-weight:700;fill:var(--ink);text-anchor:middle}
.lbl.small{font-size:12.5px;font-weight:600;fill:var(--grey-d)}
.lbl.warn{font-size:12px;font-weight:700;fill:#A85E05}
[data-loop]{transition:opacity .35s}
.v-p [data-loop="s"], .v-s [data-loop="p"]{opacity:.14}
.off{opacity:.35}
.v-p .off,.v-s [data-loop="p"].off{opacity:.14}
.cold-only{display:none} .is-cold .cold-only{display:inline} .is-cold .heat-only{display:none}
.is-cold { --sup:#386FB6; --ret:#8FB0DA; }

/* Table + takeaway */
section.more{margin-block:22px 10px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.tbl{padding:16px 18px 18px}
.tbl h2,.key h2{margin:0 0 12px;color:var(--blue);font-size:20px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;border:1px solid var(--grey-l);border-radius:10px;overflow:hidden}
th{background:var(--blue);color:#fff;text-align:start;font-weight:700;padding:10px 12px}
td{padding:10px 12px;border-block-start:1px solid var(--grey-xl);vertical-align:top}
td:first-child{font-weight:800;white-space:nowrap}
tr.rp td:first-child{color:#C26C04;border-inline-start:5px solid var(--orange)}
tr.rs td:first-child{color:var(--blue-d);border-inline-start:5px solid var(--blue)}
.key{padding:18px;background:var(--blue);color:#fff;border:0}
.key h2{color:#fff;display:flex;align-items:center;gap:10px}
.key h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(148,195,86,.35);flex:none}
.key p{margin:0;font-size:16px}

footer{margin-block-start:22px;background:var(--blue);color:#fff;font-size:13px}
footer .wrap{padding-block:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Responsive */
@media (max-width:980px){
  .grid,section.more{grid-template-columns:1fr}
  .panel{position:static}
}
@media (max-width:640px){
  .wrap{padding:0 12px}
  .logo{height:36px}
  .lang label{display:none}
  .scroller svg{min-width:620px}
  .swipe{display:block}
  .toolbar{flex-direction:column;align-items:stretch}
  .seg{justify-content:center}
  .seg button{flex:1 1 auto;padding:8px 10px;font-size:13.5px}
  .switch{justify-content:center}
  table,thead,tbody,tr,th,td{display:block}
  table{border:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tr{border:1px solid var(--grey-l);border-radius:10px;margin-block-end:10px;overflow:hidden;background:#fff}
  td{border:0;padding:6px 12px}
  td:first-child{padding-block:10px;background:var(--grey-xl)}
  td[data-h]::before{content:attr(data-h);display:block;font-size:12px;font-weight:800;color:var(--grey-d);text-transform:uppercase;letter-spacing:.04em}
}
@media (prefers-reduced-motion:reduce){ .flow{animation:none} }
</style>
</head>

/* Belgique (Flandre) : variante du néerlandais avec la terminologie belge */
T.be = (function(){
  var rep = [["open verdeler","evenwichtsfles"],["Open verdeler","Evenwichtsfles"],["volumestromen","debieten"],["volumestroom","debiet"],
             ["CV-ketel","Verwarmingsketel"],["Fancoil-units","Ventiloconvectoren"],["fancoil-units","ventiloconvectoren"],
             ["Koelmachine","Koelgroep"],["koelmachine","koelgroep"]];
  var o = {};
  Object.keys(T.nl).forEach(function(k){
    var s = T.nl[k];
    rep.forEach(function(r){ s = s.split(r[0]).join(r[1]); });
    o[k] = s;
  });
  return o;
})();

var HTML_LANG = {fr:"fr",be:"nl-BE",nl:"nl-NL",pt:"pt-PT",ie:"en-IE",es:"es-ES",it:"it-IT",pl:"pl-PL",ro:"ro-RO"};
var COMPS = [["gen",1,"p"],["p1",2,"p"],["bd",3,"b"],["ps",4,"s"],["v3v",5,"s"],["rad",6,"s"],["pc",7,"s"],["vc",8,"s"]];

/* ---------- Détection automatique de la langue ---------- */
function norm(tag){
  if(!tag) return null;
  tag = String(tag).trim().toLowerCase().replace("_","-");
  if(T[tag]) return tag;                         // fr, be, nl, pt, ie, es, it, pl, ro
  if(tag === "nl-be" || tag === "vls" || tag === "be-nl") return "be";
  if(tag === "fr-be") return "fr";
  var p = tag.split("-")[0];
  if(p === "en" || p === "ga") return "ie";
  if(T[p]) return p;
  return null;
}
function fromQuery(search){
  try{
    var q = new URLSearchParams(search || "");
    return norm(q.get("lang") || q.get("locale") || q.get("language") || q.get("lng"));
  }catch(e){ return null; }
}
function detect(){
  var c;
  // 1. Paramètre d'URL (?lang=pl) ou ancre (#lang=pl)
  c = fromQuery(location.search) || fromQuery((location.hash || "").replace(/^#/,""));
  if(c) return c;
  // 2. Langue de la page 360Learning qui héberge le module (si même domaine)
  try{ c = norm(window.parent.document.documentElement.lang); if(c && window.parent !== window) return c; }catch(e){}
  try{ c = norm(window.top.document.documentElement.lang); if(c && window.top !== window) return c; }catch(e){}
  // 3. Adresse de la page 360Learning (paramètre lang ou segment /pl/)
  try{
    if(document.referrer){
      var u = new URL(document.referrer);
      c = fromQuery(u.search);
      if(c) return c;
      var seg = u.pathname.split("/").filter(Boolean)[0];
      c = seg && seg.length <= 5 ? norm(seg) : null;
      if(c) return c;
    }
  }catch(e){}
  // 4. Choix manuel mémorisé
  try{ c = norm(localStorage.getItem("syclefAcademyLang")); if(c) return c; }catch(e){}
  // 5. Langue du navigateur / de l'appareil
  var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || navigator.userLanguage];
  for(var i=0;i<list.length;i++){ c = norm(list[i]); if(c) return c; }
  // 6. Langue de base
  return "fr";
}

/* ---------- État ---------- */
var state = { lang:"fr", view:"all", mode:"heat", sel:null };
var svg = document.getElementById("sch");

function t(k){ var d = T[state.lang]; return (d && d[k] != null) ? d[k] : (T.fr[k] || ""); }
function cname(id){
  if(state.mode === "cold"){
    if(id === "gen") return t("genC");
    if(id === "pc") return t("pcC");
  }
  return t(id);
}

function wrap(el, text, max){
  while(el.firstChild) el.removeChild(el.firstChild);
  var words = text.split(" "), lines = [], cur = "";
  words.forEach(function(w){
    if(cur && (cur + " " + w).length > max){ lines.push(cur); cur = w; }
    else cur = cur ? cur + " " + w : w;
  });
  if(cur) lines.push(cur);
  var x = el.getAttribute("x"), up = el.hasAttribute("data-up");
  lines.forEach(function(l, i){
    var ts = document.createElementNS("http://www.w3.org/2000/svg","tspan");
    ts.setAttribute("x", x);
    ts.setAttribute("dy", i === 0 ? (up ? (-(lines.length-1)*1.15)+"em" : "0") : "1.15em");
    ts.textContent = l;
    el.appendChild(ts);
  });
}

function renderTexts(){
  document.documentElement.lang = HTML_LANG[state.lang];
  document.title = "SYCLEF ACADEMY – " + t("title");
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i")); });
  document.querySelectorAll("[data-ih]").forEach(function(el){ el.innerHTML = t(el.getAttribute("data-ih")); });
  document.querySelectorAll("[data-hk]").forEach(function(el){ el.setAttribute("data-h", t(el.getAttribute("data-hk"))); });
  document.querySelectorAll("svg [data-w]").forEach(function(el){
    var k = el.getAttribute("data-w");
    wrap(el, k === "heatOnly" ? t(k) : cname(k), +el.getAttribute("data-wmax") || 16);
  });
  document.getElementById("svgTitle").textContent = t("svg");
  COMPS.forEach(function(c){
    var g = document.getElementById("c-" + c[0]);
    g.setAttribute("aria-label", c[1] + ". " + cname(c[0]));
  });
  document.getElementById("langSel").value = state.lang;
  renderChips();
  renderPanel();
}

function renderChips(){
  var ul = document.getElementById("chips");
  ul.innerHTML = "";
  COMPS.forEach(function(c){
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", state.sel === c[0] ? "true" : "false");
    var n = document.createElement("b"); n.textContent = c[1];
    b.appendChild(n);
    b.appendChild(document.createTextNode(cname(c[0])));
    b.addEventListener("click", function(){ select(c[0], false); });
    li.appendChild(b); ul.appendChild(li);
  });
}

function renderPanel(){
  var tag = document.getElementById("pTag"), h = document.getElementById("pTitle"), p = document.getElementById("pText");
  if(state.sel){
    var c = COMPS.filter(function(x){ return x[0] === state.sel; })[0];
    tag.className = "tag " + c[2];
    tag.textContent = c[2] === "p" ? t("viewPrim") : (c[2] === "s" ? t("viewSec") : t("both"));
    h.innerHTML = "";
    var n = document.createElement("span"); n.className = "num"; n.textContent = c[1];
    h.appendChild(n); h.appendChild(document.createTextNode(cname(c[0])));
    p.textContent = t(c[0] + "T");
  } else {
    var v = state.view;
    tag.className = "tag " + (v === "p" ? "p" : v === "s" ? "s" : "b");
    tag.textContent = v === "p" ? t("zonePrim") : v === "s" ? t("zoneSec") : t("overview");
    h.textContent = v === "p" ? t("viewPrim") : v === "s" ? t("viewSec") : t("title");
    p.textContent = v === "p" ? t("primDesc") : v === "s" ? t("secDesc") : t("allDesc");
  }
}

function select(id, fromSvg){
  state.sel = (state.sel === id) ? null : id;
  document.querySelectorAll(".comp").forEach(function(g){ g.classList.toggle("sel", g.getAttribute("data-c") === state.sel); });
  renderChips(); renderPanel();
  if(fromSvg && state.sel && window.matchMedia("(max-width:980px)").matches){
    var panel = document.getElementById("panel"), r = panel.getBoundingClientRect();
    if(r.top > window.innerHeight - 80){ try{ panel.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){ panel.scrollIntoView(); } }
  }
}

function setView(v){
  state.view = v; state.sel = null;
  svg.classList.remove("v-p","v-s");
  if(v !== "all") svg.classList.add("v-" + v);
  document.querySelectorAll("[data-view]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-view") === v ? "true" : "false"); });
  document.querySelectorAll(".comp").forEach(function(g){ g.classList.remove("sel"); });
  renderChips(); renderPanel();
}

function setMode(m){
  state.mode = m;
  var cold = m === "cold";
  document.body.classList.toggle("is-cold", cold);
  svg.classList.toggle("is-cold", cold);
  document.querySelectorAll("[data-mode]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-mode") === m ? "true" : "false"); });
  svg.querySelectorAll('[data-branch="1"]').forEach(function(g){ g.classList.toggle("off", cold); g.classList.toggle("paused", cold); });
  document.getElementById("c-rad").classList.toggle("off", cold);
  renderTexts();
}

/* ---------- Événements ---------- */
document.querySelectorAll(".comp").forEach(function(g){
  g.addEventListener("click", function(){ select(g.getAttribute("data-c"), true); });
  g.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); select(g.getAttribute("data-c"), true); } });
});
document.querySelectorAll("[data-view]").forEach(function(b){ b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); }); });
document.querySelectorAll("[data-mode]").forEach(function(b){ b.addEventListener("click", function(){ setMode(b.getAttribute("data-mode")); }); });
document.getElementById("animT").addEventListener("change", function(e){ svg.classList.toggle("paused", !e.target.checked); });
document.getElementById("langSel").addEventListener("change", function(e){
  state.lang = norm(e.target.value) || "fr";
  try{ localStorage.setItem("syclefAcademyLang", state.lang); }catch(err){}
  renderTexts();
});

state.lang = detect();
renderTexts();
})();
</script>
