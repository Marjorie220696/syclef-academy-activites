<!DOCTYPE html>
<html lang="fr-FR" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SYCLEF ACADEMY – Diagnostic d’un réseau hydraulique CVC</title>
<style>
:root{
  --blue:#386FB6;--orange:#F4951F;--green:#94C356;--gl:#B7BECF;--gd:#66778F;--white:#FFFFFF;
  --txt:#4F5E74;
  --blue-06:rgba(56,111,182,.06);--blue-12:rgba(56,111,182,.12);--blue-25:rgba(56,111,182,.25);
  --or-12:rgba(244,149,31,.12);--or-dk:#A85F06;--gr-15:rgba(148,195,86,.16);--gr-dk:#4C7A1C;--gl-35:rgba(183,190,207,.35);
  --font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;--r:14px;--sh:0 4px 16px rgba(102,119,143,.14);
}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100%;height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;background:var(--white)}
body{font-family:var(--font);color:var(--txt);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-wrap:break-word;word-break:normal;hyphens:manual}
img,svg{max-width:100%;height:auto}
button,select{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{color:var(--blue);line-height:1.2;margin:0}
p{margin:.4em 0}
.app{container-type:inline-size;container-name:app;width:100%;max-width:980px;margin:0 auto;padding:0 12px 28px}

/* En-tête compact */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0 10px;border-bottom:1px solid var(--gl-35);margin-bottom:12px}
.logo{display:block;height:58px;width:auto;flex:0 0 auto}
.phases{flex:1 1 260px;display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0;min-width:0}
.phase{flex:1 1 0;min-width:0;text-align:center;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gd)}
.phase i{display:block;height:6px;border-radius:6px;background:var(--gl-35);margin-bottom:4px;transition:background .3s}
.phase.on{color:var(--blue)} .phase.on i{background:var(--blue)}
.phase.done{color:var(--gr-dk)} .phase.done i{background:var(--green)}
.phase span{display:block;overflow-wrap:anywhere}
.langbox{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.langbox select{min-height:44px;max-width:100%;border:2px solid var(--gl);border-radius:10px;background:var(--white);color:var(--blue);font-weight:700;padding:4px 8px;cursor:pointer}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}

/* Blocs */
.block{background:var(--white);border:1px solid var(--gl-35);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.block.reveal{animation:rise .4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--or-dk);background:var(--or-12);border-radius:99px;padding:3px 10px;margin-bottom:6px}
.intro h1{font-size:clamp(1.3rem,4.2cqi,1.75rem)}
.intro .sub{font-weight:700;color:var(--gd);margin:2px 0 8px}
.secthead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.secthead .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center;font-weight:700}
.secthead h2{font-size:1.2rem}
.instr{display:flex;gap:8px;align-items:flex-start;background:var(--blue-06);border-radius:10px;padding:8px 12px;margin:6px 0 12px;font-weight:700;color:var(--blue);font-size:.95rem}
.instr::before{content:"☝";flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;max-width:100%;padding:10px 20px;border:0;border-radius:12px;background:var(--blue);color:var(--white);font-weight:700;cursor:pointer;text-align:center;white-space:normal;touch-action:manipulation}
.btn:disabled{background:var(--gl);cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--blue);border:2px solid var(--blue-25)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn-row .btn{flex:0 1 auto}
.hint{font-size:.88rem;color:var(--gd);margin-top:6px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.note{font-size:.8rem;font-style:italic;color:var(--gd);margin:6px 0 0}

/* Observer */
.obs{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@container app (min-width:900px){.obs{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.fig{position:relative;background:var(--blue-06);border-radius:12px;padding:8px}
.fig svg{display:block;width:100%;height:auto}
.zoom{position:absolute;top:6px;right:6px;min-width:40px;min-height:40px;border-radius:10px;border:2px solid var(--blue-25);background:var(--white);color:var(--blue);font-weight:700;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:6px;border-radius:4px}
.svg-l{font-family:var(--font);font-size:17px;font-weight:700;fill:#4F5E74}
.spot{cursor:pointer}
.spot .c{fill:var(--orange);stroke:#fff;stroke-width:3}
.spot.seen .c{fill:var(--green)}
.spot text{font-family:var(--font);font-size:18px;font-weight:700;fill:#fff;pointer-events:none}
.spot .halo{fill:none;stroke:var(--orange);stroke-width:2.5;opacity:.6}
.spot.seen .halo{stroke:var(--green)}
.spot:focus{outline:none}.spot:focus-visible .halo{stroke:var(--blue);stroke-width:4;opacity:1}
@media (prefers-reduced-motion:no-preference){.spot:not(.seen) .halo{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes pulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.counter{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--blue);background:var(--blue-06);border-radius:99px;padding:4px 12px;font-size:.9rem}
.counter.full{color:var(--gr-dk);background:var(--gr-15)}
.clues{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.clue{width:100%;display:flex;align-items:center;gap:10px;text-align:left;min-height:48px;padding:8px 12px;border-radius:12px;border:2px dashed var(--gl);background:var(--white);color:var(--gd);cursor:pointer}
.clue .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700}
.clue.seen{border-style:solid;border-color:var(--green);background:var(--gr-15);color:var(--txt);font-weight:700;cursor:default}
.clue.seen .num{background:var(--green)}
.clue.fresh{animation:rise .35s ease-out}
.context{margin-top:12px;border-left:5px solid var(--orange);background:var(--or-12);border-radius:10px;padding:10px 12px;font-weight:700;color:#5A4630}

/* Diagnostiquer */
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container app (min-width:640px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:96px;padding:14px 14px 14px 52px;border-radius:14px;border:2px solid var(--gl);background:var(--white);color:var(--txt);cursor:pointer;line-height:1.4;transition:border-color .2s,background .2s,box-shadow .2s}
.opt .mk{position:absolute;left:12px;top:14px;width:28px;height:28px;border-radius:50%;border:2px solid var(--gl);display:grid;place-items:center;font-weight:700;background:#fff;color:#fff}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-06);box-shadow:0 0 0 3px var(--blue-12)}
.opt[aria-pressed="true"] .mk{border-color:var(--blue);background:var(--blue)}
.opt[aria-pressed="true"] .mk::after{content:"●";font-size:.7rem}
.opt.ko{border-color:var(--orange);background:var(--or-12);cursor:default}
.opt.ko .mk{border-color:var(--orange);background:var(--orange)} .opt.ko .mk::after{content:"✕";font-size:.85rem}
.opt.ok{border-color:var(--green);background:var(--gr-15);cursor:default}
.opt.ok .mk{border-color:var(--green);background:var(--green)} .opt.ok .mk::after{content:"✓";font-size:.9rem}
.opt .badge{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:99px;padding:2px 8px}
.opt.ko .badge{background:#fff;color:var(--or-dk)} .opt.ok .badge{background:#fff;color:var(--gr-dk)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.fb .ic{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem}
.fb.ok{background:var(--gr-15);border-left:6px solid var(--green)} .fb.ok .ic{background:var(--green)}
.fb.ko{background:var(--or-12);border-left:6px solid var(--orange)} .fb.ko .ic{background:var(--orange)}
.fb h3{font-size:1.02rem;color:var(--txt)} .fb.ok h3{color:var(--gr-dk)} .fb.ko h3{color:var(--or-dk)}
.fb .body{min-width:0;flex:1}
@media (prefers-reduced-motion:no-preference){.fb.ok .ic{animation:pop .5s ease-out}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Comprendre */
.mix{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 12px}
.mix .chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px;font-weight:700;background:var(--blue);color:#fff}
.mix .chip svg{width:20px;height:20px}
.props{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
@container app (min-width:700px){.props{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prop{border-radius:14px;border:2px solid var(--gl);background:var(--white);overflow:hidden}
.prop.open{border-color:var(--blue)}
.prop>button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border:0;background:transparent;cursor:pointer;color:var(--txt);min-height:64px}
.prop .sym{flex:0 0 auto;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--blue-06);color:var(--blue);font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.7rem;font-weight:700}
.prop.open .sym{background:var(--blue);color:#fff}
.prop .nm{flex:1 1 auto;min-width:0;font-weight:700;color:var(--blue)}
.prop .st{flex:0 0 auto;font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 8px;background:var(--or-12);color:var(--or-dk)}
.prop.seen .st{background:var(--gr-15);color:var(--gr-dk)}
.prop .detail{padding:0 12px 12px;display:none}
.prop.open .detail{display:block;animation:rise .3s ease-out}
.mchain{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.mchain li{position:relative;display:flex;align-items:center;gap:8px;background:var(--blue-06);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.9rem;color:var(--blue)}
.mchain li+li{margin-top:22px}
.mchain li+li::before{content:"↓";position:absolute;top:-21px;left:18px;color:var(--orange);font-weight:700;font-size:1rem;line-height:20px}
.mchain li::after{content:"▲";color:var(--orange);margin-left:auto;font-size:.8rem}
.mchain.down li::after{content:"▼"}
.mchain li.lastdown::after{content:"▼"}
.lockmsg{font-weight:700;color:var(--or-dk);font-size:.9rem;margin-top:8px}

/* Chaîne cause → conséquence */
.chain{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:c}
.chain li{position:relative;display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--blue-25);border-radius:12px;padding:10px 12px;font-weight:700;color:var(--blue);opacity:1;transition:opacity .4s,transform .4s}
.chain li .k{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.85rem}
.chain li:first-child{border-color:var(--orange)} .chain li:first-child .k{background:var(--orange)}
.chain li:last-child{border-color:var(--orange);background:var(--or-12);color:var(--or-dk)} .chain li:last-child .k{background:var(--orange)}
.chain li+li{margin-top:26px}
.chain li+li::before{content:"";position:absolute;left:24px;top:-24px;width:3px;height:20px;background:var(--orange)}
.chain li+li::after{content:"";position:absolute;left:19px;top:-8px;border:6px solid transparent;border-top-color:var(--orange);border-bottom:0}
.chain.play li{opacity:0;transform:translateY(6px)}
.chain.play li.in{opacity:1;transform:none}
@container app (min-width:900px){
  .chain{flex-direction:row;align-items:stretch;gap:26px}
  .chain li{flex:1 1 0;min-width:0;flex-direction:column;align-items:flex-start;margin-top:0!important}
  .chain li+li::before{left:-22px;top:50%;width:18px;height:3px}
  .chain li+li::after{left:-8px;top:calc(50% - 5px);border:6px solid transparent;border-left-color:var(--orange);border-right:0}
}

/* Retenir */
.reflex{border-radius:14px;padding:14px 16px;background:var(--blue);color:#fff}
.reflex h3{color:#fff;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;display:flex;align-items:center;gap:8px}
.reflex p{font-size:1.02rem;font-weight:700}
.synth{margin-top:12px;border-left:6px solid var(--green);background:var(--gr-15);border-radius:12px;padding:12px 14px}
.synth h3{color:var(--gr-dk);font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
.done{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700;color:var(--gr-dk);font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em}
.done .ic{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.finished{margin-top:10px;font-weight:700;color:var(--gr-dk)}

/* Agrandissement du schéma (dans le cadre) */
.zoomed .fig{position:relative}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(79,94,116,.6);display:flex;align-items:flex-start;justify-content:center;padding:10px;overflow-y:auto}
.overlay .box{background:#fff;border-radius:14px;padding:10px;width:100%;max-width:900px}
.overlay .box .bar{display:flex;justify-content:flex-end;margin-bottom:6px}
.overlay .sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
.overlay svg{display:block;width:100%;min-width:640px;height:auto}

@container app (max-width:460px){
  .logo{height:50px}
  .block{padding:12px}
  .phase{font-size:.62rem;letter-spacing:0}
  .btn-row{flex-direction:column}
  .btn-row .btn{width:100%}
  .opt{padding:12px 12px 12px 48px}
}
@supports not (container-type:inline-size){
  @media (min-width:900px){.obs{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}@media (min-width:700px){.props{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:640px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:460px){.btn-row{flex-direction:column}.btn-row .btn{width:100%}.phase{font-size:.62rem}}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Langue ---------- */
var MAP={"fr-fr":"fr-FR","fr-be":"fr-BE","pt-pt":"pt-PT","nl-nl":"nl-NL","en-ie":"en-IE","es-es":"es-ES","it-it":"it-IT","pl-pl":"pl-PL","ro-ro":"ro-RO"};
var GEN={"fr":"fr-FR","pt":"pt-PT","nl":"nl-NL","en":"en-IE","es":"es-ES","it":"it-IT","pl":"pl-PL","ro":"ro-RO"};
function norm(code){if(!code)return null;var c=String(code).trim().toLowerCase().replace(/_/g,"-");if(!c)return null;
  if(MAP[c]&&I18N[MAP[c]])return MAP[c];var b=c.split("-")[0];return GEN[b]&&I18N[GEN[b]]?GEN[b]:null;}
function detect(){
  /* 1) Information explicite transmise dans l'adresse de l'activité (?lang=xx-XX ou ?locale=xx-XX) */
  try{var q=new URLSearchParams(location.search);var e=norm(q.get("lang")||q.get("locale")||q.get("language"));if(e)return {code:e,src:"url"};}catch(x){}
  /* 2) Langue du document parent, uniquement si le navigateur l'autorise (même origine) */
  try{var pl=window.parent&&window.parent!==window&&window.parent.document.documentElement.lang;var p=norm(pl);if(p)return {code:p,src:"parent"};}catch(x){}
  /* 3) Langues du navigateur */
  var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||navigator.userLanguage||""];
  for(var i=0;i<list.length;i++){var n=norm(list[i]);if(n)return {code:n,src:"navigator"};}
  return {code:"fr-FR",src:"default"};}

/* ---------- Schéma CVC (vectoriel, topologie simple et cohérente) ---------- */

function office(x,y,i,w){var col=w?"#F4951F":"#386FB6";return '<g><rect x="'+(x-30)+'" y="'+(y-16)+'" width="60" height="32" rx="7" fill="'+(w?"rgba(244,149,31,.14)":"rgba(56,111,182,.10)")+'" stroke="'+col+'" stroke-width="2"/>'+

  '<text x="'+(x+10)+'" y="'+(y+6)+'" text-anchor="middle" class="svg-l" style="font-size:16px;fill:'+(w?"#A85F06":"#386FB6")+'">'+(i+1)+'</text></g>';}

function valve(x,y,vert){return vert?'<polygon points="'+(x-8)+','+(y-8)+' '+(x-8)+','+(y+8)+' '+x+','+y+'" fill="#fff" stroke="#66778F" stroke-width="2"/><polygon points="'+(x+8)+','+(y-8)+' '+(x+8)+','+(y+8)+' '+x+','+y+'" fill="#fff" stroke="#66778F" stroke-width="2"/>':
  '<polygon points="'+(x-8)+','+(y-8)+' '+(x+8)+','+(y-8)+' '+x+','+y+'" fill="#fff" stroke="#66778F" stroke-width="2"/><polygon points="'+(x-8)+','+(y+8)+' '+(x+8)+','+(y+8)+' '+x+','+y+'" fill="#fff" stroke="#66778F" stroke-width="2"/>';}
function boiler(x,y,w,h){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="12" fill="#fff" stroke="#66778F" stroke-width="3"/><path d="M'+(x+w/2-15)+' '+(y+h*0.62)+' q15 -30 15 -48 q14 18 14 34 a15 15 0 0 1 -29 14z" fill="#F4951F"/>';}

var SUP="#F4951F",RET="#386FB6",WARM=[true,true,false,false];
/* Version paysage : chaudière à gauche, aller en haut, retour en bas, 4 émetteurs en parallèle */

var NARROW=false;function measure(){var m=$("main");return m?m.clientWidth<520:false;}

/* ---------- Interactions ---------- */
function scrollTo(id){var el=$(id);if(!el)return;var y=el.getBoundingClientRect().top+window.pageYOffset-8;try{window.scrollTo({top:y,behavior:REDUCE?"auto":"smooth"});}catch(e){window.scrollTo(0,y);}}
function focusEl(id){var el=$(id);if(el){el.setAttribute("tabindex","-1");el.focus({preventScroll:true});}}
function revealClue(i){if(S.clues[i])return;S.clues[i]=1;S.fresh["c"+i]=1;if(count(S.clues)>=5)S.fresh.ctx=1;render();}

  var b;

    if(el.tagName!=="BUTTON")el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}});});
  if(b=$("bZoom"))b.onclick=openZoom;
  if(b=$("bDiag"))b.onclick=function(){S.step=2;S.fresh.diag=1;render();scrollTo("sDiag");};
  document.querySelectorAll("[data-opt]").forEach(function(el){el.onclick=function(){if(S.solved||S.lastWrong!=null)return;var i=+el.getAttribute("data-opt");if(S.tried[i])return;S.sel=i;render();var v=$("bVal");if(v&&window.innerWidth<640)v.scrollIntoView&&0;};});
  if(b=$("bVal"))b.onclick=function(){if(S.sel==null)return;if(S.sel===CORRECT){S.solved=true;S.lastWrong=null;S.fresh.ok=1;}else{S.tried[S.sel]=1;S.lastWrong=S.sel;S.fresh.ko=1;}render();focusEl(S.solved?"bWhy":"bRetry");};
  if(b=$("bRetry"))b.onclick=function(){S.lastWrong=null;S.sel=null;render();var o=document.querySelector(".opt:not(:disabled)");if(o)o.focus();};
  if(b=$("bWhy"))b.onclick=function(){S.step=3;S.fresh.und=1;render();scrollTo("sUnd");};
  document.querySelectorAll("[data-prop]").forEach(function(el){el.onclick=function(){var i=+el.getAttribute("data-prop");S.openProp=S.openProp===i?null:i;S.props[i]=1;render();var x=document.querySelector('[data-prop="'+i+'"]');if(x)x.focus({preventScroll:true});};});
  if(b=$("bChain"))b.onclick=function(){if(count(S.props)<3)return;S.step=4;S.fresh.chain=1;S.playChain=true;render();scrollTo("sChain");playChain();};
  if(b=$("bReplay"))b.onclick=function(){S.playChain=true;render();playChain();};
  if(b=$("bRetain"))b.onclick=function(){S.step=5;S.fresh.ret=1;render();scrollTo("sRet");};
  if(b=$("bEnd"))b.onclick=function(){S.finished=true;render();try{window.parent&&window.parent!==window&&window.parent.postMessage({type:"syclef-activity-complete",activity:"diagnostic-reseau-hydraulique"},"*");}catch(e){}};
}
var chainTimer=null;

  (function step(){if(k<li.length){li[k].classList.add("in");k++;chainTimer=setTimeout(step,550);}else finishChain();})();}
