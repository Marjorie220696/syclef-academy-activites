<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HYD-07 | Composants, sécurité et maintenance – Relevez le défi de fin de module</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
:root{--k:1;--fs:calc(var(--k) * clamp(14px, 0.55vw + 0.85vh + 3px, 19px));--cyan:#55C2FB;--orange:#FA9035;--ok:#5EE0A0;--ko:#FF9A8C;--line:rgba(170,210,255,.30);--muted:#CFDDF2}
body{font-family:Calibri,Arial,sans-serif;color:#F4F8FF;background:#0b2350;font-size:var(--fs);line-height:1.3;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 80% 55% at 50% -8%,rgba(103,164,225,.55),transparent 60%),radial-gradient(ellipse 60% 50% at 88% 110%,rgba(85,194,251,.16),transparent 60%),linear-gradient(180deg,#1d5296 0%,#164382 35%,#0f3268 70%,#0a234c 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.defs{position:absolute;width:0;height:0;overflow:hidden}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #FFD27A;outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:middle}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,28px)}
.mod{margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.tbtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:.45em;padding:0 .9em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-weight:700;font-size:.9em}
.tbtn:hover{background:rgba(255,255,255,.15)}
.langbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:0 0 0 12px;min-height:44px}
.langbox label{font-weight:700;font-size:.9em}
select{font:inherit;color:#fff;background:#12396f;border:1px solid var(--line);border-radius:9px;min-height:44px;padding:0 6px;max-width:100%}

/* Progression */
.prog{display:flex;align-items:center;gap:clamp(8px,2vw,22px);padding:0 clamp(10px,2vw,28px) clamp(6px,1.1vh,12px)}
.prog[hidden],.nav[hidden]{display:none}
.ptxt{margin:0;font-weight:700;white-space:nowrap;font-size:.95em}
.dots{display:flex;list-style:none;margin:0;padding:0;flex:1;align-items:center;min-width:0}
.dots li{flex:1;display:flex;align-items:center;min-width:0}
.dots li:last-child{flex:0 0 auto}
.dot{width:clamp(20px,2.3vw,28px);height:clamp(20px,2.3vw,28px);border-radius:50%;display:grid;place-items:center;font-size:.72em;font-weight:700;border:2px solid rgba(207,221,242,.45);color:rgba(235,243,255,.75);background:rgba(255,255,255,.05);flex:none;transition:transform .25s}
.dot svg{width:70%;height:70%}
.dot.done{background:var(--cyan);border-color:var(--cyan);color:#0b2350}
.dot.cur{border-color:var(--orange);color:#fff;background:rgba(250,144,53,.28);transform:scale(1.2);box-shadow:0 0 0 4px rgba(250,144,53,.22)}
.seg{flex:1;height:3px;margin:0 4px;border-radius:2px;background:rgba(207,221,242,.22)}
.seg.done{background:var(--cyan)}

/* Zone principale */
main{min-height:0;overflow:hidden;padding:0 clamp(10px,2vw,28px);display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
main>*{min-height:0;min-width:0}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(0,12,45,.35),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fit{overflow:hidden}
.btn{min-height:44px;min-width:44px;padding:.45em 1.1em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.09);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1.1}
.btn:hover:not(:disabled){background:rgba(255,255,255,.17)}
.btn.pri{background:linear-gradient(180deg,#FFB06A,#FA9035);color:#0b1f3f;border-color:#FFC896;box-shadow:0 6px 18px rgba(250,144,53,.35)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#FFC08A,#FF9C45)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.big{font-size:1.2em;padding:.6em 2.1em}
h1,h2,h3{margin:0;line-height:1.15}

/* Introduction */
.intro{display:grid;place-items:center;min-height:0;padding-bottom:clamp(6px,1.4vh,16px)}
.icard{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1.5vh,16px);padding:clamp(12px,2.2vw,30px)}
.icard img{width:100%;height:auto;max-height:30vh;object-fit:cover;border-radius:14px;min-height:0;flex:0 1 auto;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.intro.c1 .icard img{max-height:16vh}
.intro.c2 .icard img{display:none}
h1{font-size:2.15em}
.lead{margin:0;font-size:1.15em;font-weight:700}
.case{margin:0;color:var(--muted);max-width:52em}
.meta{margin:0;font-size:.85em;border:1px solid var(--line);border-radius:999px;padding:.25em .9em;color:#E6F0FF}

/* Étape */
.step{display:grid;gap:clamp(8px,1.4vw,18px);grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-bottom:2px}
.visual{order:-1;display:flex;flex-direction:column;padding:clamp(6px,1vw,14px);min-height:0;min-width:0}
.qpanel{display:flex;flex-direction:column;gap:.5em;padding:clamp(10px,1.4vw,22px);min-height:0;min-width:0}
.stagewrap{flex:1;min-height:0;min-width:0;container-type:size;display:grid;place-items:center}
.stage{position:relative;width:min(100cqw,calc(100cqh * 5 / 3));height:min(100cqh,calc(100cqw * 3 / 5))}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.qhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.badge{background:var(--orange);color:#0b1f3f;font-weight:700;border-radius:999px;padding:.12em .7em;font-size:.8em;white-space:nowrap}
h2{font-size:1.3em}
.sit{margin:0;color:var(--muted)}
.sit .lab{display:inline-block;font-weight:700;color:#fff;font-size:.74em;text-transform:uppercase;letter-spacing:.06em;margin-inline-end:.5em;border:1px solid var(--line);border-radius:6px;padding:0 .4em;vertical-align:1px}
.q{margin:0;font-weight:700;font-size:1.08em;color:#fff}
.hint{margin:0;font-size:.86em;color:var(--muted)}
.inter{display:flex;flex-direction:column;gap:.42em}
.qpanel>*{flex-shrink:0}
.qpanel{container-type:inline-size}
@container (min-width:440px){.inter .arow{flex-direction:row;align-items:center;gap:.6em}.inter .arow label{flex:0 0 36%}.inter .arow select{flex:1;min-width:0}}
.step.c1 .hint{display:none}
.step.c3.answered .sit{display:none}
.opts{display:flex;flex-direction:column;gap:.42em}
.opt{display:flex;align-items:center;gap:.7em;text-align:start;width:100%;min-height:44px;padding:.42em .8em;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);line-height:1.2}
.opt:hover:not(:disabled){background:rgba(255,255,255,.13)}
.opt .rad{flex:none;width:1.15em;height:1.15em;border-radius:50%;border:2px solid #D7E8F8;display:grid;place-items:center}
.opt[aria-pressed="true"]{border:2px solid var(--cyan);background:rgba(85,194,251,.17)}
.opt[aria-pressed="true"] .rad::after{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--cyan)}
.opt .otx{flex:1}
.opt .mk{flex:none;display:flex}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:1.15em;font-weight:700;min-height:54px}
.tf .opt .otx{flex:0 1 auto}
.is-ok{border-color:var(--ok)!important;border-width:2px!important;background:rgba(94,224,160,.15)!important}
.is-ko{border-color:var(--ko)!important;border-width:2px!important;background:rgba(255,154,140,.14)!important}

/* Association */
.arow{display:flex;flex-direction:column;gap:.2em}
.arow label{font-weight:700;display:flex;align-items:center;gap:.4em}
.arow select{width:100%;min-height:44px;font-size:.92em}
.sheet{height:100%;display:flex;flex-direction:column;gap:.6em;justify-content:center;padding:.4em .6em}
.sh-t{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.85em;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:.35em}
.srow{display:grid;grid-template-columns:auto minmax(0,.8fr) minmax(0,1.4fr);align-items:center;gap:.7em;padding:.5em .6em;border:1px dashed rgba(207,221,242,.4);border-radius:12px;background:rgba(6,24,56,.35)}
.srow.filled{border-style:solid;border-color:rgba(85,194,251,.65)}
.sic svg{width:clamp(28px,3.4vw,46px);height:auto;display:block}
.sn{font-weight:700}
.sv{color:var(--muted);font-size:.9em}
.srow.filled .sv{color:#fff}

/* Saisie numérique */
.numl{font-weight:700}
.numrow{display:flex;align-items:center;gap:.6em}
.numrow input{font:inherit;font-size:1.25em;width:7em;min-height:48px;border-radius:10px;border:2px solid var(--line);background:rgba(4,20,48,.6);color:#fff;padding:0 .5em}
.numrow input::placeholder{color:#9FB4D3}
.unit{font-weight:700;font-size:1.1em}

/* Classement */
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.32em}
.ord li{display:flex;align-items:center;gap:.5em;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);padding:.12em .25em .12em .6em;min-height:44px}
.pos{font-weight:700;color:var(--muted);width:1.2em;flex:none}
.let{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--orange);color:#0b1f3f;font-weight:700;display:grid;place-items:center;font-size:.85em}
.ord .otx{flex:1;line-height:1.15}
.mv{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.09);display:grid;place-items:center}
.mv:hover:not(:disabled){background:rgba(255,255,255,.18)}
.mv:disabled{opacity:.3}
.ord .mk{display:flex;padding:0 .4em}

/* Étiquettes et zones */
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{min-height:44px;padding:.3em .95em;border-radius:999px;border:2px dashed rgba(207,221,242,.65);background:rgba(10,35,76,.65);font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none}
.chip:hover:not(:disabled){background:rgba(30,70,130,.8)}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--orange);background:rgba(250,144,53,.25)}
.chip .where{font-weight:400;color:var(--muted);font-size:.85em}
.chip.dragging{opacity:.4}
.chip:disabled{cursor:default;opacity:.75}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);padding:.3em .9em;border-radius:999px;border:2px solid var(--orange);background:#16437f;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.zbtn,.hs,.dz{position:absolute;border-radius:14px;display:flex;flex-direction:column;align-items:center;min-width:44px;min-height:44px}
.zbtn{border:2px dashed rgba(207,221,242,.5);background:transparent;justify-content:flex-start;padding-top:.4em}
.zbtn:hover:not(:disabled),.hs:hover:not(:disabled){background:rgba(85,194,251,.1)}
.zbtn[aria-pressed="true"],.hs[aria-pressed="true"]{border:3px solid var(--cyan);background:rgba(85,194,251,.13)}
.hs{border:2px dashed rgba(207,221,242,.6);background:transparent;justify-content:flex-end;padding:.15em}
.ztag{background:rgba(8,26,56,.9);border:1px solid var(--line);border-radius:999px;padding:.15em .75em;font-weight:700;font-size:.92em;display:inline-flex;gap:.35em;align-items:center;line-height:1.15;text-align:center}
.hs .ztag{font-size:.86em;padding:.12em .55em}
.selm{font-weight:400;color:var(--cyan)}
.zbtn:disabled,.hs:disabled,.dz:disabled{cursor:default}
.dz{border:2px dashed rgba(250,144,53,.8);background:rgba(8,26,56,.78);justify-content:center;text-align:center;padding:.15em .3em;font-size:.92em;line-height:1.1}
.dz .zn{font-size:.78em;color:var(--muted);font-weight:700;text-transform:uppercase;display:inline-flex;gap:.3em;align-items:center}
.dz .zv{font-weight:700}
.dz.filled{border-style:solid;border-color:var(--cyan)}
.dz.hover{background:rgba(250,144,53,.3)}

/* Retour pédagogique */
.fb{border-radius:14px;padding:.55em .85em;border:1px solid;display:flex;flex-direction:column;gap:.28em}
.fb.ok{border-color:rgba(94,224,160,.65);background:rgba(16,80,58,.5)}
.fb.ko{border-color:rgba(255,154,140,.65);background:rgba(96,30,42,.5)}
.fb-t{margin:0;font-weight:700;display:flex;align-items:center;gap:.4em;font-size:1.05em}
.fb-x,.fb-k{margin:0;font-size:.95em}
.fb-k .tag{display:inline-block;font-size:.74em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(85,194,251,.22);border:1px solid rgba(85,194,251,.55);border-radius:6px;padding:0 .4em;margin-inline-end:.45em;vertical-align:1px}

/* Résultat */
.result{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(8px,1.4vw,18px);padding-bottom:2px}
.rcard{padding:clamp(12px,1.6vw,24px);display:flex;flex-direction:column;gap:.6em;min-height:0}
.rs-top{display:flex;align-items:center;gap:1.2em;flex-wrap:wrap}
.ring{width:clamp(90px,20vh,170px);height:auto;flex:none}
.rnum{fill:#fff;font:700 28px Calibri,Arial,sans-serif}
.kpis{display:flex;flex-direction:column;gap:.5em}
.kpi{margin:0;display:flex;flex-direction:column}
.kpi span{color:var(--muted);font-size:.85em}
.kpi strong{font-size:1.6em;line-height:1.1}
.lvl{margin:0;font-weight:700;font-size:1.25em;display:flex;align-items:center;gap:.45em}
.lvl3{color:#A8F5CF}.lvl2{color:#FFD9A8}.lvl1{color:#FFC2B8}
.lmsg{margin:0;color:var(--muted)}
h3{font-size:.95em;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
.rsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.35em}
.rsteps li{display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.3em .1em;border-radius:10px;border:1px solid var(--line);font-size:.85em;font-weight:700}
.rsteps li.ok{border-color:rgba(94,224,160,.55)}
.rsteps li.ko{border-color:rgba(255,154,140,.55)}
.notions{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em}
.notions li{display:flex;gap:.55em;align-items:center}
.nn{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--ko);display:grid;place-items:center;font-size:.8em;font-weight:700}
.none{margin:0;color:var(--muted)}
.rbtns{margin-top:auto;display:flex;flex-wrap:wrap;gap:.6em;padding-top:.3em}

/* Revoir mes réponses */
.review{display:flex;flex-direction:column;gap:.55em;padding-bottom:2px}
.rgrid{display:grid;gap:.55em;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.pp9 .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.pp6 .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pp3 .rgrid{grid-template-columns:minmax(0,1fr)}
.rv{padding:.5em .75em;display:flex;flex-direction:column;gap:.22em;min-height:0;overflow:hidden;font-size:.86em}
.rv p{margin:0}
.rv.ok{border-color:rgba(94,224,160,.5)}
.rv.ko{border-color:rgba(255,154,140,.5)}
.rvh{display:flex;align-items:center;justify-content:space-between;gap:.4em}
.rv .st{display:inline-flex;align-items:center;gap:.3em;font-weight:700}
.rv h3{font-size:1em;text-transform:none;letter-spacing:0;color:#fff}
.lab2{font-weight:700;color:var(--cyan)}

/* Navigation */
.nav{display:flex;align-items:center;gap:10px;padding:clamp(6px,1.2vh,14px) clamp(10px,2vw,28px);padding-bottom:max(clamp(6px,1.2vh,14px),env(safe-area-inset-bottom))}
.nav .sp{flex:1;margin:0;font-size:.82em;color:var(--muted);text-align:center}

/* SVG */
.zonebg{fill:rgba(255,255,255,.035);stroke:rgba(207,221,242,.25);stroke-dasharray:5 6}
.pipe{fill:none;stroke:#4A3020;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.pipe-in{fill:none;stroke:#C0835A;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#8FE3FF;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:7 13;animation:flow 3.4s linear infinite;filter:url(#glow)}
.flow.fast{animation-duration:2.4s}
.flow.slow{stroke:#7EE8D2;stroke-width:7;stroke-dasharray:12 8;animation-duration:9s}
.flow.weak{stroke-dasharray:3 17;animation-duration:6s}
.flow.big{stroke-width:5}
.flow.still{animation:pulse 5s ease-in-out infinite;stroke-dasharray:none;opacity:.55;stroke-width:3}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{50%{opacity:.95}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drop{animation:drop 2.4s linear infinite;opacity:0}
.drop.d2{animation-delay:-.8s}.drop.d3{animation-delay:-1.6s}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
.lbl{fill:#EEF5FF;font:700 19px Calibri,Arial,sans-serif;paint-order:stroke;stroke:#0a2148;stroke-width:5px;stroke-linejoin:round}
.tagt{fill:#fff;font:700 18px Calibri,Arial,sans-serif}
.lett{fill:#0b1f3f;font:700 21px Calibri,Arial,sans-serif}

@media (min-aspect-ratio:1/1) and (min-width:561px){.step.c2.answered .sit{display:none}}
/* Écrans portrait / étroits : visuel au-dessus de la question */
@media (max-aspect-ratio:1/1),(max-width:560px){
  .step{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,34%) minmax(0,1fr)}
  .step.c1{grid-template-rows:minmax(0,25%) minmax(0,1fr)}
  .step.c2.answered,.step.c3.answered{grid-template-rows:minmax(0,1fr)}
  .step.c2.answered .visual,.step.c3.answered .visual{display:none}
  .result{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ring{width:clamp(80px,14vh,130px)}
  .rsteps{grid-template-columns:repeat(9,minmax(0,1fr))}
}
@media (max-width:560px){
  .mod{display:none}
  .top{justify-content:flex-end}
  .nav .btxt,.tbtn .btxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav .sp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nav{justify-content:space-between}
  .ptxt{font-size:.85em}
  .rsteps li{font-size:.75em}
  .rsteps li .ic{width:1em;height:1em}
  h1{font-size:1.7em}
}
@media (max-height:500px){
  .top{padding-top:4px;padding-bottom:4px}
  .prog{padding-bottom:4px}
  .nav{padding-top:4px;padding-bottom:4px}
  .icard img{max-height:22vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

/* ===== Compléments HYD-02 ===== */
.hero{width:100%;height:auto;max-height:30vh;border-radius:14px;min-height:0;flex:0 1 auto;box-shadow:0 10px 30px rgba(0,10,40,.4)}
.intro.c1 .hero{max-height:16vh}
.intro.c2 .hero{display:none}
.fx{white-space:nowrap;font-family:Calibri,Arial,sans-serif;font-weight:700;color:#FFE3B8}
.fx sub{font-size:.72em;line-height:0}

.flow.slow2{animation-duration:6s}

.fill{transition:y .5s ease,height .5s ease}
.rsteps.n8{grid-template-columns:repeat(8,minmax(0,1fr))}
.pp8 .rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.pp4 .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}

.sy{white-space:nowrap}
.sy sub{font-size:.72em;line-height:0}
.dz .zv{font-size:1.15em}

.lbl.small2{font-size:17px;fill:#EEF5FF}
.lbl.val{fill:#FFE3B8}
.pline{fill:none;stroke:#FFD27A;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.curve{fill:none;stroke:#55C2FB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.curve.dash{stroke-dasharray:6 7;opacity:.8}
.colr{fill:url(#gSteel);stroke:#5E7290;stroke-width:1.5}
.hl{fill:none;stroke-width:24;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.hlA{stroke:#55C2FB}
.hlB{stroke:#FFA24D;animation:hlp 2.4s ease-in-out infinite}
@keyframes hlp{50%{opacity:.45}}
.heat{animation:heat 2.6s ease-in-out infinite}
@keyframes heat{50%{transform:translateY(-4px);opacity:.55}}
.turb,.turb.d2,.turb.d3{animation:spin 2.8s linear infinite;transform-box:fill-box;transform-origin:center}
.turb.d2{animation-duration:2.1s}.turb.d3{animation-duration:3.4s}

.step.c3:not(.needvis){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.step.c3:not(.needvis) .visual{display:none}
/* Panneau large (paysage, grand écran) : lignes compactes */
.arows{display:flex;flex-direction:column;gap:.42em}
.step.c2 .inter .arow{flex-direction:row;align-items:center;gap:.6em}.step.c2 .inter .arow label{flex:0 0 38%}.step.c2 .inter .arow select{flex:1;min-width:0}
@container (min-width:700px){
 .arows{display:grid;grid-template-columns:1fr 1fr;gap:.42em 1em}
 .grp{flex-direction:row;align-items:center;gap:.8em}.grp .glab{flex:0 0 34%}.grp .segs{flex:1}
 .checks{grid-template-columns:1fr 1fr 1fr}
 .opts{display:grid;grid-template-columns:1fr 1fr}
}
/* Paysage de faible hauteur (téléphone couché) : progression et outils sur une seule ligne */
@media (max-height:500px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto}
  .prog{grid-column:1;grid-row:1;padding-top:4px;padding-bottom:4px}
  .top{grid-column:2;grid-row:1}
  .top .mod{display:none}
  main,.nav{grid-column:1/-1}
}
/* Paliers compacts : mise en grille dès que le panneau le permet */
@container (min-width:560px){
 .step.c2 .arows{display:grid;grid-template-columns:1fr 1fr;gap:.42em 1em}
 .step.c2 .grp{flex-direction:row;align-items:center;gap:.8em}.step.c2 .grp .glab{flex:0 0 34%}.step.c2 .grp .segs{flex:1}
 .step.c2 .opts{display:grid;grid-template-columns:1fr 1fr}
}
.step.c3 .checks{grid-template-columns:1fr 1fr}
.step.c3.answered .q{display:none}
.step.c3 .grp{padding:.2em .5em}.step.c3 .inter,.step.c3 .arows,.step.c3 .checks,.step.c3 .opts{gap:.28em}.step.c3 .qpanel{gap:.35em}

.dz .zn{font-size:1em;color:#fff}.dz .zv{font-size:1.05em;color:var(--cyan)}.dz.filled .zv{color:#fff}
/* ===== Compléments HYD-07 ===== */
.rsteps.n7{grid-template-columns:repeat(7,minmax(0,1fr))}

.pp8 .rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}

.dzrows{display:flex;flex-direction:column;gap:.38em}
.dz.row{position:static;flex-direction:row;align-items:center;justify-content:space-between;gap:.6em;width:100%;min-height:44px;padding:.3em .7em;text-align:start;border-radius:12px;font-size:1em}
.dz.row .zn{flex:0 1 48%;font-size:.92em;color:#fff;text-transform:none}

.dz.row.filled .zv{color:#fff}
@container (max-width:380px){.dz.row{flex-direction:column;align-items:flex-start;gap:.1em}.dz.row .zv{text-align:start}}

.hs.hm{justify-content:flex-start;align-items:flex-start;padding:.2em;border-color:rgba(207,221,242,.45)}
.hs.hm .ztag{font-size:1em;min-width:1.9em;justify-content:center;background:rgba(8,26,56,.92)}

.hs.hm[aria-pressed="true"] .ztag{background:var(--orange);color:#0b1f3f;border-color:#FFC896}
.hs.hm.is-miss{background:rgba(94,224,160,.08)!important}
.legend{display:flex;flex-direction:column;gap:.25em}
.leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.2em .8em;font-size:.92em}
.leg li{display:flex;align-items:center;gap:.4em;color:var(--muted)}
.leg li.on{color:#fff;font-weight:700}
.lbox{flex:none;width:1.05em;height:1.05em;border-radius:4px;border:2px solid #D7E8F8;display:grid;place-items:center;color:#0b2350}
.leg li.on .lbox{background:var(--orange);border-color:var(--orange)}
.lbox svg{width:90%;height:90%}
/* Classement : lettres de repères */
.ord .let{background:#FFD27A}
/* SVG HYD-07 */
.obsr{fill:rgba(8,26,56,.92);stroke:#55C2FB;stroke-width:1.5}
.obsr.w{stroke:#FA9035;stroke-width:2.2}
.obst{fill:#fff;font:700 15px Calibri,Arial,sans-serif}
.lbl.hd{fill:#8FE3FF}
.bub.mb{animation-duration:1.8s}
/* Paliers compacts HYD-07 : zones de dépôt et classement en grille quand le panneau est large */
@container (min-width:560px){
 .step.c2 .dzrows,.step.c3 .dzrows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35em}
 .step.c2 .dz.row,.step.c3 .dz.row{flex-direction:column;align-items:flex-start;justify-content:center;gap:.1em}
 .step.c2 .dz.row .zv,.step.c3 .dz.row .zv{text-align:start}
 .step.c3 .ord{display:grid;grid-template-columns:1fr 1fr;gap:.3em .6em}
}
.dz.row .zn,.dz.row .zv{min-width:0;overflow-wrap:anywhere}

 .step.c3.answered{grid-template-columns:minmax(0,1fr)}
 .step.c3.answered .visual{display:none}
}
.gsel{display:flex;align-items:center;gap:.35em}
.gsel.exp{color:var(--ok)}
.leg li .ic{width:1em;height:1em}

   alt: "Circuit fermé : un générateur, un départ avec un point haut, un émetteur, un retour avec une pompe. Symptôme 1 : une poche d'air au point haut. Symptôme 2 : des microbulles entraînées dans le départ. Symptôme 3 : des particules sombres dans le retour." },
 { title: "Filtration et clapets : contrôle et sens de montage",
   sit: "Sur une branche, le débit est très faible et le Δp mesuré sur le filtre à tamis est faible lui aussi. Vous examinez le montage.",
   q: "Menez le diagnostic en deux décisions.",
   groups: [{ label: "1. Sur le schéma, sélectionnez l'organe monté à contresens.", opts: ["Vanne d'isolement", "Filtre à tamis", "Clapet anti-retour"] },
     { label: "2. Ce Δp faible prouve-t-il que le filtre est propre ?", opts: ["Oui : un Δp faible signifie un filtre propre", "Non : comparer à débit similaire et au fabricant", "Non : un Δp faible signifie un filtre colmaté"] }],
   svg: { flow: "Sens d'écoulement", low: "Débit très faible", dp: "Δp faible", up: "Amont", dn: "Aval" },
   ok: "La flèche du clapet s'oppose au sens d'écoulement : un clapet inversé peut bloquer le débit. Le Δp d'un filtre dépend aussi du débit : à débit très faible, un Δp faible ne prouve pas que le filtre est propre. Comparez à débit similaire et aux valeurs du fabricant.",
   ko: "Comparez chaque flèche de corps au sens d'écoulement : seul le clapet est à contresens, ce qui peut bloquer le débit. Le Δp d'un filtre augmente quand il se charge, mais dépend aussi du débit : à débit très faible, une valeur faible ne prouve rien.",
   key: "Avant d'ouvrir un filtre ou un clapet : isoler, consigner les sources d'énergie, vérifier la température, ramener à pression nulle et prévoir la récupération du fluide.",
   notion: "Filtration et clapets",
   alt: "Conduite parcourue de gauche à droite, avec un débit très faible. Trois organes : une vanne d'isolement ; un filtre à tamis dont la flèche suit l'écoulement, encadré de manomètres amont et aval indiquant un Δp faible ; un clapet anti-retour dont la flèche de corps pointe en sens inverse de l'écoulement." },
 { title: "Qualité d'eau et glycol : paramètres et risques",
   sit: "Le circuit d'eau glacée doit être protégé contre le gel. L'exploitant propose d'ajouter du glycol sans recalcul.",
   q: "Sélectionnez les effets du glycol à prendre en compte.",
   items: ["Protège contre le gel selon sa nature et sa concentration", "Augmente généralement la viscosité et les pertes de charge", "Modifie chaleur massique, masse volumique et puissance transportée", "Peut se dégrader avec le temps ou une température excessive", "Supprime tout risque de corrosion dans le circuit", "Peut être rejeté à l'égout après vidange, sans autorisation", "Dispense du suivi de la qualité d'eau et des inhibiteurs"],
   svg: { water: "Eau", gly: "Eau glycolée", ana: "Analyse du fluide",
     p1: "pH", r1: "Corrosion, matériaux", p2: "Conductivité", r2: "Minéralisation, contamination", p3: "Dureté / sels", r3: "Entartrage, dépôts",
     p4: "Oxygène dissous", r4: "Corrosion, boues", p5: "Inhibiteurs", r5: "Protection insuffisante", p6: "Glycol", r6: "Concentration, état" },
   ok: "Le glycol protège contre le gel selon sa nature et sa concentration, augmente généralement la viscosité et les pertes de charge, modifie chaleur massique, masse volumique et puissance transportée, et peut se dégrader. Il ne supprime ni la corrosion ni la maintenance, et ne se rejette pas à l'égout sans autorisation.",
   ko: "Ajouter du glycol modifie le débit, les pertes de charge et la puissance : il faut recalculer. Il protège du gel selon sa concentration et peut se dégrader. En revanche, il ne supprime pas la corrosion, n'exempte pas du suivi des inhibiteurs et ne se rejette pas à l'égout sans autorisation.",
   key: "Contrôlez la concentration, l'état et la température de protection du glycol. Identifiez le produit, consultez sa fiche de données de sécurité, portez les EPI et récupérez le fluide.",
   notion: "Qualité d'eau et glycol",
   alt: "Deux échantillons : eau et eau glycolée, avec un symbole de gel. Sous les flacons, deux conduites : l'eau glycolée y circule plus lentement. À droite, une fiche d'analyse du fluide : pH, corrosion et matériaux ; conductivité, minéralisation ; dureté, entartrage ; oxygène dissous, corrosion et boues ; inhibiteurs, protection insuffisante ; glycol, concentration et état." },
 { title: "Inspection virtuelle : détection d'anomalies",
   sit: "Boucle d'eau glacée avant remise : vous parcourez les huit repères A à H et notez les observations affichées sur le schéma.",
   q: "Sélectionnez sur le schéma tous les repères qui présentent une anomalie.",
   items: ["A · Vase d'expansion", "B · Soupape de sécurité", "C · Manomètre", "D · Purgeur automatique", "E · Pot à boues magnétique", "F · Filtre à tamis", "G · Clapet anti-retour", "H · Disconnecteur"],
   spots: ["Repère A, vase d'expansion : la vanne entre le réseau et le vase est fermée.", "Repère B, soupape de sécurité : raccordée, mais son évacuation est obturée par un bouchon.", "Repère C, manomètre : lisible, valeur cohérente.", "Repère D, purgeur automatique au point haut.", "Repère E, pot à boues magnétique : accessible.", "Repère F, filtre à tamis : Δp de 35 kPa au débit nominal, contre 8 kPa après nettoyage dans le dossier de référence.", "Repère G, clapet anti-retour : flèche dans le sens d'écoulement.", "Repère H, disconnecteur sur la ligne de remplissage d'eau potable."],
   svg: { oA: "Vanne fermée", oB: "Évacuation bouchée", oC: "Lecture cohérente", oE: "Accessible", oF1: "Δp : 35 kPa", oF2: "Réf. : 8 kPa", fill: "Eau potable" },
   ok: "Trois anomalies. A : la vanne du vase est fermée, il n'absorbe plus la dilatation. B : l'évacuation obturée neutralise la protection contre la surpression. F : 35 kPa au débit nominal contre 8 kPa après nettoyage, le filtre est encrassé. Le manomètre et le pot à boues sont conformes.",
   ko: "Les anomalies sont A, B et F : vase isolé par une vanne fermée, soupape dont l'évacuation est bouchée, filtre à 35 kPa au débit nominal contre 8 kPa de référence. Un manomètre lisible et cohérent, ou un pot à boues accessible, ne sont pas des anomalies.",
   key: "Comparez une mesure à une référence prise dans les mêmes conditions : ici, le Δp du filtre au débit nominal face à la valeur après nettoyage du dossier.",
   notion: "Inspection et diagnostic",
   alt: "Boucle d'eau glacée fermée avec une pompe et huit repères. A : vase d'expansion, vanne de raccordement fermée. B : soupape de sécurité, évacuation bouchée. C : manomètre, lecture cohérente. D : purgeur automatique au point haut. E : pot à boues magnétique, accessible. F : filtre à tamis, Δp 35 kPa, référence 8 kPa. G : clapet anti-retour. H : disconnecteur sur l'arrivée d'eau potable." },
 { title: "Transfert terrain : recommandations et vérification",
   sit: "Inspection terminée : soupape obturée, vase isolé et filtre encrassé. Vous complétez la fiche de contrôle avant la remise de l'installation.",
   q: "Classez chaque action dans son niveau de priorité. Une carte est un piège.",
   zones: ["1 · Danger immédiat", "2 · Défaut de fonctionnement", "3 · Traçabilité"],
   labels: ["Sécuriser : soupape obturée, vase isolé", "Diagnostiquer et nettoyer le filtre", "Documenter constats et contrôles", "Modifier le tarage de la soupape"],
   svg: { title: "Fiche de contrôle", h1: "Relevés terrain", c1: "Pression à froid et à chaud", c2: "État du vase d'expansion", c3: "Δp du filtre, au débit connu", c4: "Concentration de glycol, si applicable", c5: "Sécurités accessibles, non neutralisées, évacuées", h2: "Traçabilité", t1: "Anomalie", t2: "Priorité", t3: "Action", t4: "Résultat" },
   ok: "Sécurité avant performance : une protection neutralisée est un danger immédiat, donc soupape obturée et vase isolé passent en priorité 1. Le filtre encrassé est un défaut de fonctionnement, à diagnostiquer et nettoyer selon la procédure. Enfin, on documente constats et contrôles après remise en état. Le tarage d'une soupape ne se modifie jamais.",
   ko: "Une protection neutralisée prime sur une perte de charge : la mise en sécurité de la soupape et du vase vient en 1, le filtre en 2, la documentation des constats et contrôles en 3. Modifier le tarage d'une soupape est interdit : c'est le piège.",
   key: "Sur le terrain, relevez la pression à froid et à chaud, l'état du vase, le Δp du filtre et la concentration de glycol si applicable ; tracez chaque anomalie, sa priorité, l'action et le résultat du contrôle.",

  introMeta: "7 steps · 1 decision per step · one common inspection",
  introAlt: "Illustration: sealed hydronic circuit fitted with a diaphragm expansion vessel, a safety relief valve, a pressure gauge, an air vent, a strainer and a dirt separator, next to an inspection checklist with tick boxes.",

  }, steps: [
 { title: "The expansion vessel: role and checks",
   sit: "System pressure rises sharply when hot. Before topping up, you check the diaphragm vessel, which absorbs the change in fluid volume.",
   q: "Put the operations in order to check the vessel pre-charge pressure.",
   order: ["Isolate the water side of the vessel", "Drain the water side locally", "Check the water side is at zero pressure", "Measure the pre-charge on the gas side"],
   svg: { gas: "Gas side", water: "Water side", mb: "Diaphragm", net: "To system", obsT: "Finding", obs1: "Sharp pressure", obs2: "rise when hot" },
   ok: "First isolate the water side, drain it locally and confirm it is at zero pressure; only then is the pre-charge measured on the gas side, following the manufacturer's procedure. A sharp rise when hot may reveal an undersized vessel, a lost pre-charge or a failed diaphragm.",
   ko: "A gas-side reading is only reliable once the water side is isolated and brought to zero pressure: otherwise, system pressure distorts the reading. Expected order: isolate (C), drain locally (D), check zero pressure (B), then measure on the gas side (A).",
   key: "Never assume the water side is depressurised. The fill pressure must guarantee the minimum pressure at the high point, while remaining compatible with the vessel and the relief valve.",
   notion: "Expansion vessel",
   alt: "Cross-section of a diaphragm expansion vessel: gas side at the top with the charging valve, marker A; diaphragm; water side at the bottom, connected to the system. On the connection: water-side pressure gauge, marker B; isolating valve, marker C; drain cock, marker D. Finding shown: sharp pressure rise when hot." },
 { title: "Safety devices: relief valve, gauge, thermometer",
   sit: "On the boiler flow, you check five safety and monitoring devices before handing over the installation.",
   q: "Match each identified device to its role.",
   items: ["1 · Safety relief valve", "2 · Pressure gauge", "3 · Thermometer / limit stat", "4 · Pressure switch", "5 · Backflow preventer"],
   choices: ["Limits the maximum pressure", "Allows pressure monitoring", "Monitors or limits temperature", "Trips at a set pressure threshold", "Protects the drinking water supply"],
   svg: { gen: "Boiler", out: "Discharge", fill: "Mains water" },
   ok: "The relief valve limits the maximum pressure, the gauge allows the pressure to be monitored, the thermometer or limit stat monitors or limits temperature, the pressure switch trips at a pressure threshold and the backflow preventer protects the drinking water supply during filling.",
   ko: "Start from what each device monitors: the relief valve limits the maximum pressure; the gauge displays pressure so it can be monitored; the pressure switch trips at a threshold. The thermometer or limit stat acts on temperature and the backflow preventer protects drinking water.",
   key: "A discharging relief valve is not necessarily faulty: it is a symptom. Look for overpressure or a vessel fault; never block its discharge and never alter its set pressure.",
   notion: "Safety devices",
   alt: "Boiler flow fitted with five numbered devices: 1, safety relief valve with visible discharge to a tundish; 2, pressure gauge; 3, thermometer; 4, electrically wired pressure switch; 5, backflow preventer on the filling line connected to the mains water supply." },
 { title: "Air and dirt management: venting and separators",
   sit: "After refilling, gurgling appears at the high point, the flow is unstable and the return water is dark, loaded with particles from a steel pipework system.",
   q: "Place the suitable device on each symptom. One card is a trap.",
   zones: ["1 · Air collected at the high point", "2 · Microbubbles carried by the flow", "3 · Ferromagnetic particles in return"],
   labels: ["Automatic air vent", "Microbubble separator", "Magnetic dirt separator", "Safety relief valve"],
   svg: { gen: "Boiler", dep: "Flow", ret: "Return", term: "Emitter" },
   ok: "The automatic air vent releases air collected at the high point; the separator removes entrained air and microbubbles; the magnetic dirt separator slows the fluid and captures ferromagnetic particles in the return, upstream of sensitive equipment. These devices are complementary.",
   ko: "The relief valve limits the maximum pressure: it deals with neither air nor dirt. The air vent releases air collected at the high point, the separator removes entrained microbubbles and the magnetic dirt separator captures ferromagnetic particles in the return.",
   key: "Before opening an air vent or a dirt separator: isolate if provided, stop the equipment concerned, let it cool and depressurise as per the instructions. Risk of burns and spray.",
   notion: "Air and dirt",
   alt: "Sealed circuit: a boiler, a flow pipe with a high point, an emitter, a return pipe with a pump. Symptom 1: an air pocket at the high point. Symptom 2: microbubbles carried in the flow. Symptom 3: dark particles in the return." },
 { title: "Strainers and check valves: checks and direction",
   sit: "On one branch, the flow rate is very low and the Δp measured across the Y-strainer is low too. You examine the installation.",
   q: "Carry out the diagnosis in two decisions.",
   groups: [{ label: "1. On the diagram, select the device fitted the wrong way round.", opts: ["Isolating valve", "Y-strainer", "Check valve"] },
     { label: "2. Does this low Δp prove the strainer is clean?", opts: ["Yes: a low Δp means a clean strainer", "No: compare at similar flow and with data", "No: a low Δp means a blocked strainer"] }],
   svg: { flow: "Flow direction", low: "Very low flow", dp: "Low Δp", up: "Inlet", dn: "Outlet" },
   ok: "The check valve arrow opposes the flow direction: a reversed check valve can block the flow. A strainer's Δp also depends on flow rate: at very low flow, a low Δp does not prove the strainer is clean. Compare at similar flow and with the manufacturer's values.",
   ko: "Compare each body arrow with the flow direction: only the check valve is reversed, which can block the flow. A strainer's Δp rises as it fills with debris, but also depends on flow rate: at very low flow, a low value proves nothing.",
   key: "Before opening a strainer or a check valve: isolate, lock out energy sources, check the temperature, bring to zero pressure and plan to collect the fluid.",
   notion: "Strainers and check valves",
   alt: "Pipe with flow from left to right, at a very low flow rate. Three devices: an isolating valve; a Y-strainer whose arrow follows the flow, with upstream and downstream gauges showing a low Δp; a check valve whose body arrow points against the flow." },
 { title: "Water quality and glycol: parameters and risks",
   sit: "The chilled water circuit must be protected against freezing. The operator suggests adding glycol without recalculation.",
   q: "Select the effects of glycol that must be taken into account.",
   items: ["Protects against freezing depending on its type and concentration", "Generally increases viscosity and pressure losses", "Changes specific heat, density and transported capacity", "Can degrade over time or with excessive temperature", "Eliminates any risk of corrosion in the circuit", "Can be poured down the drain after draining, without permit", "Removes the need to monitor water quality and inhibitors"],
   svg: { water: "Water", gly: "Glycol mix", ana: "Fluid analysis",
     p1: "pH", r1: "Corrosion, materials", p2: "Conductivity", r2: "Mineral content, contamination", p3: "Hardness / salts", r3: "Scaling, deposits",
     p4: "Dissolved oxygen", r4: "Corrosion, sludge", p5: "Inhibitors", r5: "Insufficient protection", p6: "Glycol", r6: "Concentration, state" },
   ok: "Glycol protects against freezing depending on its type and concentration, generally increases viscosity and pressure losses, changes specific heat, density and transported capacity, and can degrade. It eliminates neither corrosion nor maintenance, and must not be poured down the drain without a permit.",
   ko: "Adding glycol changes flow rate, pressure losses and capacity: a recalculation is required. It protects against freezing depending on concentration and can degrade. However, it does not eliminate corrosion, does not remove the need to monitor inhibitors and must not go down the drain without a permit.",
   key: "Check the glycol's concentration, condition and freeze protection temperature. Identify the product, consult its safety data sheet, wear PPE and collect the fluid.",
   notion: "Water quality and glycol",
   alt: "Two samples: water and glycol mix, with a frost symbol. Below the bottles, two pipes: the glycol mix flows more slowly. On the right, a fluid analysis sheet: pH, corrosion and materials; conductivity, mineral content; hardness, scaling; dissolved oxygen, corrosion and sludge; inhibitors, insufficient protection; glycol, concentration and condition." },
 { title: "Virtual inspection: fault detection",
   sit: "Chilled water loop before handover: you go through the eight markers A to H and note the observations shown on the diagram.",
   q: "Select on the diagram all the markers that show a fault.",
   items: ["A · Expansion vessel", "B · Safety relief valve", "C · Pressure gauge", "D · Automatic air vent", "E · Magnetic dirt separator", "F · Y-strainer", "G · Check valve", "H · Backflow preventer"],
   spots: ["Marker A, expansion vessel: the valve between the system and the vessel is closed.", "Marker B, safety relief valve: connected, but its discharge is blocked by a plug.", "Marker C, pressure gauge: readable, consistent value.", "Marker D, automatic air vent at the high point.", "Marker E, magnetic dirt separator: accessible.", "Marker F, Y-strainer: Δp of 35 kPa at nominal flow, versus 8 kPa after cleaning in the reference file.", "Marker G, check valve: arrow in the flow direction.", "Marker H, backflow preventer on the mains water filling line."],
   svg: { oA: "Valve closed", oB: "Discharge plugged", oC: "Consistent reading", oE: "Accessible", oF1: "Δp: 35 kPa", oF2: "Ref.: 8 kPa", fill: "Mains water" },
   ok: "Three faults. A: the vessel valve is closed, so it no longer absorbs expansion. B: the blocked discharge defeats the overpressure protection. F: 35 kPa at nominal flow versus 8 kPa after cleaning, the strainer is fouled. The gauge and the dirt separator are compliant.",
   ko: "The faults are A, B and F: vessel isolated by a closed valve, relief valve with a plugged discharge, strainer at 35 kPa at nominal flow versus an 8 kPa reference. A readable, consistent gauge or an accessible dirt separator are not faults.",
   key: "Compare a measurement with a reference taken under the same conditions: here, the strainer Δp at nominal flow against the after-cleaning value in the file.",
   notion: "Inspection and diagnosis",
   alt: "Sealed chilled water loop with a pump and eight markers. A: expansion vessel, connection valve closed. B: safety relief valve, discharge plugged. C: pressure gauge, consistent reading. D: automatic air vent at the high point. E: magnetic dirt separator, accessible. F: Y-strainer, Δp 35 kPa, reference 8 kPa. G: check valve. H: backflow preventer on the mains water inlet." },
 { title: "Field transfer: recommendations and verification",
   sit: "Inspection complete: relief valve blocked, vessel isolated and strainer fouled. You complete the inspection sheet before handing over the installation.",
   q: "Sort each action into its priority level. One card is a trap.",
   zones: ["1 · Immediate danger", "2 · Operating fault", "3 · Traceability"],
   labels: ["Make safe: blocked valve, isolated vessel", "Diagnose and clean the strainer", "Document findings and checks", "Change the relief valve set pressure"],
   svg: { title: "Inspection sheet", h1: "Site readings", c1: "Cold and hot pressure", c2: "Expansion vessel condition", c3: "Strainer Δp, at known flow", c4: "Glycol concentration, if applicable", c5: "Safety devices accessible, not defeated, discharged", h2: "Traceability", t1: "Fault", t2: "Priority", t3: "Action", t4: "Result" },
   ok: "Safety before performance: a defeated protection is an immediate danger, so the blocked relief valve and isolated vessel are priority 1. The fouled strainer is an operating fault, to be diagnosed and cleaned following the procedure. Finally, findings and checks are documented after repair. A relief valve's set pressure is never altered.",
   ko: "A defeated protection takes precedence over a pressure loss: making the relief valve and vessel safe comes 1st, the strainer 2nd, documenting findings and checks 3rd. Changing a relief valve's set pressure is forbidden: that is the trap.",
   key: "On site, record the cold and hot pressure, the vessel condition, the strainer Δp and the glycol concentration if applicable; log each fault, its priority, the action and the check result.",
   notion: "Transfer and traceability",
   alt: "Inspection sheet. Site readings to tick: cold and hot pressure; expansion vessel condition; strainer Δp at known flow; glycol concentration if applicable; safety devices accessible, not defeated and discharged. Four-column traceability table: fault, priority, action, result." }
 ]},

function initResp() {
  S.resp = CFG.map(c => c.type === "drag" ? c.correct.map(() => null) : c.type === "assoc" ? c.correct.map(() => "") :
    c.type === "groups" ? c.groups.map(() => null) : (c.type === "multi" || c.type === "hsmulti") ? [] : c.type === "order" ? c.init.slice() : null);
  S.done = Array(N).fill(false); S.ok = Array(N).fill(false); S.sel = null; S.page = 0;

const U = k => L[S.lang].ui[k];
const ST = i => L[S.lang].steps[i];
const fmtT = (s, o) => s.replace(/\{(\w)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nv = s => (S.lang === "en" ? s.replace(/(\d),(\d)/g, "$1.$2") : s);
const pctTxt = p => (["fr", "es", "de", "pt"].indexOf(S.lang) >= 0 ? p + NB + "%" : p + "%");
/* Aucun jeton de formule dans HYD-07 : symboles (Δp, pH) et unités (kPa, °C, %) restent écrits tels quels dans les textes */
const tx = s => esc(s);
const plain = s => String(s);

function complete(i) {
  const c = CFG[i], r = S.resp[i];
  switch (c.type) {
    case "drag": return r.every(v => v !== null);
    case "assoc": return r.every(v => v !== "");
    case "groups": return r.every(v => v !== null);
    case "multi": case "hsmulti": return r.length > 0;
    case "order": return true;
    default: return r !== null;
  }
}
function check(i) {
  const c = CFG[i], r = S.resp[i];
  switch (c.type) {
    case "drag": case "order": return r.join() === c.correct.join();
    case "assoc": return r.every((v, k) => Number(v) === c.correct[k]);
    case "groups": return r.every((v, k) => v === c.groups[k].correct);
    case "multi": case "hsmulti": return r.length === c.correct.length && c.correct.every(x => r.indexOf(x) >= 0);
    default: return r === c.correct;
  }
}
function groupOpts(i, g) {
  const c = CFG[i], st = ST(i);
  if (st.groups[g].opts) return st.groups[g].opts;
  return c.groups[g].vals.map(nv);
}
function singleOpts(i) { const c = CFG[i]; return c.vals ? c.vals.map(v => (c.pre || "") + nv(v)) : ST(i).opts; }
function ansText(i, r, isCorrect) {
  const c = CFG[i], st = ST(i);
  switch (c.type) {
    case "single": return r == null ? null : singleOpts(i)[r];
    case "valpick": return r == null ? null : (c.pre || "") + nv(c.vals[r]);
    case "assoc": return r.every(v => v === "") ? null : r.map((v, k) => st.items[k] + " → " + (v === "" ? "—" : st.choices[+v])).join(" · ");
    case "groups": return r.every(v => v == null) ? null : r.map((v, g) => (v == null ? "—" : groupOpts(i, g)[v])).join(" · ");
    case "drag": return r.every(v => v == null) ? null : r.map((l, z) => st.zones[z] + " = " + (l == null ? "—" : st.labels[l])).join(" · ");
    case "order": return r.map((k, p) => (p + 1) + ". " + st.order[k] + " (" + c.letters[k] + ")").join(" → ");
    case "hsmulti": return r.length ? r.slice().sort((a, b) => a - b).map(k => st.items[k]).join(" ; ") : null;
    case "multi": {
      if (isCorrect) return c.correct.map(k => st.items[k]).join(" ; ");
      if (!r.length) return null;
      const good = r.filter(x => c.correct.indexOf(x) >= 0).length, bad = r.length - good + (c.correct.length - good);
      return fmtT(U("multiAns"), { c: good, n: c.correct.length, w: bad });
    }
  }
  return null;
}
function corrText(i) {
  const c = CFG[i];
  if (c.type === "drag" || c.type === "assoc" || c.type === "order") return ansText(i, c.correct.map(x => c.type === "assoc" ? String(x) : x));
  if (c.type === "groups") return ansText(i, c.groups.map(g => g.correct));
  if (c.type === "multi") return ansText(i, c.correct, true);
  return ansText(i, c.correct);
}

const G = (x, y, inner) => `<g transform="translate(${x} ${y})">${inner}</g>`;

const pump = (x, y, r = 21) => G(x, y, `<circle r="${r}" fill="url(#gBlue)" stroke="#BFE3FF" stroke-width="2"/><circle r="${r * 0.7}" fill="none" stroke="#9FD2FF" stroke-opacity=".45"/><path d="M${-r * 0.38} ${-r * 0.52}L${r * 0.62} 0L${-r * 0.38} ${r * 0.52}Z" fill="#EAF6FF"/>`);
const filterY = (x, y) => G(x, y, '<path d="M-3 4L12 24L21 17L6 -3Z" fill="url(#gBrass)" stroke="#7A5512" stroke-linejoin="round"/><rect x="-15" y="-8" width="30" height="16" rx="3" fill="url(#gBrass)" stroke="#7A5512"/>');
function tag(x, y, t, cls = "") { const w = Math.max(70, t.length * 9.2 + 28); return G(x, y, `<rect class="tagr ${cls}" x="${-w / 2}" y="-17" width="${w}" height="34" rx="17"/><text class="tagt" y="6" text-anchor="middle">${esc(t)}</text>`); }
/* manomètre : valeur v sur l'échelle [min, max] */
function gauge(x, y, r, min, max, v, opt = {}) {
  const f = p => (p - min) / (max - min);
  const A = t => (135 + 270 * t) * Math.PI / 180;
  const pt = (t, rr) => [(rr * Math.cos(A(t))).toFixed(1), (rr * Math.sin(A(t))).toFixed(1)];
  let s = `<circle r="${r + 4}" fill="#C9D6E6"/><circle r="${r}" fill="url(#gWhite)" stroke="#8FA3BD" stroke-width="2"/>`;
  const steps = opt.ticks || [];
  const nmin = opt.minor || 10;
  for (let k = 0; k <= nmin; k++) { const a = pt(k / nmin, r - 3), b = pt(k / nmin, r - 9); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#36506F" stroke-width="1.3"/>`; }
  steps.forEach(p => { const t = f(p), a = pt(t, r - 3), b = pt(t, r - 14), c = pt(t, r - 28); s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${p === 0 && opt.zero ? "#1E7FD0" : "#1B2A41"}" stroke-width="${p === 0 && opt.zero ? 4 : 2.4}"/><text class="gnum" x="${c[0]}" y="${(+c[1] + 6).toFixed(1)}" text-anchor="middle">${esc(nv(String(p)))}</text>`; });
  const n = pt(f(v), r - 12);
  s += `<line x1="0" y1="0" x2="${n[0]}" y2="${n[1]}" stroke="#C21B22" stroke-width="${Math.max(3, r / 22)}" stroke-linecap="round"/><circle r="${Math.max(4, r / 12)}" fill="#0B2350"/>`;
  if (opt.unit) s += `<text class="gunit" y="${(r * 0.55).toFixed(1)}" text-anchor="middle">${esc(opt.unit)}</text>`;
  return G(x, y, s);
}

/* ---------- Ajustement automatique : aucun défilement ---------- */
function setK(k) { document.documentElement.style.setProperty("--k", k.toFixed(2)); }
function overflowing() {
  const els = [main].concat(Array.prototype.slice.call(main.querySelectorAll(".fit")));
  return els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
}
function fit() {
  const root = main.firstElementChild; if (!root) return;
  root.classList.remove("c1", "c2", "c3");
  let k = 1; setK(k);
  while (overflowing() && k > 0.8) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c1"); k = 1; setK(k);
  while (overflowing() && k > 0.76) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c2"); k = 1; setK(k);
  while (overflowing() && k > 0.72) { k -= 0.04; setK(k); }
  if (!overflowing()) return;
  root.classList.add("c3"); k = 1; setK(k);
  while (overflowing() && k > 0.62) { k -= 0.04; setK(k); }
}

/* ---------- Actions ---------- */
function validate() {
  const i = S.i; if (S.done[i] || !complete(i)) return;
  S.done[i] = true; S.ok[i] = check(i); S.sel = null;
  render('[data-key="next"]');
  const st = ST(i);
  announce((S.ok[i] ? U("ok") : U("ko")) + ". " + plain(S.ok[i] ? st.ok : st.ko) + " " + U("remember") + " : " + plain(st.key));
}
function place(l, z) {
  const arr = S.resp[S.i];
  for (let k = 0; k < arr.length; k++) if (arr[k] === l) arr[k] = null;
  arr[z] = l; S.sel = null;
  render(`[data-key="dz-${z}"]`);
  announce(fmtT(U("placed"), { l: ST(S.i).labels[l], z: ST(S.i).zones[z] }));
}
function act(a, b) {
  const i = S.i;
  switch (a) {
    case "start": S.view = "step"; S.i = 0; render("#stTitle"); break;
    case "prev": if (S.i > 0) { S.i--; render("#stTitle"); } else { S.view = "intro"; render("#startBtn"); } break;
    case "next": if (!S.done[i]) return; if (i < N - 1) { S.i++; render("#stTitle"); } else { S.view = "result"; render("#resTitle"); } break;
    case "validate": validate(); break;
    case "pick": if (S.done[i]) return; S.resp[i] = parseInt(b.dataset.v, 10); render(`[data-key="${b.dataset.key}"]`); break;
    case "gpick": {
      if (S.done[i]) return;
      const g = parseInt(b.dataset.g, 10); S.resp[i][g] = parseInt(b.dataset.v, 10);
      render(`[data-key="${b.dataset.key}"]`); break;
    }
    case "up": case "down": {
      if (S.done[i]) return;
      const arr = S.resp[i], item = parseInt(b.dataset.item, 10), p = arr.indexOf(item), q = a === "up" ? p - 1 : p + 1;
      if (q < 0 || q >= arr.length) return;
      arr[p] = arr[q]; arr[q] = item;
      let key = (a === "up" ? "up-" : "dn-") + item;
      if (a === "up" && q === 0) key = "dn-" + item;
      if (a === "down" && q === arr.length - 1) key = "up-" + item;
      render(`[data-key="${key}"]`);
      announce(fmtT(U("moved"), { l: ST(i).order[item], n: q + 1 }));
      break;
    }
    case "htoggle":
    case "toggle": {
      if (S.done[i]) return;
      const v = parseInt(b.dataset.v, 10), arr = S.resp[i], p = arr.indexOf(v);
      if (p >= 0) arr.splice(p, 1); else arr.push(v);
      render(`[data-key="${b.dataset.key}"]`); break;
    }
    case "chip": {
      if (S.done[i]) return;
      if (suppressClick) { suppressClick = false; return; }
      const l = parseInt(b.dataset.l, 10); S.sel = S.sel === l ? null : l;
      if (S.sel != null) { const arr = S.resp[i]; const z = Math.max(0, arr.indexOf(null)); render(`[data-key="dz-${z}"]`); announce(fmtT(U("labelSel"), { l: ST(i).labels[l] })); }
      else render(`[data-key="chip-${l}"]`);
      break;
    }
    case "dz": {
      if (S.done[i]) return;
      const z = parseInt(b.dataset.z, 10);
      if (S.sel != null) place(S.sel, z);
      else if (S.resp[i][z] != null) { S.resp[i][z] = null; render(`[data-key="dz-${z}"]`); announce(fmtT(U("removed"), { z: ST(i).zones[z] })); }
      else announce(U("hDrag"));
      break;
    }
    case "review": S.view = "review"; S.page = 0; render("#rvTitle"); break;
    case "restart": initResp(); S.view = "step"; S.i = 0; render("#stTitle"); break;
    case "back": S.view = "result"; render("#resTitle"); break;
    case "pgprev": if (S.page > 0) { S.page--; render(S.page === 0 ? '[data-key="pgnext"]' : '[data-key="pgprev"]'); } break;
    case "pgnext": if (S.page < pageCount() - 1) { S.page++; render(S.page >= pageCount() - 1 ? '[data-key="pgprev"]' : '[data-key="pgnext"]'); } break;
    case "pause": S.paused = !S.paused; renderPause(); break;
  }
}

/* ---------- Glisser-déposer (souris, stylet, tactile) ---------- */
function onDown(e) { const c = e.target.closest(".chip"); if (!c || c.disabled || S.done[S.i]) return; drag = { l: parseInt(c.dataset.l, 10), x: e.clientX, y: e.clientY, el: c, moved: false, ghost: null }; }
function onMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.moved = true; const g = document.createElement("div"); g.className = "ghost"; g.textContent = drag.el.firstChild.textContent;
    document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("dragging");
  }
  if (drag.moved) {
    e.preventDefault(); drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
    const under = document.elementFromPoint(e.clientX, e.clientY);
    document.querySelectorAll(".dz").forEach(z => z.classList.toggle("hover", !!under && z.contains(under)));
  }
}
function onUp(e) {
  if (!drag) return; const d = drag; drag = null; if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  if (d.ghost) d.ghost.remove(); d.el.classList.remove("dragging");
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under ? under.closest(".dz") : null;
  document.querySelectorAll(".dz").forEach(x => x.classList.remove("hover"));
  if (z && !z.disabled) place(d.l, parseInt(z.dataset.z, 10));
}
function onCancel() { if (drag) { if (drag.ghost) drag.ghost.remove(); drag.el.classList.remove("dragging"); drag = null; } }

/* ---------- Démarrage ---------- */
function init() {
  main = $("#main"); nav = $("#nav"); prog = $("#prog"); live = $("#live");
  $("#langSel").innerHTML = LANGS.map(l => `<option value="${l}" lang="${l}">${esc(L[l].name)}</option>`).join("");
  const rm = window.matchMedia("(prefers-reduced-motion: reduce)");
  S.paused = rm.matches;
  if (rm.addEventListener) rm.addEventListener("change", e => { S.paused = e.matches; renderPause(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return; act(b.dataset.act, b); });
  $("#pauseBtn").addEventListener("click", () => act("pause"));
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "langSel") { S.lang = t.value; render("#langSel"); announce(L[S.lang].name); }
    else if (t.matches("select[data-row]")) { S.resp[S.i][parseInt(t.dataset.row, 10)] = t.value; render("#" + t.id); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel != null) { const l = S.sel; S.sel = null; render(`[data-key="chip-${l}"]`); } });
  document.addEventListener("pointerdown", onDown);
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
  let to = null;
  window.addEventListener("resize", () => { clearTimeout(to); to = setTimeout(() => { if (S.view === "review") render(); else fit(); }, 120); });
  render();
}
if (typeof document !== "undefined" && document.getElementById("app")) init();

})();
</script>
</body>
